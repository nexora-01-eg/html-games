<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهم المركز</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#166534,#14532d);min-height:100vh;display:flex;align-items:center;justify-content:center}
#dartboard{cursor:crosshair;border-radius:50%;box-shadow:0 0 30px rgba(0,0,0,0.5)}
</style>
</head>
<body class="text-white">
<div id="startScreen" class="text-center">
<h1 class="text-4xl font-bold mb-4 text-lime-400">سهم المركز</h1>
<p class="mb-6 text-lg text-gray-300">ارمي السهام نحو المركز</p>
<button onclick="startGame()" class="bg-lime-600 hover:bg-lime-700 text-white px-8 py-3 rounded-xl text-xl font-bold">ابدأ</button>
<div id="best1" class="mt-4 text-sm text-lime-300"></div>
</div>
<div id="playScreen" class="hidden text-center">
<div class="mb-3 text-lg font-bold"><span id="throwDisplay">الرمية: 1/10</span> | <span id="scoreDisplay">النقاط: 0</span></div>
<canvas id="dartboard" width="300" height="300"></canvas>
<p id="statusText" class="mt-4 text-lime-300">اضغط على اللوحة للرمي</p>
</div>
<div id="finishScreen" class="hidden text-center">
<h2 class="text-3xl font-bold mb-4 text-lime-400">انتهت!</h2>
<p id="finalStats" class="text-lg mb-6"></p>
<button onclick="startGame()" class="bg-lime-600 hover:bg-lime-700 text-white px-8 py-3 rounded-xl text-xl font-bold">مرّة أخرى</button>
<button onclick="goHome()" class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-xl text-xl font-bold mt-3">القائمة</button>
</div>
<script>
let score=0,throwCount=0,maxThrows=10,best=0;
try{best=parseInt(localStorage.getItem('dart-board-best'))||0;}catch(e){}
function $(id){return document.getElementById(id)}
function audioCtx(){return new(window.AudioContext||window.webkitAudioContext)()}
function playTone(f,t,d){let c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.12;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.stop(c.currentTime+d);}
function goHome(){$('startScreen').classList.remove('hidden');$('playScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');$('best1').textContent=best?'أفضل نتيجة: '+best+' نقطة':'';}
function startGame(){
$('startScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');$('playScreen').classList.remove('hidden');
score=0;throwCount=0;$('scoreDisplay').textContent='النقاط: 0';$('throwDisplay').textContent='الرمية: 1/10';
$('statusText').textContent='اضغط على اللوحة للرمي';
drawBoard();
}
function drawBoard(){
let c=document.getElementById('dartboard');let ctx=c.getContext('2d');
let cx=150,cy=150,radii=[140,110,80,50,25];
let colors=['#fbbf24','#92400e','#fbbf24','#92400e','#ef4444'];
for(let i=0;i<radii.length;i++){
ctx.beginPath();ctx.arc(cx,cy,radii[i],0,Math.PI*2);ctx.fillStyle=colors[i];ctx.fill();
ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.stroke();
}
ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fillStyle='#dc2626';ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
let labels=[1,2,4,6,8];ctx.fillStyle='white';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
for(let i=0;i<radii.length;i++){let angle=-Math.PI/4;let lx=cx+Math.cos(angle)*(radii[i]-15);let ly=cy+Math.sin(angle)*(radii[i]-15);}
}
function drawDart(x,y,score){
let c=document.getElementById('dartboard');let ctx=c.getContext('2d');
ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=score>=6?'#22c55e':score>=4?'#eab308':'white';
ctx.fill();ctx.strokeStyle='black';ctx.lineWidth=1;ctx.stroke();
}
document.getElementById('dartboard').addEventListener('click',e=>{
if(throwCount>=maxThrows)return;
let rect=e.target.getBoundingClientRect();
let x=e.clientX-rect.left,y=e.clientY-rect.top;
let cx=150,cy=150;
let dist=Math.sqrt(Math.pow(x-cx,2)+Math.pow(y-cy,2));
let pts;
if(dist<=12)pts=10;
else if(dist<=25)pts=8;
else if(dist<=50)pts=6;
else if(dist<=80)pts=4;
else if(dist<=110)pts=2;
else if(dist<=140)pts=1;
else pts=0;
score+=pts;throwCount++;
$('scoreDisplay').textContent='النقاط: '+score;
$('throwDisplay').textContent='الرمية: '+throwCount+'/'+maxThrows;
drawDart(x,y,pts);
if(pts>=8)playTone(880,'sine',0.1);
else if(pts>=4)playTone(660,'triangle',0.1);
else playTone(220,'square',0.1);
if(throwCount>=maxThrows){
if(score>best){best=score;try{localStorage.setItem('dart-board-best',best)}catch(e){};}
$('finalStats').textContent='النتيجة النهائية: '+score+' نقطة';
$('statusText').textContent='انتهت!';
setTimeout(()=>{$('playScreen').classList.add('hidden');$('finishScreen').classList.remove('hidden');},800);
}
});
goHome();
</script>
</body>
</html>
