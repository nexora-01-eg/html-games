<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معركة الرياضيات</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif}
@keyframes punch{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.punch{animation:punch 0.3s}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-red-950 via-slate-900 to-slate-950 text-white">
<div id="startScreen" class="min-h-screen flex flex-col items-center justify-center gap-6 text-center px-6">
  <h1 class="text-5xl font-black">⚔️ معركة الرياضيات</h1>
  <p class="text-xl text-red-200 max-w-lg">واجه الكمبيوتر! كل من يحل المعادلة أسرع يسرق النقاط من الخصم. أول من يصل إلى ١٠٠ نقطة يفوز!</p>
  <div class="bg-red-900/40 rounded-2xl p-5">
    <p class="text-lg mb-1">أفضل نتيجة: <span id="startBest">0</span></p>
    <p class="text-sm text-red-200">٥ جولات لكل منافسة</p>
  </div>
  <button onclick="startGame()" class="bg-red-600 hover:bg-red-500 text-white font-bold text-xl px-10 py-4 rounded-full shadow-lg transition">ابدأ المعركة</button>
</div>

<div id="playScreen" class="hidden min-h-screen flex-col items-center justify-center p-6 gap-5">
  <div class="w-full max-w-2xl flex items-center justify-between bg-slate-800/70 rounded-2xl px-8 py-4">
    <div class="text-center"><p class="text-sm text-red-300">أنت 🤺</p><p id="youScore" class="text-4xl font-black">0</p></div>
    <p class="text-3xl font-black text-red-400">VS</p>
    <div class="text-center"><p class="text-sm text-cyan-300">الكمبيوتر 🤖</p><p id="aiScore" class="text-4xl font-black">0</p></div>
  </div>
  <div class="w-full max-w-2xl text-center bg-slate-800/60 rounded-3xl py-10 shadow-2xl">
    <p id="equation" class="text-5xl font-black tracking-widest">؟</p>
    <p id="status" class="mt-4 text-lg text-slate-300 min-h-7"></p>
  </div>
  <div id="answers" class="grid grid-cols-4 gap-3 max-w-2xl w-full"></div>
  <p class="text-slate-400 text-sm">الجولة: <span id="round" class="font-black text-white">1 / 5</span></p>
</div>

<div id="finishScreen" class="hidden min-h-screen flex-col items-center justify-center gap-5 text-center px-6">
  <h1 id="ftitle" class="text-6xl font-black">انتهت المعركة</h1>
  <p class="text-2xl">أنت: <span id="youFin" class="font-black text-red-400">0</span> — الكمبيوتر: <span id="aiFin" class="font-black text-cyan-400">0</span></p>
  <p id="verdict" class="text-3xl"></p>
  <p class="text-slate-400">أفضل نتيجة: <span id="finishBest">0</span></p>
  <button onclick="backStart()" class="bg-red-600 hover:bg-red-500 font-bold text-xl px-10 py-4 rounded-full shadow-lg transition">العودة للبداية</button>
</div>

<script>
function $(id){return document.getElementById(id)}
let youScore,aiScore,round,operators=['+','-','×'];
let best=0;try{best=+localStorage.getItem('math-duel-best')||0}catch(e){}
$('startBest').textContent=best;$('finishBest').textContent=best;
function tone(f,dur,type='sine',vol=0.2){
  let ac=new (window.AudioContext||window.webkitAudioContext)();
  let o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.start();o.stop(ac.currentTime+dur);
}
function startGame(){
  $('startScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');
  $('finishScreen').classList.remove('flex');
  $('playScreen').classList.remove('hidden');$('playScreen').classList.add('flex');
  youScore=0;aiScore=0;round=0;
  $('youScore').textContent=0;$('aiScore').textContent=0;
  nextRound();
}
function nextRound(){
  round++;
  if(round>5){finish();return}
  $('round').textContent=round+' / 5';
  let op=operators[Math.floor(Math.random()*operators.length)];
  let a,b,ans;
  if(op==='+'){a=Math.floor(Math.random()*50)+10;b=Math.floor(Math.random()*50)+10;ans=a+b}
  else if(op==='-'){a=Math.floor(Math.random()*80)+20;b=Math.floor(Math.random()*a);ans=a-b}
  else{a=Math.floor(Math.random()*10)+2;b=Math.floor(Math.random()*10)+2;ans=a*b}
  $('equation').textContent=a+' '+op+' '+b+' = ؟';
  $('status').textContent='من يضغط الإجابة الصحيحة أولاً يسرق النقاط!';
  $('status').className='mt-4 text-lg text-amber-300 min-h-7';
  buildAnswers(ans);
  aiSolve(ans);
}
function buildAnswers(ans){
  let box=$('answers');box.innerHTML='';
  let vals=new Set([ans]);
  while(vals.size<6){vals.add(ans+Math.floor(Math.random()*15)-7)}
  let arr=[...vals].sort(()=>Math.random()-0.5);
  arr.forEach(v=>{
    let b=document.createElement('button');
    b.className='bg-slate-700 hover:bg-slate-600 rounded-2xl py-5 text-2xl font-black shadow-lg transition';
    b.textContent=v;b.dataset.v=v;
    b.onclick=()=>youAnswer(b,v,ans);
    box.appendChild(b);
  });
}
function youAnswer(b,v,ans){
  let all=document.querySelectorAll('#answers button');
  all.forEach(x=>x.style.pointerEvents='none');
  if(v===ans){
    b.classList.add('punch');b.style.background='#34d399';
    steal(15,'you');tone(700,0.2,'triangle',0.2);
  }else{
    b.style.background='#f87171';tone(150,0.3,'sawtooth',0.2);
    aiSteal(10,ans);
  }
}
function aiSolve(ans){
  let delay=700+Math.random()*1400;
  setTimeout(()=>{
    let playing=!$('playScreen').classList.contains('hidden');
    if(!playing)return;
    setTimeout(()=>{
      if(youScore>=100||aiScore>=100){finish();return}
      aiSteal(12,ans);
    },delay);
  },100);
}
function aiSteal(pts,ans){
  let all=document.querySelectorAll('#answers button');
  all.forEach(x=>x.style.pointerEvents='none');
  aiScore+=pts;
  showFlash(all,ans);
  tone(400,0.2,'square',0.15);
  $('status').textContent='الكمبيوتر أسرع! سرق '+pts+' نقطة 😡';
  $('status').className='mt-4 text-lg text-cyan-300 min-h-7';
  $('aiScore').textContent=aiScore;
  setTimeout(nextRound,900);
}
function steal(pts,who){
  if(who==='you'){youScore+=pts;$('youScore').textContent=youScore;$('status').textContent='أحسنت! سرقت '+pts+' نقطة 🎉';$('status').className='mt-4 text-lg text-emerald-300 min-h-7'}
  setTimeout(nextRound,900);
}
function showFlash(all,ans){
  all.forEach(x=>{if(+x.dataset.v===ans)x.style.background='#22d3ee'});
}
function finish(){
  if(youScore>best){best=youScore;try{localStorage.setItem('math-duel-best',best)}catch(e){}}
  $('youFin').textContent=youScore;$('aiFin').textContent=aiScore;$('finishBest').textContent=best;
  let win=youScore>=aiScore;
  $('ftitle').textContent=win?'🏆 انتصرت!':'🤖 الكمبيوتر انتصر';
  $('verdict').textContent=win?'أنت بطل الرياضيات!':'حاول مرة أخرى، سرع من ردودك';
  $('finishScreen').classList.remove('hidden');$('finishScreen').classList.add('flex');
  $('playScreen').classList.remove('flex');$('playScreen').classList.add('hidden');
  tone(win?800:150,0.3,win?'triangle':'sawtooth',0.2);
}
function backStart(){
  $('playScreen').classList.remove('flex');$('playScreen').classList.add('hidden');
  $('finishScreen').classList.remove('flex');$('finishScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');$('startScreen').classList.add('flex');
}
</script>
</body>
</html>
