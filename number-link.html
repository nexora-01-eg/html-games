<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصّل الأرقام</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body { font-family: 'Cairo', sans-serif; }
</style>
</head>
<body class="bg-gradient-to-br from-teal-50 to-cyan-100 min-h-screen flex items-center justify-center">
<div class="text-center w-full max-w-lg mx-auto p-4">
<div id="start-screen">
<div class="bg-white rounded-3xl shadow-xl p-8">
<div class="text-6xl mb-4">🔗</div>
<h1 class="text-3xl font-bold text-slate-800 mb-2">وصّل الأرقام</h1>
<p class="text-slate-500 mb-6">وصّل الأرقام المتشابهة دون تقاطع المسارات</p>
<div class="bg-teal-50 rounded-xl p-4 mb-6">
<p class="text-sm text-slate-600">الأفضل: <span id="best-display" class="font-bold text-teal-600">0</span></p>
</div>
<button onclick="startGame()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-8 rounded-xl text-lg transition">ابدأ اللعب</button>
</div>
</div>
<div id="play-screen" class="hidden">
<div class="bg-white rounded-3xl shadow-xl p-6">
<div class="flex justify-between items-center mb-4">
<span class="text-slate-600 font-bold">اللغز: <span id="round-display">1</span>/5</span>
<span class="text-teal-600 font-bold">النقاط: <span id="score-display">0</span></span>
</div>
<div id="game-board" class="mx-auto mb-4" style="width:fit-content"></div>
<p class="text-slate-500 text-xs mb-2">انقر على خلية ثم خلية أخرى للرسم</p>
<div class="flex gap-2 justify-center mb-3">
<button onclick="clearPaths()" class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-1 px-4 rounded-lg text-sm">مسح</button>
<button onclick="checkSolution()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-1 px-4 rounded-lg text-sm">تحقق</button>
</div>
<div id="feedback" class="h-6 text-sm font-bold"></div>
</div>
</div>
<div id="finish-screen" class="hidden">
<div class="bg-white rounded-3xl shadow-xl p-8">
<div class="text-6xl mb-4">🎉</div>
<h2 class="text-2xl font-bold text-slate-800 mb-2">انتهت اللعبة!</h2>
<p class="text-slate-500 mb-2">النقاط: <span id="final-score" class="font-bold text-teal-600"></span></p>
<p class="text-slate-500 mb-6">الأفضل: <span id="final-best" class="font-bold text-teal-600"></span></p>
<button onclick="location.reload()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-8 rounded-xl text-lg transition">العب مرة أخرى</button>
</div>
</div>
</div>
<script>
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, type, dur) {
initAudio();
let o = audioCtx.createOscillator();
let g = audioCtx.createGain();
o.type = type; o.frequency.value = freq;
o.connect(g); g.connect(audioCtx.destination);
g.gain.setValueAtTime(0.3, audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
o.start(); o.stop(audioCtx.currentTime + dur);
}
let puzzles = [
{size:4,pairs:[{n:1,from:[0,0],to:[3,3]},{n:2,from:[0,3],to:[3,0]},{n:3,from:[1,0],to:[2,3]}]},
{size:4,pairs:[{n:1,from:[0,0],to:[3,2]},{n:2,from:[0,2],to:[3,0]},{n:3,from:[1,1],to:[2,2]},{n:4,from:[0,1],to:[2,0]}]},
{size:5,pairs:[{n:1,from:[0,0],to:[4,4]},{n:2,from:[0,4],to:[4,0]},{n:3,from:[0,2],to:[4,2]},{n:4,from:[2,0],to:[2,4]},{n:5,from:[1,1],to:[3,3]}]},
{size:5,pairs:[{n:1,from:[0,0],to:[4,1]},{n:2,from:[0,1],to:[4,0]},{n:3,from:[0,3],to:[4,4]},{n:4,from:[2,0],to:[2,4]},{n:5,from:[1,2],to:[3,2]},{n:6,from:[0,4],to:[3,0]}]},
{size:6,pairs:[{n:1,from:[0,0],to:[5,5]},{n:2,from:[0,5],to:[5,0]},{n:3,from:[0,2],to:[5,3]},{n:4,from:[2,0],to:[3,5]},{n:5,from:[1,1],to:[4,4]},{n:6,from:[0,4],to:[5,1]},{n:7,from:[2,3],to:[4,1]}]}
];
let round = 0, score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('num-link-best') || '0'); } catch(e) {}
let grid = [], pairMap = {}, paths = {};
let currentPair = null, selecting = false;
function startGame() {
initAudio(); round = 0; score = 0;
$('start-screen').classList.add('hidden');
$('play-screen').classList.remove('hidden');
nextRound();
}
function nextRound() {
if (round >= puzzles.length) { endGame(); return; }
round++;
$('round-display').textContent = round;
$('score-display').textContent = score;
$('feedback').textContent = '';
let pz = puzzles[round - 1];
let sz = pz.size;
grid = [];
pairMap = {};
paths = {};
currentPair = null;
selecting = false;
for (let i = 0; i < sz; i++) {
grid[i] = [];
for (let j = 0; j < sz; j++) grid[i][j] = 0;
}
pz.pairs.forEach(p => {
grid[p.from[0]][p.from[1]] = p.n;
grid[p.to[0]][p.to[1]] = p.n;
pairMap[p.n] = {from:p.from, to:p.to};
paths[p.n] = [];
});
renderBoard(sz);
}
function renderBoard(sz) {
let container = $('game-board');
container.innerHTML = '';
let cellSize = 50;
container.style.display = 'grid';
container.style.gridTemplateColumns = `repeat(${sz}, ${cellSize}px)`;
for (let i = 0; i < sz; i++) {
for (let j = 0; j < sz; j++) {
let cell = document.createElement('div');
cell.style.width = cellSize + 'px';
cell.style.height = cellSize + 'px';
cell.className = 'border border-teal-200 rounded flex items-center justify-center text-lg font-bold cursor-pointer transition hover:bg-teal-50';
cell.style.background = '#f0fdfa';
let val = grid[i][j];
for (let pn in paths) {
let pp = paths[pn];
if (pp.some(p => p[0]===i && p[1]===j)) {
let pc = document.createElement('div');
pc.style.cssText = 'width:100%;height:100%;position:absolute;border-radius:4px;opacity:0.3;';
pc.style.background = getColor(parseInt(pn));
cell.style.position = 'relative';
cell.appendChild(pc);
}
}
if (val > 0) {
cell.textContent = val;
cell.style.background = getColor(val);
cell.style.color = 'white';
cell.style.position = 'relative';
cell.style.zIndex = '1';
}
cell.onclick = () => onCellClick(i, j);
container.appendChild(cell);
}
}
}
function getColor(n) {
let colors = ['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#ec4899'];
return colors[(n - 1) % colors.length];
}
function onCellClick(r, c) {
initAudio();
let val = grid[r][c];
if (val > 0) {
currentPair = val;
selecting = true;
playSound(440, 'triangle', 0.1);
} else if (selecting && currentPair) {
let pp = paths[currentPair];
let last = pp.length > 0 ? pp[pp.length - 1] : pairMap[currentPair].from;
if (Math.abs(last[0]-r) + Math.abs(last[1]-c) === 1) {
if (!pp.some(p => p[0]===r && p[1]===c)) {
pp.push([r, c]);
playSound(523, 'sine', 0.05);
let target = pairMap[currentPair].to;
if (r === target[0] && c === target[1]) {
selecting = false;
currentPair = null;
}
renderBoard(grid.length);
return;
}
}
}
renderBoard(grid.length);
}
function clearPaths() {
initAudio();
for (let pn in paths) paths[pn] = [];
selecting = false;
currentPair = null;
renderBoard(grid.length);
playSound(330, 'square', 0.1);
}
function checkSolution() {
initAudio();
let allDone = true;
let pz = puzzles[round - 1];
pz.pairs.forEach(p => {
let pp = paths[p.n];
if (pp.length === 0) allDone = false;
let last = pp[pp.length - 1];
if (!last || last[0] !== p.to[0] || last[1] !== p.to[1]) allDone = false;
});
if (allDone) {
playSound(523, 'sine', 0.3);
score += 20;
$('score-display').textContent = score;
$('feedback').textContent = '✅ صحيح!';
$('feedback').className = 'h-6 text-sm font-bold text-emerald-600';
round++;
setTimeout(nextRound, 1000);
} else {
playSound(200, 'square', 0.3);
$('feedback').textContent = '❌ لم تكمل جميع المسارات';
$('feedback').className = 'h-6 text-sm font-bold text-red-600';
}
}
function endGame() {
$('play-screen').classList.add('hidden');
$('finish-screen').classList.remove('hidden');
$('final-score').textContent = score;
if (score > best) { best = score; try { localStorage.setItem('num-link-best', best); } catch(e) {} }
$('final-best').textContent = best;
playSound(660, 'triangle', 0.5);
}
function $(id) { return document.getElementById(id); }
$('best-display').textContent = best;
</script>
</body>
</html>
