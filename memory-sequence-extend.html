<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدّ التسلسل - لعبة الذاكرة</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 min-h-screen flex items-center justify-center text-white">
<div id="app" class="w-full max-w-md p-6">
<div id="startScreen" class="text-center">
<h1 class="text-4xl font-black mb-4">🎯 مدّ التسلسل</h1>
<p class="text-slate-300 mb-6">أكمل التسلسل العددي المتنامي في ١٠ جولات!</p>
<button id="startBtn" class="px-8 py-4 bg-indigo-500 hover:bg-indigo-400 rounded-2xl text-xl font-bold shadow-lg">ابدأ اللعب</button>
<div class="mt-6 text-sm text-slate-400">الأفضل: <span id="bestDisplay">٠</span></div>
</div>
<div id="playScreen" class="hidden text-center">
<div class="flex justify-between items-center mb-4 text-sm">
<span>الجولة: <span id="round">١</span>/١٠</span>
<span>النقاط: <span id="score">٠</span></span>
</div>
<div id="exprBox" class="bg-slate-800 rounded-2xl p-8 text-3xl font-bold mb-4" dir="ltr">٢ ، ٤ ، ٦ ، ؟</div>
<div class="text-slate-300 mb-3 text-sm">ما الرقم التالي؟</div>
<div class="grid grid-cols-3 gap-3 mb-4">
<button class="opt py-3 bg-slate-800 rounded-xl hover:bg-slate-700">٨</button>
<button class="opt py-3 bg-slate-800 rounded-xl hover:bg-slate-700">٧</button>
<button class="opt py-3 bg-slate-800 rounded-xl hover:bg-slate-700">٩</button>
</div>
<div id="msg" class="text-sm h-6"></div>
</div>
<div id="finishScreen" class="hidden text-center">
<h2 class="text-3xl font-black mb-4">انتهت اللعبة! 🎉</h2>
<p class="text-xl mb-4">نتيجتك: <span id="finalScore">٠</span></p>
<p id="isNewBest" class="text-yellow-400 text-sm mb-6">🎖️ رقم قياسي جديد!</p>
<div class="text-slate-400 mb-6">الأفضل: <span id="finalBest">٠</span></div>
<button id="restartBtn" class="px-8 py-4 bg-indigo-500 hover:bg-indigo-400 rounded-2xl text-xl font-bold">العب مرة أخرى</button>
</div>
</div>
<script>
let ctx, best, round, score, correct, seq, startNum, delayId;
function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();try{best=parseInt(localStorage.getItem('mem-seq-ext-best')||'0')||0;}catch(e){best=0;}document.getElementById('bestDisplay').textContent=best;}
function tone(f,x,d){let o=ctx.createOscillator(),g=ctx.createGain();o.type=f;o.frequency.value=x;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d);}
function setScreen(s){document.getElementById('startScreen').classList.toggle('hidden',s!=='start');document.getElementById('playScreen').classList.toggle('hidden',s!=='play');document.getElementById('finishScreen').classList.toggle('hidden',s!=='finish');}
function toAr(n){return n.toLocaleString('ar-EG');}
function newSeq(){let diff=2,val=2,arr=[];for(let i=0;i<round+2;i++){arr.push(val);val+=diff;}return arr;}
function showSeq(){seq=newSeq();let display=seq.slice(0,seq.length-1).map(toAr).join(' ، ')+' ، ؟';document.getElementById('exprBox').textContent=display;let next=seq[seq.length-1];let wrong1=next+(round*2),wrong2=next+(round*2+1);let opts=[next,wrong1,wrong2].sort(()=>Math.random()-0.5);let bs=document.querySelectorAll('.opt');for(let i=0;i<3;i++){bs[i].textContent=toAr(opts[i]);bs[i].data=opts[i];}correct=next;}
function nextRound(){if(round>10){finish();return;}document.getElementById('round').textContent=toAr(round);showSeq();document.getElementById('msg').textContent='';tone('sine',600,0.1);}
document.getElementById('startBtn').onclick=function(){if(!ctx)init();round=1;score=0;tone('sine',500,0.15);setScreen('play');nextRound();};
document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(parseInt(b.data)===correct){score+=100+round*10;tone('square',700,0.1);setTimeout(()=>tone('square',900,0.1),100);document.getElementById('msg').textContent='✅ إجابة صحيحة!';}else{tone('sawtooth',200,0.2);document.getElementById('msg').textContent='❌ الصحيح: '+toAr(correct);}document.getElementById('score').textContent=toAr(score);clearTimeout(delayId);delayId=setTimeout(function(){round++;nextRound();},1200);};});
function finish(){setScreen('finish');document.getElementById('finalScore').textContent=toAr(score);let nb=false;if(score>best){best=score;try{localStorage.setItem('mem-seq-ext-best',String(best));}catch(e){}nb=true;}document.getElementById('isNewBest').classList.toggle('hidden',!nb);document.getElementById('finalBest').textContent=toAr(best);tone('triangle',800,0.2);setTimeout(()=>tone('triangle',1000,0.2),150);}
document.getElementById('restartBtn').onclick=function(){setScreen('start');init();};
init();
</script>
</body>
</html>
