<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أقحوانة الحبر 🌸</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#faf7f2;color:#171310;min-height:100vh;overflow:hidden}
.hinomaru{position:fixed;top:-90px;left:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#d33 0%,#b3202e 70%);opacity:.92}
.petal{position:fixed;top:-5vh;font-size:1rem;opacity:.75;animation:pfall linear infinite;pointer-events:none}
@keyframes pfall{to{transform:translateY(110vh) rotate(340deg)}}
.frame{background:#fffdf9;border:2px solid #171310;box-shadow:0 14px 44px rgba(23,19,16,.14)}
#arena{position:relative;height:min(56vh,430px);overflow:hidden;background:
repeating-linear-gradient(0deg,transparent 0 27px,rgba(23,19,16,.05) 27px 28px)}
.dangerline{position:absolute;bottom:34px;left:0;right:0;height:3px;background:#b3202e}
.dangerlbl{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.35em;color:#b3202e;font-weight:800}
.fword{position:absolute;font-weight:900;font-size:1.25rem;color:#171310;background:#fff;padding:2px 12px;border:2px solid #171310;border-radius:999px;white-space:nowrap}
.fword.boom{animation:boom .25s forwards}
@keyframes boom{to{transform:scale(1.5);opacity:0;background:#f8d0da;border-color:#b3202e}}
.chipj{font-weight:800;font-size:.85rem;padding:.32rem 1rem;border-radius:999px;background:#fff;border:1.5px solid #171310}
.seal{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:3px solid #b3202e;border-radius:8px;color:#b3202e;font-weight:900;transform:rotate(-6deg)}
input:focus{outline:none;border-color:#b3202e!important}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body class="select-none">
<div class="hinomaru"></div>

<main class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">

<div id="startScr" class="frame px-10 py-12 text-center max-w-lg">
<div class="seal mb-3 ml-auto">書</div>
<h1 class="text-4xl md:text-5xl font-black mb-3">أقحوانة الحبر</h1>
<p class="leading-relaxed mb-2">كلمات عربية تهبط بلا رحمة…<br><b>اكتب أي كلمة كاملة</b> لتقطعها في الهواء!</p>
<p class="text-sm opacity-65 mb-8">٣ قلوب · كلما نزلت أقرب للخط القرمزي زادت نقاطها<br>لا حاجة لزر إدخال — المطابقة لحظية ⛩️</p>
<button onclick="start()" class="w-full sm:w-auto mt-2 px-10 py-3 rounded-full font-black text-white transition-transform hover:scale-[1.03]" style="background:#171310">ابدأ الكتابة ✍️</button>
<p class="mt-6 text-sm opacity-60">أفضل نتيجة: <span id="bestStart" class="font-bold text-[#b3202e]">—</span></p>
</div>

<div id="playScr" class="hidden w-full max-w-lg">
<div class="flex justify-between items-center mb-3">
<span class="chipj">⭐ <span id="scoreEl" class="font-black text-[#b3202e]">٠</span></span>
<span class="chipj">✂️ <span id="killsEl" class="font-black">٠</span></span>
<span class="chipj" id="heartsEl">❤️❤️❤️</span>
</div>
<div id="arenaWrap" class="frame p-2">
<div id="arena"><div class="dangerline"></div><div class="dangerlbl">底 LINE</div></div>
<input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا…"
class="w-full mt-2 text-center text-xl font-black rounded-full border-4 border-black py-2 transition-colors">
</div>
</div>

<div id="endScr" class="hidden frame px-12 py-12 text-center max-w-md w-full">
<div class="seal mx-auto mb-3">終</div>
<h2 class="text-3xl font-black mb-5">نفد الحبر!</h2>
<div class="flex gap-10 justify-center mb-4">
<div><div id="finalScore" class="text-4xl font-black text-[#b3202e]">٠</div><div class="text-xs opacity-60 mt-1">النقاط</div></div>
<div><div id="finalKills" class="text-4xl font-black">٠</div><div class="text-xs opacity-60 mt-1">كلمة مقطوعة</div></div>
</div>
<p id="endMsg" class="opacity-70 mb-8"></p>
<button onclick="start()" class="px-10 py-3 rounded-full font-black text-white hover:brightness-125 transition" style="background:#171310">لفّة جديدة ↻</button>
</div>

</main>

<script>
const $=id=>document.getElementById(id);
const bestKey='sakura-typing-best';
const WORDS=['قلم','حبر','ورقة','شمس','قمر','نجمة','بحر','جبل','طير','زهرة','سيف','درع','نهر','غيم','مطر','ريح','شجر','فجر','عصر','ليل','نهار','صحراء','مدينة','قصر','باب','نافذة','خيط','إبرة','قطن','حرير','تنين','فوانيس','ساكورا','معبد','حدوة','كيمونو','شاي','أرز','سمك','جسر'];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let words=[],lives=3,score=0,kills=0,t0=0,spawnTimer=null,raf=null,lastTs=0,over=true,ac=null;
function snd(f,d,type,g){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'triangle';o.frequency.value=f;v.gain.setValueAtTime(g||.05,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12));}catch(e){}}
function loadBest(){try{const v=+localStorage.getItem(bestKey)||0;$('bestStart').textContent=v?AR(v):'—';}catch(e){}}
loadBest();
for(let i=0;i<10;i++){
const p=document.createElement('span');
p.className='petal';p.textContent='🌸';
p.style.left=Math.random()*100+'vw';
p.style.fontSize=(.7+Math.random()*.9)+'rem';
p.style.animationDuration=(6+Math.random()*8)+'s';
p.style.animationDelay=(Math.random()*9)+'s';
document.body.appendChild(p);
}
function elapsed(){return (performance.now()-t0)/1000;}
function spawn(){
if(over)return;
const text=WORDS[Math.floor(Math.random()*WORDS.length)];
const el=document.createElement('div');
el.className='fword';el.textContent=text;
const arena=$('arena');
el.style.top='-30px';
el.style.left=(8+Math.random()*62)+'%';
arena.appendChild(el);
words.push({text,el,y:-30});
scheduleSpawn();
}
function scheduleSpawn(){
clearTimeout(spawnTimer);
const gap=Math.max(850,2100-elapsed()*22);
spawnTimer=setTimeout(spawn,gap);
}
function tick(ts){
if(over)return;
const dt=Math.min(.06,((ts||0)-lastTs)/1000||0);
lastTs=ts||0;
const sp=Math.min(135,42+elapsed()*1.15);
const H=$('arena').clientHeight;
for(let i=words.length-1;i>=0;i--){
const w=words[i];
w.y+=sp*dt;
w.el.style.top=w.y+'px';
if(w.y>=H-72){
w.el.remove();words.splice(i,1);
loseLife();
}
}
raf=requestAnimationFrame(tick);
}
function loseLife(){
lives--;
$('heartsEl').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
$('arenaWrap').classList.add('shake');
setTimeout(()=>$('arenaWrap').classList.remove('shake'),420);
snd(120,.3,'sawtooth',.06);
if(lives<=0)finish();
}
$('inp').addEventListener('input',()=>{
if(over)return;
const v=$('inp').value.trim();
if(!v)return;
const idx=words.findIndex(w=>w.text===v);
if(idx>-1){
const w=words[idx];
const H=$('arena').clientHeight;
const prox=Math.max(0,Math.min(1,(w.y-(H*.35))/(H*.55)));
const gain=w.text.length*6+Math.round(prox*24);
score+=gain;kills++;
$('scoreEl').textContent=AR(score);
$('killsEl').textContent=AR(kills);
w.el.classList.add('boom');
setTimeout(()=>w.el.remove(),250);
words.splice(idx,1);
$('inp').value='';
snd(500+w.text.length*45,.09,'triangle',.06);
setTimeout(()=>snd(900,.1,'triangle',.05),80);
}
});
function start(){
words.forEach(w=>w.el.remove());
words=[];lives=3;score=0;kills=0;lastTs=0;
$('scoreEl').textContent='٠';$('killsEl').textContent='٠';
$('heartsEl').textContent='❤️❤️❤️';
$('inp').disabled=false;$('inp').value='';
$('endScr').classList.add('hidden');$('startScr').classList.add('hidden');
$('playScr').classList.remove('hidden');
t0=performance.now();
over=false;
setTimeout(()=>$('inp').focus(),60);
scheduleSpawn();
raf=requestAnimationFrame(tick);
snd(520,.1,'triangle',.05);
}
function finish(){
clearInterval(spawnTimer);
cancelAnimationFrame(raf);
over=true;
$('inp').blur();
$('playScr').classList.add('hidden');
$('endScr').classList.remove('hidden');
$('finalScore').textContent=AR(score);
$('finalKills').textContent=AR(kills);
const v=+localStorage.getItem(bestKey)||0;
let m=kills>=25?'سيف لغوي حاد! 🗡️':kills>=12?'خط رفيع ومتقن 🖌️':'الحبر غلبك اليوم 😅';
if(score>v&&score>0){try{localStorage.setItem(bestKey,score);}catch(e){}m+=' رقم قياسي جديد 🏆';loadBest();}
$('endMsg').textContent=m;
[600,440].forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle',.04),i*150));
}
</script>
</body>
</html>
