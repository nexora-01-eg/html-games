<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>فكّ الشيفرة</title></head><body class="bg-gradient-to-b from-slate-800 to-slate-900 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-green-300"><h1 class="text-4xl font-bold mb-4">فكّ الشيفرة</h1><p class="text-green-400 mb-6">شاهد كود مورس واكتب الحرف الصحيح قبل انتهاء الوقت!</p><p class="text-sm text-green-500 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-green-600 hover:bg-green-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-slate-700 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-green-300 font-bold mb-4"><span>الجولة: <span id="round">1</span>/12</span><span>المؤقت: <span id="timer">10</span></span></div><div class="bg-slate-900 rounded-lg p-6 text-center mb-4"><div id="morse" class="text-3xl text-green-400 font-bold tracking-widest"></div></div><div class="grid grid-cols-3 gap-2" id="letterBtns"></div><p class="text-center text-green-400 mt-3 text-sm">اختر الحرف الصحيح</p></div></div><div id="finish-screen" class="hidden text-center text-green-300"><h2 class="text-3xl font-bold mb-4">انتهت الجولات!</h2><p class="text-2xl text-green-400 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-green-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-green-600 hover:bg-green-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentRound=1,playerScore=0,timerId=null,timeLeft=10,currentLetter='',audioCtx;const LETTERS={A:'أ',B:'ب',C:'ج',D:'د',E:'هـ',F:'و',G:'ز',H:'ح',I:'ط',J:'ي',K:'ك',L:'ل'};const MORSE={A:'.-',B:'-...',C:'-.-.',D:'-..',E:'.',F:'..-.',G:'--.',H:'....',I:'..',J:'.---',K:'-.-',L:'.-..'};function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function beep(f,d){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.2;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function playMorse(m){let t=0;for(let ch of m){setTimeout(function(){beep(ch==='.'?800:400,0.1)},t*500);t+=ch==='.'?1:2}setTimeout(function(){beep(100,0.3)},t*500)}function getBest(){try{return parseInt(localStorage.getItem('morse-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('morse-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentRound=1;playerScore=0;showScreen('play-screen');nextRound()}function nextRound(){if(timerId)clearInterval(timerId);let keys=Object.keys(MORSE);currentLetter=keys[Math.floor(Math.random()*keys.length)];$('round').textContent=currentRound;$('morse').textContent=MORSE[currentLetter];playMorse(MORSE[currentLetter]);let wrong=LETTERS[currentLetter];let opts=[wrong];let others=Object.values(LETTERS).filter(x=>x!==wrong);while(opts.length<4){let r=others[Math.floor(Math.random()*others.length)];if(opts.indexOf(r)<0)opts.push(r)}opts.sort(function(){return Math.random()-0.5});let box=$('letterBtns');box.innerHTML='';for(let i=0;i<opts.length;i++){let b=document.createElement('button');b.textContent=opts[i];b.className='bg-green-600 hover:bg-green-500 text-white text-2xl py-3 rounded-lg font-bold';b.addEventListener('click',function(){answer(opts[i])});box.appendChild(b)}timeLeft=10;$('timer').textContent=timeLeft;timerId=setInterval(function(){timeLeft--;$('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(timerId);endGame(true)}},1000)}function answer(sel){if(currentLetter==='')return;clearInterval(timerId);let correct=LETTERS[currentLetter];currentLetter='';if(sel===correct){playerScore+=100+timeLeft*10;playMorse('.-')}else{playerScore+=Math.max(0,timeLeft*5);playMorse('-...')}currentRound++;if(currentRound>12){endGame(false)}else{nextRound()}}function endGame(f){if(f){playerScore+=20}let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}showStart()</script></body></html>
