<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تذكّر الإيموجي</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-500 via-rose-500 to-orange-400 min-h-screen flex items-center justify-center">
<div id="app" class="w-full max-w-md p-6 bg-white/90 rounded-3xl shadow-2xl text-center">
<div id="startScreen">
<h1 class="text-4xl font-black mb-4">🧠 تذكّر الإيموجي</h1>
<p class="text-slate-600 mb-6">تذكّر إيموجي الوجه في موضعه ثم اختره من القائمة!</p>
<button id="startBtn" class="px-8 py-4 bg-rose-500 hover:bg-rose-400 text-white rounded-2xl text-xl font-bold shadow-lg">ابدأ اللعب</button>
<div class="mt-6 text-sm text-slate-500">الأفضل: <span id="bestDisplay">٠</span></div>
</div>
<div id="playScreen" class="hidden">
<div class="flex justify-between items-center mb-4 text-sm font-bold">
<span>الجولة: <span id="round">١</span>/٨</span>
<span>النقاط: <span id="score">٠</span></span>
</div>
<div id="grid" class="grid grid-cols-3 gap-2 mb-5 mx-auto max-w-xs"></div>
<div id="taskMsg" class="text-slate-700 font-bold mb-3"></div>
<div id="choices" class="grid grid-cols-4 gap-2 mx-auto max-w-xs"></div>
<div id="msg" class="text-sm h-6 mt-3"></div>
</div>
<div id="finishScreen" class="hidden">
<h2 class="text-3xl font-black mb-4">انتهت اللعبة! 🎉</h2>
<p class="text-xl mb-4">نتيجتك: <span id="finalScore">٠</span></p>
<p id="isNewBest" class="text-yellow-500 text-sm mb-6">🎖️ رقم قياسي جديد!</p>
<div class="text-slate-500 mb-6">الأفضل: <span id="finalBest">٠</span></div>
<button id="restartBtn" class="px-8 py-4 bg-rose-500 hover:bg-rose-400 text-white rounded-2xl text-xl font-bold">العب مرة أخرى</button>
</div>
</div>
<script>
let ctx,best,round,score,targetEmoji,targetPos,emojiSet,showTimer;
const EMOJIS=['😀','😁','😂','🤣','😊','😍','😜','🤩','😎','🥳','😇','🙃'];
function init(){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}best=0;try{best=parseInt(localStorage.getItem('emoji-mem-face-best')||'0')||0;}catch(e){}document.getElementById('bestDisplay').textContent=best;}
function tone(f,x,d){let o=ctx.createOscillator(),g=ctx.createGain();o.type=f;o.frequency.value=x;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d);}
function setScreen(s){document.getElementById('startScreen').classList.toggle('hidden',s!=='start');document.getElementById('playScreen').classList.toggle('hidden',s!=='play');document.getElementById('finishScreen').classList.toggle('hidden',s!=='finish');}
function toAr(n){return n.toLocaleString('ar-EG');}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let t=a[i];a[i]=a[j];a[j]=t;}return a;}
function newRound(){let size=Math.min(4+Math.floor(round/2),6);let all=shuffle(EMOJIS.slice());emojiSet=all.slice(0,size);targetPos=Math.floor(Math.random()*size);targetEmoji=emojiSet[targetPos];let g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<size;i++){let d=document.createElement('div');d.className='aspect-square rounded-xl bg-yellow-100 text-3xl flex items-center justify-center';d.textContent=emojiSet[i];g.appendChild(d);}document.getElementById('taskMsg').textContent='تذكّر الإيموجي في كل موضع...';showTimer=setTimeout(function(){let cells=g.children;for(let i=0;i<cells.length;i++){cells[i].textContent='❓';cells[i].style.background='#e2e8f0';}document.getElementById('taskMsg').textContent='أيّ إيموجي كان في هذا الموضع؟';makeChoices();},Math.max(1000,2500-round*150));}
function makeChoices(){let g=document.getElementById('grid');highlightPos(g.children[targetPos]);let pool=shuffle(EMOJIS.slice()).slice(0,5);if(pool.indexOf(targetEmoji)===-1){pool[0]=targetEmoji;}pool=shuffle(pool);let c=document.getElementById('choices');c.innerHTML='';for(let i=0;i<6;i++){let e=pool[i];let b=document.createElement('button');b.className='py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-2xl';b.textContent=e;b.onclick=function(){choose(e);};c.appendChild(b);}}
function highlightPos(cell){cell.style.background='#fbbf24';cell.textContent='➡️';}
function choose(e){clearTimeout(showTimer);let g=document.getElementById('grid');g.innerHTML='';if(e===targetEmoji){score+=100+round*10;tone('square',700,0.1);setTimeout(()=>tone('square',900,0.1),100);document.getElementById('msg').textContent='✅ صحيح!';}else{tone('sawtooth',200,0.2);document.getElementById('msg').textContent='❌ الصحيح: '+targetEmoji;}document.getElementById('score').textContent=toAr(score);setTimeout(function(){round++;document.getElementById('msg').textContent='';document.getElementById('choices').innerHTML='';if(round>8){finish();}else{newRound();}},1200);}
function finish(){setScreen('finish');document.getElementById('finalScore').textContent=toAr(score);let nb=false;if(score>best){best=score;try{localStorage.setItem('emoji-mem-face-best',String(best))}catch(e){}nb=true;}document.getElementById('isNewBest').classList.toggle('hidden',!nb);document.getElementById('finalBest').textContent=toAr(best);tone('triangle',800,0.2);setTimeout(()=>tone('triangle',1000,0.2),150);}
document.getElementById('startBtn').onclick=function(){if(!ctx)init();round=1;score=0;tone('sine',500,0.15);setScreen('play');newRound();};
document.getElementById('restartBtn').onclick=function(){setScreen('start');init();};
init();
</script>
</body>
</html>
