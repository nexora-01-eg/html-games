<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيّاد السمك 🐠</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#fff3e4;color:#0a6e7c;min-height:100vh;overflow-x:hidden}
.wave-deco{position:absolute;font-size:1.6rem;opacity:.75}
#arena{background:linear-gradient(180deg,#c9edf2,#9fdce6);border:5px solid #90e0ef;border-radius:1.8rem;box-shadow:inset 0 0 60px rgba(0,180,216,.18),0 14px 40px rgba(0,140,170,.22)}
.target{position:absolute;width:64px;height:64px;border-radius:50%;background:#ff6b6b;border:4px solid #fff;box-shadow:0 6px 18px rgba(255,107,107,.45);display:flex;align-items:center;justify-content:center;font-size:1.7rem;cursor:pointer;animation:tada 1.1s infinite}
@keyframes tada{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.splash{position:absolute;border:3px solid rgba(255,107,107,.55);border-radius:50%;pointer-events:none;animation:spl .45s ease-out forwards}
@keyframes spl{from{width:12px;height:12px;opacity:.9}to{width:70px;height:70px;opacity:0;margin:-29px}}
.plus{position:absolute;font-weight:900;color:#0077b6;pointer-events:none;animation:rise .6s ease-out forwards;text-shadow:0 1px 0 #fff}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}
.swimmer{position:absolute;font-size:1.5rem;opacity:.5;animation:swim linear infinite}
@keyframes swim{from{transform:translateX(105vw)}to{transform:translateX(-120%)}}
#tfill{transition:width .1s linear;background:linear-gradient(90deg,#00b4d8,#ff6b6b)}
.chipst{background:#fff;border-radius:999px;padding:.35rem 1rem;font-weight:900;box-shadow:0 3px 0 rgba(10,110,124,.15)}
.btn-sea{background:#00b4d8;color:#fff;border-radius:999px;font-weight:900;box-shadow:0 6px 0 #0086ad;transition:all .09s}
.btn-sea:hover{filter:brightness(1.08)}
.btn-sea:active{transform:translateY(4px);box-shadow:0 2px 0 #0086ad}
</style>
</head>
<body class="select-none">

<div class="wave-deco" style="top:6%;left:5%">🌴</div>
<div class="wave-deco" style="top:8%;right:6%">☀️</div>
<div class="wave-deco" style="bottom:7%;left:8%">🐚</div>
<span class="swimmer" style="bottom:12%;animation-duration:26s">🐠</span>
<span class="swimmer" style="bottom:20%;animation-duration:34s;animation-delay:6s">🐟</span>

<main class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">

<div id="startScr" class="text-center max-w-lg">
<div class="text-7xl mb-2">🎣</div>
<h1 class="text-5xl font-black mb-3" style="color:#0077b6">صيّاد السمك</h1>
<p class="leading-relaxed mb-1">اضغط على السمكات الظاهرة بأسرع ما يمكن!<br>٣٠ ثانية · كل صيد <b>+١٠</b></p>
<p class="text-sm opacity-60 mb-8">الدقة تُحسب… فلا تضغط في الماء الفاضي 😅</p>
<button onclick="start()" class="btn-sea px-14 py-3.5 text-xl">ابدأ الصيد 🐟</button>
<p class="mt-6 text-sm opacity-60">أفضل نتيجة: <span id="bestStart" class="font-bold text-[#0077b6]">—</span></p>
</div>

<div id="playScr" class="hidden w-full max-w-3xl">
<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
<span class="chipst">🎯 <span id="hitsEl">٠</span></span>
<span class="chipst">💧 أخطاء <span id="missEl" class="text-[#ff6b6b]">٠</span></span>
<span class="chipst">📈 دقة <span id="accEl">١٠٠٪</span></span>
<span class="chipst">⏱ <span id="secsEl" class="text-[#0077b6]">30</span>ث</span>
</div>
<div class="w-full h-3 rounded-full bg-white overflow-hidden mb-4"><div id="tfill" class="h-full" style="width:100%"></div></div>
<div id="arena" class="relative w-full" style="height:min(58vh,430px)"></div>
<div class="flex justify-center mt-3"><button onclick="togglePause()" id="pauseBtn" class="btn-sea px-6 py-2 text-sm hidden">⏸ إيقاف مؤقت</button></div>
</div>

<div id="endScr" class="hidden text-center card px-12 py-10 max-w-md w-full" style="background:#fff;border-radius:1.6rem">
<div class="text-6xl mb-2">🦈</div>
<h2 class="text-3xl font-black mb-5" style="color:#0077b6">خلص الرحلة!</h2>
<div class="flex gap-8 justify-center mb-5">
<div><div id="finalHits" class="text-4xl font-black text-[#ff6b6b]">٠</div><div class="text-xs opacity-60 mt-1">صيد</div></div>
<div><div id="finalAcc" class="text-4xl font-black text-[#00b4d8]">٠٪</div><div class="text-xs opacity-60 mt-1">الدقة</div></div>
<div><div id="finalScore" class="text-4xl font-black text-emerald-500">٠</div><div class="text-xs opacity-60 mt-1">النقاط</div></div>
</div>
<p id="endMsg" class="opacity-70 mb-8"></p>
<button onclick="start()" class="btn-sea px-12 py-3 text-lg">رحلة صيد ثانية ↻</button>
</div>

</main>

<script>
const $=id=>document.getElementById(id);
const DUR=30,bestKey='tropical-aim-best';
const FISH=['🐠','🐟','🐡','🦐','🐙'];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let hits=0,misses=0,score=0,tLeft=DUR,timer=null,over=true,ac=null,paused=false;
function snd(f,d,type,g){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(g||.06,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.1));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1));}catch(e){}}
function sGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadBest(){const v=+(sGet(bestKey)||0);$('bestStart').textContent=v?AR(v):'—';}
loadBest();
function spawn(){
const a=$('arena');
const old=a.querySelector('.target');
if(old)old.remove();
const t=document.createElement('button');
t.className='target';
t.textContent=FISH[Math.floor(Math.random()*FISH.length)];
t.style.left=(5+Math.random()*82)+'%';
t.style.top=(5+Math.random()*78)+'%';
t.onclick=e=>{
if(over)return;
e.stopPropagation();
hits++;score+=10;
$('hitsEl').textContent=AR(hits);
plus(e.clientX,e.clientY);
snd(600+Math.random()*350,.09,'triangle',.07);
spawn();
};
a.appendChild(t);
}
function plus(cx,cy){
const a=$('arena').getBoundingClientRect();
const p=document.createElement('div');
p.className='plus';p.textContent='+10';
p.style.left=(cx-a.left-12)+'px';p.style.top=(cy-a.top-46)+'px';
$('arena').appendChild(p);
setTimeout(()=>p.remove(),600);
}
$('arena').addEventListener('pointerdown',e=>{
if(over||paused)return;
misses++;
const s=document.createElement('div');
s.className='splash';
s.style.left=(e.offsetX)+'px';s.style.top=(e.offsetY)+'px';
$('arena').appendChild(s);
setTimeout(()=>s.remove(),480);
snd(150,.12,'sine',.04);
updateAcc();
});
function updateAcc(){
const tot=hits+misses;
$('accEl').textContent=(tot?Math.round(hits/tot*100):100)+'٪';
}
function start(){
hits=0;misses=0;score=0;tLeft=DUR;over=false;paused=false;
$('pauseBtn').classList.remove('hidden');$('pauseBtn').textContent='⏸ إيقاف مؤقت';
$('hitsEl').textContent='٠';$('missEl').textContent='٠';$('accEl').textContent='١٠٠٪';$('secsEl').textContent=AR(DUR);
$('endScr').classList.add('hidden');$('startScr').classList.add('hidden');
$('playScr').classList.remove('hidden');
spawn();
clearInterval(timer);
timer=setInterval(()=>{
tLeft-=.1;
if(tLeft<=0)return finish();
$('secsEl').textContent=AR(Math.ceil(tLeft));
$('tfill').style.width=(tLeft/DUR*100)+'%';
},100);
snd(520,.1,'triangle',.05);
}
function togglePause(){
if(over)return;
paused=!paused;
$('arena').style.opacity=paused?'.35':'1';
const b=$('pauseBtn');
if(paused){b.textContent='▶ متابعة';clearInterval(timer);}
else{b.textContent='⏸ إيقاف مؤقت';timer=setInterval(()=>{
if(paused)return;
tLeft-=.1;
if(tLeft<=0)return finish();
$('secsEl').textContent=AR(Math.ceil(tLeft));
$('tfill').style.width=(tLeft/DUR*100)+'%';
},100);}
}
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='p'||e.key==='P')&&!$('playScr').classList.contains('hidden')&&!over)togglePause();});
function finish(){
clearInterval(timer);
over=true;paused=false;
$('pauseBtn').classList.add('hidden');
$('arena').style.opacity='1';
$('arena').querySelector('.target')?.remove();
$('playScr').classList.add('hidden');
$('endScr').classList.remove('hidden');
const tot=hits+misses;
const acc=tot?Math.round(hits/tot*100):0;
if(acc>=90&&tot>=10)score+=100;
$('finalHits').textContent=AR(hits);
$('finalAcc').textContent=acc+'٪';
$('finalScore').textContent=AR(score);
const v=+(sGet(bestKey)||0);
let m=acc>=90?'قنّاص المحيط! 🏅':acc>=70?'صيّاد محترف 👌':'السمكة خدعتك كثير 😅';
if(score>v&&score>0){sSet(bestKey,score);m+=' رقم قياسي جديد 🏆';loadBest();}
else if(v)m+=' أفضل نتيجة لك: '+AR(v);
$('endMsg').textContent=m;
[660,880].forEach((f,i)=>setTimeout(()=>snd(f,.14,'triangle',.05),i*130));
}
</script>
</body>
</html>
