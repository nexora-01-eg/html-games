<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>شبكة الألوان</title></head><body class="bg-gradient-to-b from-orange-100 via-rose-100 to-purple-100 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-rose-800"><h1 class="text-4xl font-bold mb-4">شبكة الألوان</h1><p class="text-rose-700 mb-6">انسخ شبكة الألوان بالضغط على الخلايا لتدوير الألوان!</p><p class="text-sm text-rose-600 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-rose-600 hover:bg-rose-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-white rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-rose-800 font-bold mb-4"><span>المستوى: <span id="round">1</span>/8</span><span>الوقت: <span id="timer">30</span></span></div><div class="text-center text-rose-700 font-bold mb-2">الشبكة الهدف</div><div id="target" class="grid grid-cols-4 gap-1 mb-4"></div><div class="text-center text-rose-700 font-bold mb-2">شبكتك</div><div id="player" class="grid grid-cols-4 gap-1 mb-2"></div><p class="text-center text-sm text-gray-600" id="feedback">انقر على الخلية لتدوير اللون</p></div></div><div id="finish-screen" class="hidden text-center text-rose-800"><h2 class="text-3xl font-bold mb-4">انتهى الوقت!</h2><p class="text-2xl text-rose-600 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-rose-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-rose-600 hover:bg-rose-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentRound=1,playerScore=0,targetGrid=[],playerGrid=[],timerId=null,timeLeft=30,audioCtx,paused=false;const N=4;const PAL=['#ef4444','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899'];function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('grid-color-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('grid-color-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentRound=1;playerScore=0;showScreen('play-screen');nextRound()}function nextRound(){if(timerId)clearInterval(timerId);let nCols=Math.min(PAL.length,3+Math.floor(currentRound/2));targetGrid=[];playerGrid=[];for(let i=0;i<N;i++){targetGrid[i]=[];playerGrid[i]=[];for(let j=0;j<N;j++){targetGrid[i][j]=Math.floor(Math.random()*nCols);playerGrid[i][j]=Math.floor(Math.random()*nCols)}}$('round').textContent=currentRound;timeLeft=30;$('timer').textContent=timeLeft;$('feedback').textContent='انقر على الخلية لتدوير اللون';drawGrids();timerId=setInterval(function(){if(paused)return;timeLeft--;$('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(timerId);endGame(false)}},1000)}function drawGrids(){let t=$('target');t.innerHTML='';for(let i=0;i<N;i++){for(let j=0;j<N;j++){let d=document.createElement('div');d.className='aspect-square rounded';d.style.background=PAL[targetGrid[i][j]];t.appendChild(d)}}let p=$('player');p.innerHTML='';for(let i=0;i<N;i++){for(let j=0;j<N;j++){let d=document.createElement('div');d.className='aspect-square rounded cursor-pointer hover:ring-2 hover:ring-rose-400';d.style.background=PAL[playerGrid[i][j]];d.addEventListener('click',clicker(i,j));p.appendChild(d)}}}function clicker(i,j){return function(){playerGrid[i][j]=(playerGrid[i][j]+1)%PAL.length;playSound(400+playerGrid[i][j]*60,0.1,'triangle');drawPlayerOnly(i,j);checkMatch()}}function drawPlayerOnly(i,j){let p=$('player');let d=p.children[i*N+j];d.style.background=PAL[playerGrid[i][j]]}function checkMatch(){let ok=true;for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(playerGrid[i][j]!==targetGrid[i][j]){ok=false;i=N;break}if(ok){clearInterval(timerId);let pts=Math.max(20,150+timeLeft*5);playerScore+=pts;playSound(700,0.3,'sine');$('feedback').textContent='مطابقة كاملة! +'+pts;currentRound++;if(currentRound>8){endGame(true)}else{setTimeout(nextRound,700)}}}function endGame(won){if(timerId){clearInterval(timerId);timerId=null;}let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}function togglePause(){if(!document.getElementById('play-screen').classList.contains('hidden')){paused=!paused;var fb=document.getElementById('feedback');fb.textContent=paused?'⏸ إيقاف مؤقت — اضغط Esc للاستمرار':'انقر على الخلية لتدوير اللون';}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')togglePause();});showStart()</script></body></html>
