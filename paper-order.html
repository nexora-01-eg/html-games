<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الترتيب ✏️</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe Print','Comic Sans MS',Tahoma,sans-serif;background:#f8f4e9;background-image:repeating-linear-gradient(transparent 0px,transparent 31px,rgba(47,62,70,.09) 31px,rgba(47,62,70,.09) 32px)}
.note{background:#fffdf5;border:2px dashed #2f3e46;border-radius:12px;box-shadow:3px 4px 0 rgba(47,62,70,.18);cursor:pointer;transition:transform .15s,box-shadow .15s}
.note:hover{transform:translateY(-3px) rotate(0deg)!important;box-shadow:4px 6px 0 rgba(201,111,74,.35)}
.chip{background:#fffdf5;border:2px solid #2f3e46;border-radius:12px;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.slot{border:2px dashed rgba(47,62,70,.35);border-radius:12px;min-width:104px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(255,253,245,.55);padding:4px 8px;transition:border-color .2s}
.slot.ok{border:2px solid #84a98c;background:rgba(132,169,140,.14)}
.slot.bad{border:2px solid #b5654a;background:rgba(181,101,74,.12)}
.btn-ink{background:#2f3e46;color:#f8f4e9;border-radius:999px;transition:background .15s,transform .1s}
.btn-ink:hover{background:#c96f4a}
.btn-ink:active{transform:scale(.95)}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body class="min-h-screen text-[#2f3e46] select-none">

<header class="text-center pt-8 pb-1">
<h1 class="text-4xl font-bold tracking-wide">✏️ دفتر الترتيب</h1>
<p class="mt-2 text-sm opacity-70">اضغط البطاقات بالترتيب الصحيح (من اليمين لليسار)… ولو غلطت اضغط البطاقة ترجع</p>
<div class="flex justify-center gap-8 mt-3 text-sm font-bold">
<span>الجولة <span id="rNum">١</span>/<span id="rTot">٤</span></span>
<span>النقاط <span id="scoreEl">0</span></span>
<span>الأفضل <span id="bestEl">—</span></span>
</div>
</header>

<main class="max-w-3xl mx-auto px-4 pb-16">
<div id="gameScr">
<div id="question" class="text-xl md:text-2xl font-bold text-center mt-5 mb-2"></div>
<div id="slots" class="flex gap-3 justify-center flex-wrap my-6"></div>
<div id="verdict" class="h-8 text-center font-bold text-lg"></div>
<div id="pool" class="flex flex-wrap gap-4 justify-center mt-2"></div>
<div class="text-center mt-9"><button id="actionBtn" onclick="advance()" class="btn-ink px-9 py-2.5 font-bold hidden">تحقق ✓</button></div>
</div>

<div id="endScr" class="hidden text-center pt-16">
<div class="text-6xl mb-4">📓</div>
<h2 class="text-3xl font-bold">خلصت الدفتر!</h2>
<div id="finalTotal" class="text-6xl font-bold my-5 text-[#c96f4a]">0</div>
<p id="endMsg" class="opacity-70 mb-8"></p>
<button onclick="start()" class="btn-ink px-10 py-2.5 font-bold">دفتر جديد ↻</button>
</div>
</main>

<script>
const BANK=[
{q:'رتّب الأرقام من الأصغر للأكبر 🔢',items:['-3','0.5','7','12','40']},
{q:'رتّب الأرقام من الأكبر للأصغر 🔢',items:['91','3','0.75','-8','-20']},
{q:'رتّب الكواكب من الأقرب للشمس 🪐',items:['عطارد','الزهرة','الأرض','المريخ','المشتري']},
{q:'رتّب الأحداث من الأقدم للأحدث 📜',items:['بناء الأهرامات','ظهور الإسلام','سقوط الأندلس','الهبوط على القمر','اختراع الويب']},
{q:'رتّب الحيوانات من الأسرع للأبطأ 🏃',items:['الصقر','الفهد','الحصان','الدب','الإنسان']},
{q:'رتّب من الأخف وزناً للأثقل ⚖️',items:['ورقة شجر','تفاحة','قطة','إنسان','فيل']},
{q:'رتّب من الأصغر حجماً للأكبر 🐜',items:['نملة','فأر','أرنب','ذئب','زرافة']}
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $=id=>document.getElementById(id);
let rounds=[],rIdx=0,score=0,target=[],placed=[],locked=false,ac=null;
function snd(f,d,type,g){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(g||.05,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12));}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadBest(){let v=0;try{v=+localStorage.getItem('paper-order-best')||0}catch(e){};$('bestEl').textContent=v||'—';}
loadBest();
function start(){rounds=shuffle(BANK).slice(0,4);score=0;rIdx=0;$('scoreEl').textContent='0';$('endScr').classList.add('hidden');$('gameScr').classList.remove('hidden');loadRound();}
function loadRound(){
const r=rounds[rIdx];target=r.items;placed=[];locked=false;
$('rNum').textContent=AR(rIdx+1);$('rTot').textContent=AR(rounds.length);
$('question').textContent=r.q;
$('verdict').textContent='';
const btn=$('actionBtn');btn.classList.add('hidden');btn.textContent='تحقق ✓';
render();
}
function render(){
const slots=$('slots'),pool=$('pool');
slots.innerHTML='';
target.forEach((_,i)=>{
const s=document.createElement('div');
s.className='slot'+(locked?(placed[i]===target[i]?' ok':' bad'):'');
if(placed[i]){
const c=document.createElement('div');c.className='chip pop';c.style.padding='8px 14px';c.textContent=placed[i];
if(!locked)c.onclick=()=>removeItem(i);
s.appendChild(c);
}else{
const n=document.createElement('span');n.className='opacity-40 text-lg';n.textContent=AR(i+1);s.appendChild(n);
}
slots.appendChild(s);
});
pool.innerHTML='';
const remaining=target.filter(x=>!placed.includes(x));
remaining.forEach(v=>{
const d=document.createElement('button');
d.className='note pop';d.style.padding='12px 18px';
d.style.transform=`rotate(${(Math.random()*5-2.5).toFixed(1)}deg)`;
d.textContent=v;
d.onclick=()=>placeItem(v);
pool.appendChild(d);
});
}
function placeItem(v){
if(locked||placed.length>=target.length)return;
placed.push(v);
snd(280+placed.length*90,.1,'triangle',.06);
render();
if(placed.length===target.length){$('actionBtn').classList.remove('hidden');snd(520,.12,'triangle',.06);}
}
function removeItem(i){
if(locked)return;
placed.splice(i,1);
snd(170,.08,'square',.04);
$('actionBtn').classList.add('hidden');
render();
}
function advance(){
if(!locked){checkRound();return;}
rIdx++;
if(rIdx>=rounds.length)end();else loadRound();
}
function checkRound(){
locked=true;
let correct=0;
target.forEach((t,i)=>{if(placed[i]===t)correct++;});
const gained=correct*20+(correct===target.length?30:0);
score+=gained;
$('scoreEl').textContent=score;
const v=$('verdict');
if(correct===target.length){
v.textContent=`ممتاز! ترتيب كامل ${AR(correct)}/${AR(target.length)} · +${AR(gained)} نقطة 🌟`;
v.style.color='#5b8a72';
snd(523,.14,'triangle',.07);setTimeout(()=>snd(659,.14,'triangle',.07),130);setTimeout(()=>snd(784,.2,'triangle',.07),260);
}else{
v.textContent=`${AR(correct)} صح من ${AR(target.length)} · +${AR(gained)} نقطة`;
v.style.color='#b5654a';
snd(150,.28,'sawtooth',.05);
$('question').classList.add('shake');setTimeout(()=>$('question').classList.remove('shake'),400);
}
render();
$('actionBtn').classList.remove('hidden');
$('actionBtn').textContent=rIdx+1>=rounds.length?'النتيجة النهائية 🏁':'الجولة التالية ←';
}
function end(){
$('gameScr').classList.add('hidden');
$('endScr').classList.remove('hidden');
$('finalTotal').textContent=score;
const v=+localStorage.getItem('paper-order-best')||0;
let m='';
if(score>v&&score>0){try{localStorage.setItem('paper-order-best',score)}catch(e){}m='رقم قياسي جديد! 🏆';loadBest();}
else if(v)m='أفضل نتيجة لك: '+v;
$('endMsg').textContent=m;
snd(659,.15,'triangle',.07);setTimeout(()=>snd(784,.15,'triangle',.07),140);setTimeout(()=>snd(988,.25,'triangle',.07),280);
}
start();
</script>
</body>
</html>
