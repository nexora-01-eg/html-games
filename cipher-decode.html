<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>فكّ التشفير</title></head><body class="bg-gradient-to-b from-red-950 to-black min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-red-300"><h1 class="text-4xl font-bold mb-4">فكّ التشفير</h1><p class="text-red-200 mb-6">شيفرة قيصر: خمّن مقدار الإزاحة لفكّ النص المشفّر!</p><p class="text-sm text-red-400 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-red-600 hover:bg-red-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-red-900/40 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-red-200 font-bold mb-4"><span>الجولة: <span id="round">1</span>/8</span><span>النقاط: <span id="score">0</span></span></div><div class="bg-black/60 rounded-lg p-4 mb-1"><p class="text-red-300 font-mono text-center text-xl" id="cipher"></p><p class="text-gray-400 text-center text-sm mt-2" id="hint"></p></div><div class="text-center text-red-200 font-bold my-2">مقدار الإزاحة (١-٢٦): <span id="shiftVal">13</span></div><input type="range" id="shiftSlider" min="1" max="26" value="13" class="w-full accent-red-500 mb-4"><div class="bg-black/60 rounded-lg p-4 mb-4 min-h-12 text-center text-2xl text-emerald-300 font-bold" id="decoded"></div><button onclick="submitShift()" class="w-full bg-red-600 hover:bg-red-700 text-white text-xl py-2 rounded-full font-bold">فكّ</button></div></div><div id="finish-screen" class="hidden text-center text-red-300"><h2 class="text-3xl font-bold mb-4">انتهت الجولات!</h2><p class="text-2xl text-red-200 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-red-400 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-red-600 hover:bg-red-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentRound=1,playerScore=0,guessCount=0,plainText='',knownShift=0,currentCipher='',audioCtx;const ALPH='أبتثجحخدذرزسشصضطظعغفقكلمنهوي';function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('cipher-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('cipher-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentRound=1;playerScore=0;showScreen('play-screen');nextRound()}const WORDS=['أمان','سرية','جاسوس','تشفير','مهمة','رموز','قوة','سلاح'];function nextRound(){guessCount=0;let words=[WORDS[Math.floor(Math.random()*WORDS.length)]];if(currentRound>=4){let w1=WORDS[Math.floor(Math.random()*WORDS.length)],w2=WORDS[Math.floor(Math.random()*WORDS.length)];if(w1===w2){w2=WORDS[(WORDS.indexOf(w1)+1)%WORDS.length]}words=[w1,w2]}plainText=words.join(' ');knownShift=1+Math.floor(Math.random()*10);currentCipher=encrypt(plainText,knownShift);$('round').textContent=currentRound;$('cipher').textContent=currentCipher;$('hint').textContent='النص يتكوّن من '+plainText.replace(/ /g,'').length+' حرفاً';$('decoded').textContent='';updateShift()}$('shiftSlider').addEventListener('input',updateShift);function encrypt(t,s){let r='';for(let ch of t){if(ch===' '){r+=' ';continue}let i=ALPH.indexOf(ch);if(i<0){r+=ch;continue}r+=ALPH[(i+s)%ALPH.length]}return r}function decrypt(t,s){let r='';for(let ch of t){if(ch===' '){r+=' ';continue}let i=ALPH.indexOf(ch);if(i<0){r+=ch;continue}r+=ALPH[(i-s%ALPH.length+ALPH.length)%ALPH.length]}return r}function updateShift(){$('shiftVal').textContent=$('shiftSlider').value;$('decoded').textContent=decrypt(currentCipher,parseInt($('shiftSlider').value))}function submitShift(){let s=parseInt($('shiftSlider').value);guessCount++;if(s===knownShift){let pts=Math.max(10,100-guessCount*15);playerScore+=pts;playSound(600,0.3,'sine');currentRound++;if(currentRound>8){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{$('score').textContent=playerScore;currentCipher='';setTimeout(nextRound,700)}}else{playerScore+=Math.max(0,5);playSound(150,0.3,'sawtooth');$('score').textContent=playerScore}}showStart()</script></body></html>
