<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار الألغاز</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-indigo-950 min-h-screen flex items-center justify-center font-sans"><div class="bg-indigo-900/80 backdrop-blur p-8 rounded-3xl w-full max-w-lg text-center text-white border border-purple-500/30 shadow-lg shadow-purple-500/10">
<div class="text-3xl font-bold mb-1">🔮 اختبار الألغاز</div>
<div id="bestDisp" class="text-purple-300 text-sm mb-4"></div>
<div id="startScreen">
<div class="text-purple-300/60 mb-4">10 ألغاز عربية — أجب بسرعة!</div>
<button onclick="startGame()" class="bg-purple-600 hover:bg-purple-500 px-8 py-4 rounded-xl text-xl font-bold transition">ابدأ</button>
</div>
<div id="gameScreen" class="hidden">
<div class="flex justify-between text-sm mb-4 text-purple-300"><span>اللغز: <span id="qNum" class="text-white font-bold">1</span>/10</span><span>⏱️ <span id="timer">15</span>s</span><span>النتيجة: <span id="score" class="text-yellow-400">0</span></span></div>
<div class="h-1 bg-purple-900 rounded-full mb-6 overflow-hidden"><div id="timerBar" class="h-full bg-purple-400 transition-all" style="width:100%"></div></div>
<div id="riddle" class="text-xl font-bold mb-6 text-white leading-relaxed"></div>
<div id="options" class="space-y-3"></div>
<div id="feedback" class="h-6 mt-4 text-lg font-bold"></div>
</div>
<div id="endScreen" class="hidden">
<div class="text-5xl font-bold mb-4">🔮 انتهت!</div>
<div class="text-2xl mb-2">النتيجة: <span id="finalScore" class="text-yellow-400"></span></div>
<div class="text-gray-400 mb-2">الإجابات الصحيحة: <span id="correctCount"></span>/10</div>
<div id="newBest" class="text-green-400 font-bold hidden">🏆 رقم قياسي جديد!</div>
<button onclick="startGame()" class="mt-4 bg-purple-600 hover:bg-purple-500 px-8 py-3 rounded-xl font-bold transition">العب مرة أخرى</button>
</div>
</div><script>
const ARABIC_RIDDLES=[
{q:"شيء أبيض يتحول للأسود بالعمر، ما هو؟",a:"الشمعة",o:["القلم","الشمعة","الورقة","القمر"]},
{q:"له عيون لا يرى، وفم لا يأكل. من هو؟",a:"الدمية",o:["الدمية","الحذاء","الكتاب","النافذة"]},
{q:"أمشي بلا أرجل وأدخل كل بيت. من أنا؟",a:"الريح",o:["الماء","الريح","الدخان","النار"]},
{q:"كلما أخذتني كبرت، وتركتني صغرت؟",a:"البالون",o:["البالون","الوردة","الكتاب","الحذاء"]},
{q:"ما الذي يصعد ولا ينزل أبداً؟",a:"العمر",o:["النافذة","العمر","القمر","الدخان"]},
{q:"يمكنك كسرني دون أن تلمسني. من أنا؟",a:"الصمت",o:["الزجاج","الصمت","القلم","الحذاء"]},
{q:"أجري بلا أرجل وأصفع بلا يدين. من أنا؟",a:"النهر",o:["النهر","الماء","الريح","الدخان"]},
{q:"ما الذي يملأ كل شيء وهو لا يرى؟",a:"الهواء",o:["الماء","الهواء","الريح","الدخان"]},
{q:"في الماء يموت وفي النار يحيا. من هو؟",a:"الملح",o:["الزجاج","الرمل","الريح","الملح"]},
{q:"ما الذي له باب لكن لا يدخل أحد؟",a:"الثلاجة",o:["الثلاجة","الخزانة","القفص","المصعد"]}
];
let riddles=[],current=0,score=0,correct=0,timeLeft=15,timerInt=null,best=0;try{best=+(localStorage.getItem('riddle-quiz-best'))||0;}catch(e){}
function playSound(f,d,t){let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.3;g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}
function updateBest(){document.getElementById('bestDisp').textContent=best>0?'أفضل نتيجة: '+best+'':'';}
updateBest();
function startGame(){
riddles=[...ARABIC_RIDDLES].sort(()=>Math.random()-0.5);
current=0;score=0;correct=0;
document.getElementById('startScreen').classList.add('hidden');
document.getElementById('endScreen').classList.add('hidden');
document.getElementById('gameScreen').classList.remove('hidden');
document.getElementById('score').textContent='0';
showRiddle();
}
function showRiddle(){
if(current>=10)return endGame();
timeLeft=15;
let r=riddles[current];
document.getElementById('qNum').textContent=current+1;
document.getElementById('riddle').textContent=r.q;
let opts=[...r.o].sort(()=>Math.random()-0.5);
let od=document.getElementById('options');od.innerHTML='';
opts.forEach(o=>{
let b=document.createElement('button');
b.className='w-full bg-purple-800/50 hover:bg-purple-700/50 border border-purple-500/30 px-6 py-4 rounded-xl text-lg font-bold transition hover:border-purple-400';
b.textContent=o;
b.onclick=()=>answer(o);
od.appendChild(b);
});
document.getElementById('feedback').textContent='';
clearInterval(timerInt);
timerInt=setInterval(()=>{
timeLeft-=0.1;
if(timeLeft<=0){timeLeft=0;clearInterval(timerInt);playSound(200,0.3,'sawtooth');document.getElementById('feedback').innerHTML='<span class="text-red-400">⏰ انتهى الوقت!</span>';current++;setTimeout(showRiddle,1000);}
document.getElementById('timer').textContent=Math.ceil(timeLeft);
document.getElementById('timerBar').style.width=(timeLeft/15*100)+'%';
},100);
}
function answer(ans){
clearInterval(timerInt);
let r=riddles[current];
document.querySelectorAll('#options button').forEach(b=>{b.onclick=null;b.classList.add('cursor-default');});
if(ans===r.a){
let pts=Math.round(timeLeft*10+50);score+=pts;correct++;
playSound(700,0.2);playSound(900,0.3);
document.getElementById('feedback').innerHTML='<span class="text-green-400">✅ '+' صحيح! +'+pts+'</span>';
}else{
playSound(200,0.3,'sawtooth');
document.getElementById('feedback').innerHTML='<span class="text-red-400">❌ خطأ! الجواب: '+r.a+'</span>';
}
document.getElementById('score').textContent=score;
current++;setTimeout(showRiddle,1500);
}
function endGame(){
clearInterval(timerInt);
document.getElementById('gameScreen').classList.add('hidden');
document.getElementById('endScreen').classList.remove('hidden');
document.getElementById('finalScore').textContent=score;
document.getElementById('correctCount').textContent=correct;
let isNew=score>best;
if(isNew){best=score;try{localStorage.setItem('riddle-quiz-best',best);}catch(e){}document.getElementById('newBest').classList.remove('hidden');}
else document.getElementById('newBest').classList.add('hidden');
}
</script></body></html>
