<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تذكّر المسار</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.cell{width:60px;height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;border:2px solid #334155;background:#1e293b;transition:all 0.2s}
.cell.path{background:#22c55e;border-color:#22c55e;box-shadow:0 0 15px rgba(34,197,94,0.4)}
.cell.selected{background:#3b82f6;border-color:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,0.4)}
.cell.correct{background:#22c55e}
.cell.wrong{background:#ef4444;border-color:#ef4444}
</style>
</head>
<body class="text-white">
<div id="startScreen" class="text-center">
<h1 class="text-4xl font-bold mb-4 text-green-400">تذكّر المسار</h1>
<p class="mb-6 text-lg text-gray-300">تذكّر المسار واضغط عليه</p>
<button onclick="startGame()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl text-xl font-bold">ابدأ</button>
<div id="best1" class="mt-4 text-sm text-green-300"></div>
</div>
<div id="playScreen" class="hidden text-center">
<div class="mb-3 text-lg font-bold"><span id="levelDisplay">المستوى: 1</span></div>
<p id="statusText" class="mb-4 text-lg text-green-300">شاهد المسار...</p>
<div id="grid" class="grid gap-2 mx-auto mb-6" style="width:fit-content"></div>
</div>
<div id="finishScreen" class="hidden text-center">
<h2 class="text-3xl font-bold mb-4 text-green-400">انتهى!</h2>
<p id="finalStats" class="text-lg mb-6"></p>
<button onclick="startGame()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl text-xl font-bold">مرّة أخرى</button>
<button onclick="goHome()" class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-xl text-xl font-bold mt-3">القائمة</button>
</div>
<script>
let level=1,path=[],playerPath=[],gridSize=5,showing=false;
let best=0;try{best=parseInt(localStorage.getItem('mem-path-best'))||0}catch(e){}
function $(id){return document.getElementById(id)}
function audioCtx(){return new(window.AudioContext||window.webkitAudioContext)()}
function playTone(f,t,d){let c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.12;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.stop(c.currentTime+d);}
function goHome(){$('startScreen').classList.remove('hidden');$('playScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');$('best1').textContent=best?'أفضل مستوى: '+best:'';}
function startGame(){
$('startScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');$('playScreen').classList.remove('hidden');
level=1;gridSize=5;newRound();
}
function newRound(){
showing=true;playerPath=[];$('statusText').textContent='شاهد المسار...';
$('levelDisplay').textContent='المستوى: '+level;
let pathLen=Math.min(level+2,gridSize*gridSize);
path=[];
let allCells=[];
for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++)allCells.push(r*gridSize+c);
for(let i=allCells.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[allCells[i],allCells[j]]=[allCells[j],allCells[i]];}
path=allCells.slice(0,pathLen);
renderGrid();showPath();
}
function renderGrid(){
let g=$('grid');g.innerHTML='';g.style.gridTemplateColumns='repeat('+gridSize+',60px)';
for(let i=0;i<gridSize*gridSize;i++){
let cell=document.createElement('button');cell.className='cell';cell.dataset.idx=i;
cell.onclick=()=>clickCell(i);g.appendChild(cell);
}
}
function showPath(){
let cells=$('grid').children;
let i=0;let iv=setInterval(()=>{
if(i>=path.length){
clearInterval(iv);
setTimeout(()=>{showing=false;$('statusText').textContent='轮到你了 - الآن دورك';
let cs=$('grid').children;for(let j=0;j<cs.length;j++)cs[j].classList.remove('path');},300);
return;
}
cells[path[i]].classList.add('path');playTone(330+i*30,'sine',0.08);i++;
},500);
}
function clickCell(idx){
if(showing)return;
playTone(440+idx*5,'triangle',0.08);
let cells=$('grid').children;
cells[idx].classList.add('selected');
playerPath.push(idx);
let pi=playerPath.length-1;
if(playerPath[pi]!==path[pi]){
$('statusText').textContent='خطأ! انتهت اللعبة';
showing=true;
for(let j=0;j<playerPath.length;j++){cells[playerPath[j]].classList.remove('selected');cells[playerPath[j]].classList.add('wrong');}
playTone(150,'sawtooth',0.3);
if(level>best){best=level-1;try{localStorage.setItem('mem-path-best',best)}catch(e){}}
$('finalStats').textContent='وصلت المستوى: '+level;
setTimeout(()=>{$('playScreen').classList.add('hidden');$('finishScreen').classList.remove('hidden');},1000);
return;
}
if(playerPath.length===path.length){
$('statusText').textContent='صحيح!';
for(let j=0;j<playerPath.length;j++){cells[playerPath[j]].classList.remove('selected');cells[playerPath[j]].classList.add('correct');}
playTone(880,'sine',0.15);
level++;if(gridSize<8&&level%3===0)gridSize++;
setTimeout(()=>newRound(),800);
}
}
goHome();
</script>
</body>
</html>
