<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنِ البرج</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;overflow:hidden;background:#0f172a}</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white font-sans">
<div class="absolute top-2 right-4 text-right z-10">
<p class="text-lg font-bold">النتيجة: <span id="score">0</span></p>
<p class="text-sm text-gray-400">الأفضل: <span id="best">0</span></p>
</div>
<canvas id="game" class="block"></canvas>
<div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 z-20">
<h1 class="text-3xl font-bold mb-2">بنِ البرج</h1>
<p id="overMsg" class="text-gray-400 mb-4 text-sm hidden"></p>
<button id="startBtn" class="bg-blue-500 hover:bg-blue-400 px-8 py-3 rounded-xl text-lg font-bold">ابدأ</button>
</div>
<script>
let best=0;try{best=+(localStorage.getItem('stack-best')||0);}catch(e){}
document.getElementById('best').textContent=best;
const canvas=document.getElementById('game');
const c=canvas.getContext('2d');
const ctx=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.3;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.stop(ctx.currentTime+d);}
let W,H,playing=false,score=0,animId;
let blocks=[],movingBlock=null,blockW=120,blockH=25,groundY,dir=1,speed=2,towerX;
function resize(){
W=canvas.width=Math.min(window.innerWidth,420);
H=canvas.height=Math.min(window.innerHeight,680);
groundY=H-20;
towerX=W/2;
}
resize();
window.addEventListener('resize',resize);
function drawStar(x,y,r){
c.fillStyle='#fff';
c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
}
function drawBg(){
c.fillStyle='#0f172a';c.fillRect(0,0,W,H);
for(let i=0;i<40;i++){
drawStar((i*137.5)%W,(i*89.3)%H,(i%3)*0.5+0.5);
}
c.fillStyle='#334155';c.fillRect(0,groundY,W,H-groundY);
}
function drawBlock(x,y,w,h,color){
const grad=c.createLinearGradient(x,y,x,y+h);
grad.addColorStop(0,color);
grad.addColorStop(1,shadeColor(color,-30));
c.fillStyle=grad;
c.fillRect(x,y,w,h);
c.fillStyle='rgba(255,255,255,0.15)';
c.fillRect(x,y,w,3);
}
function shadeColor(hex,pct){
let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
r=Math.max(0,Math.min(255,r+pct));g=Math.max(0,Math.min(255,g+pct));b=Math.max(0,Math.min(255,b+pct));
return `rgb(${r},${g},${b})`;
}
const blockColors=['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#22c55e','#06b6d4','#f97316','#ef4444'];
function getColor(i){return blockColors[i%blockColors.length];}
function drawTower(){
blocks.forEach((b,i)=>{
const y=groundY-((i+1)*blockH);
drawBlock(towerX-b.w/2,y,b.w,blockH,getColor(i));
});
}
function drawMoving(){
if(!movingBlock)return;
const baseY=blocks.length>0?groundY-blocks.length*blockH:groundY;
drawBlock(movingBlock.x-movingBlock.w/2,baseY-blockH,movingBlock.w,blockH,'#60a5fa');
}
function stack(){
if(!movingBlock)return;
const prevW=blocks.length>0?blocks[blocks.length-1].w:blockW;
const prevX=blocks.length>0?blocks[blocks.length-1].x:towerX;
const overlap=Math.max(0,movingBlock.w-Math.abs(movingBlock.x-prevX));
if(overlap<5){endGame();return;}
const newW=overlap;
beep(400+blocks.length*20,0.12);
blocks.push({w:newW,x:(prevX+movingBlock.x)/2});
score++;
document.getElementById('score').textContent=score;
speed=Math.min(6,2+score*0.3);
blockW=newW;
spawnBlock();
}
function spawnBlock(){
const baseY=blocks.length>0?groundY-blocks.length*blockH:groundY;
const fromRight=Math.random()>0.5;
movingBlock={x:fromRight?W+blockW:-blockW,w:blockW,baseY};
dir=fromRight?-1:1;
}
function update(){
if(!movingBlock)return;
movingBlock.x+=speed*dir;
if(movingBlock.x>W+blockW)dir=-1;
if(movingBlock.x<-blockW)dir=1;
}
let bgStars=[];
for(let i=0;i<50;i++)bgStars.push({x:Math.random()*420,y:Math.random()*680,s:Math.random()*1.5+0.5});
function drawFullBg(){
c.fillStyle='#0f172a';c.fillRect(0,0,W,H);
bgStars.forEach(s=>{c.fillStyle=`rgba(255,255,255,${0.3+s.s*0.3})`;c.beginPath();c.arc(s.x,s.y,s.s,0,Math.PI*2);c.fill();});
c.fillStyle='#1e293b';c.fillRect(0,groundY,W,H-groundY);
}
function loop(){
if(!playing)return;
update();
c.clearRect(0,0,W,H);
drawFullBg();
drawTower();
drawMoving();
animId=requestAnimationFrame(loop);
}
function endGame(){
playing=false;cancelAnimationFrame(animId);
beep(200,0.4,'sawtooth');
document.getElementById('overMsg').textContent=`النتيجة: ${score}`;
document.getElementById('overMsg').classList.remove('hidden');
document.getElementById('overlay').style.display='flex';
document.getElementById('startBtn').textContent='أعد اللعب';
if(score>best){best=score;try{localStorage.setItem('stack-best',score);}catch(e){}document.getElementById('best').textContent=score;}
}
function handleTap(){if(playing)stack();}
canvas.addEventListener('click',handleTap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleTap();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing){e.preventDefault();handleTap();}});
document.getElementById('startBtn').addEventListener('click',()=>{
blocks=[];movingBlock=null;score=0;blockW=120;speed=2;
document.getElementById('score').textContent=0;
document.getElementById('overlay').style.display='none';
document.getElementById('overMsg').classList.add('hidden');
playing=true;resize();spawnBlock();loop();
});
resize();
drawFullBg();
</script>
</body>
</html>
