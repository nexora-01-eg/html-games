<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمات متقاطعة مصغّرة</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif}
.cell input{background:transparent;text-align:center;font-size:20px;font-weight:bold;color:#111}
.cell{background:#fff}
.clue{cursor:pointer}
.clue.active{background:#60a5fa;color:#fff}
.fill{background:#2563eb!important}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-100 via-orange-50 to-yellow-100">
<div id="startScreen" class="min-h-screen flex flex-col items-center justify-center gap-6 text-center px-6 text-slate-800">
  <h1 class="text-5xl font-black">📜 كلمات متقاطعة مصغّرة</h1>
  <p class="text-xl text-slate-600 max-w-lg">املأ شبكة ٥×٥ بالكلمات العربية مستعيناً بالدليل على يمين كل كلمة. ثلاث ألغاز كاملة!</p>
  <div class="bg-amber-200/60 rounded-2xl p-5">
    <p class="text-lg mb-1">أفضل نتيجة: <span id="startBest">0</span></p>
    <p class="text-sm text-slate-500">٣ ألغاز متدرجة الصعوبة</p>
  </div>
  <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xl px-10 py-4 rounded-full shadow-lg transition">ابدأ الحل</button>
</div>

<div id="playScreen" class="hidden min-h-screen flex-col items-center justify-center p-6 gap-5 text-slate-800">
  <div class="w-full max-w-3xl flex items-center justify-between">
    <p class="text-lg font-bold">اللغز: <span id="pzz" class="font-black">1 / 3</span></p>
    <p class="text-lg font-bold">النتيجة: <span id="score" class="font-black">0</span></p>
  </div>
  <div class="flex gap-6 flex-wrap justify-center">
    <div id="grid" class="rounded-lg overflow-hidden shadow-2xl"></div>
    <div id="clues" class="bg-white rounded-2xl shadow-xl p-5 max-w-sm"></div>
  </div>
<button id="checkBtn" onclick="checkGrid()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-10 py-3 rounded-full transition">تحقق من الحل</button>
<button onclick="clearGrid()" class="bg-amber-500 hover:bg-amber-400 text-white font-bold px-10 py-3 rounded-full transition">🗑 مسح</button>
<button id="nextBtn" onclick="nextPuzzle()" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-bold px-10 py-3 rounded-full transition">اللغز التالي</button>
</div>

<div id="finishScreen" class="hidden min-h-screen flex-col items-center justify-center gap-5 text-center px-6 text-slate-800">
  <h1 class="text-5xl font-black">حللت كل الألغاز!</h1>
  <p class="text-2xl font-bold">نتيجتك: <span id="finalScore">0</span></p>
  <p class="text-slate-500">أفضل نتيجة: <span id="finishBest">0</span></p>
  <button onclick="backStart()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xl px-10 py-4 rounded-full shadow-lg transition">العودة للبداية</button>
</div>

<script>
function $(id){return document.getElementById(id)}
function sGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let puzzles=[
  {n:'كلمات أساسية',across:[
    {d:'تيار ماء كبير',w:'نهر'},
    {d:'نور النهار',w:'شمس'}],
   down:[
    {d:'كوكبنا',w:'أرض'},
    {d:'حيوان الوفاء',w:'كلب'}]},
  {n:'طبيعة وحيوانات',across:[
    {d:'جسم ساطع في الليل',w:'قمر'},
    {d:'يعطي العسل',w:'نحل'}],
   down:[
    {d:'وعاء الشرب',w:'كوب'},
    {d:'مصدر الحياة',w:'ماء'}]},
  {n:'إنسان وبيت',across:[
    {d:'يضيء الغرفة',w:'لمبة'},
    {d:'نردي البيت للدخول',w:'باب'}],
   down:[
    {d:'مكان النوم',w:'سرير'},
    {d:'منزل صغير للطائر',w:'عش'}]}
];
let puzzle,grid,acrossList,downList,score,activeClue;
let best=+(sGet('word-cross-best')||0);
$('startBest').textContent=best;$('finishBest').textContent=best;
let wcrossAudio;
function getCrossAudio(){if(!wcrossAudio)wcrossAudio=new(window.AudioContext||window.webkitAudioContext)();return wcrossAudio;}
let size=5;
function tone(f,dur,type='sine',vol=0.2){
  let ac=getCrossAudio();
  let o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.start();o.stop(ac.currentTime+dur);
}
function startGame(){
  $('startScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');
  $('finishScreen').classList.remove('flex');
  $('playScreen').classList.remove('hidden');$('playScreen').classList.add('flex');
  score=0;activeClue=null;
  $('#grid').setAttribute('data-p','0');
  loadPuzzle(0);
}
function loadPuzzle(pzI){
  $('pzz').textContent=(pzI+1)+' / 3';
  $('nextBtn').classList.add('hidden');$('checkBtn').classList.remove('hidden');
  puzzle=puzzles[pzI];
  grid=[];
  for(let r=0;r<size;r++){grid.push([]);for(let c=0;c<size;c++)grid[r].push(null)}
  placeWords(puzzle);
  renderGrid();
  renderClues();
}
function placeWords(pz){
  let r=0,c=0;
  pz.across.forEach(wd=>{for(let i=0;i<wd.w.length;i++){grid[r][c+i]=wd.w[i]}c+=wd.w.length+1});
  let col=0;
  pz.down.forEach(wd=>{
    while(col<size&&grid[0][col])col++;
    if(col>=size)col=0;
    for(let i=0;i<wd.w.length&&i<size;i++){grid[i][col]=wd.w[i]}
    col++;
  });
}
function renderGrid(){
  let box=$('grid');box.innerHTML='';
  for(let r=0;r<size;r++){
    let row=document.createElement('div');row.className='flex';
    for(let c=0;c<size;c++){
      let cell=document.createElement('div');
      cell.className='cell w-12 h-12 border border-slate-300 flex items-center justify-center';
      if(grid[r][c]){
        let inp=document.createElement('input');
        inp.maxLength=1;inp.style.width='100%';inp.style.height='100%';
        inp.dataset.r=r;inp.dataset.c=c;
        inp.addEventListener('input',()=>tone(600,0.06,'triangle',0.08));
        cell.appendChild(inp);
      }else{cell.classList.add('fill')}
      row.appendChild(cell);
    }
    box.appendChild(row);
  }
}
function renderClues(){
  let box=$('clues');box.innerHTML='';
  box.innerHTML='<p class="font-black text-lg mb-2">أفقياً (عرضي)</p>';
  puzzle.across.forEach((cl,i)=>{
    let a=document.createElement('div');a.className='clue px-2 py-1 rounded';
    a.textContent=(i+1)+'. '+cl.d;
    a.onclick=()=>{activeClue={type:'across',i};tone(500,0.08,'triangle',0.1);highlight()};
    box.appendChild(a);
  });
  let hr=document.createElement('p');hr.className='font-black text-lg my-2';hr.textContent='رأسياً (عمودي)';
  box.appendChild(hr);
  puzzle.down.forEach((cl,i)=>{
    let a=document.createElement('div');a.className='clue px-2 py-1 rounded';
    a.textContent=(i+1)+'. '+cl.d;
    a.onclick=()=>{activeClue={type:'down',i};tone(500,0.08,'triangle',0.1);highlight()};
    box.appendChild(a);
  });
}
function highlight(){
  if(!activeClue)return;
  document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));
  let isA=activeClue.type==='across';
  let words=isA?puzzle.across:puzzle.down;
  let wd=words[activeClue.i];
  let inputs=document.querySelectorAll('#grid input');
  let match=[];
  if(isA){
    for(let r=0;r<size;r++){for(let c=0;c<size;c++){
      if(grid[r][c]===wd.w[0]&&grid[r][c+wd.w.length-1]===wd.w[wd.w.length-1]){for(let k=0;k<wd.w.length;k++)match.push(r+'x'+(c+k))}
    }}
  }else{
    for(let c=0;c<size;c++){for(let r=0;r<size;r++){
      if(grid[r][c]===wd.w[0]&&grid[r+wd.w.length-1]&&grid[r+wd.w.length-1][c]===wd.w[wd.w.length-1]){for(let k=0;k<wd.w.length;k++)match.push((r+k)+'x'+c)}
    }}
  }
  inputs.forEach(inp=>{
    let k=inp.dataset.r+'x'+inp.dataset.c;
    if(match.includes(k)){inp.closest('.cell').style.outline='3px solid #f59e0b'}
    else inp.closest('.cell').style.outline='';
  });
}
function clearGrid(){
document.querySelectorAll('#grid input').forEach(inp=>{inp.value='';});
tone(440,0.08,'triangle',0.1);
}
function checkGrid(){
let total=0,correct=0;
let all=document.querySelectorAll('#grid input');
all.forEach(inp=>{
let r=+inp.dataset.r,c=+inp.dataset.c;
total++;
if(inp.value===grid[r][c]){correct++;inp.closest('.cell').style.background='#bbf7d0'}
else inp.closest('.cell').style.background='#fecaca';
});
let pts=Math.round(correct/total*100);
score+=pts;$('score').textContent=score;
tone(pts>=90?700:200,0.3,pts>=90?'triangle':'sawtooth',0.2);
if(pts>=90){$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');
document.querySelectorAll('#grid input').forEach(inp=>inp.disabled=true);}
}
function nextPuzzle(){
  let cur=parseInt($('#grid').dataset.p||0)+1;
  if(cur>=puzzles.length){finish();return}
  $('#grid').setAttribute('data-p',cur);
  loadPuzzle(cur);
}
function finish(){
if(score>best){best=score;sSet('word-cross-best',best)}
  $('finalScore').textContent=score;$('finishBest').textContent=best;
  $('finishScreen').classList.remove('hidden');$('finishScreen').classList.add('flex');
  $('playScreen').classList.remove('flex');$('playScreen').classList.add('hidden');
}
function backStart(){
  $('playScreen').classList.remove('hidden');$('playScreen').classList.add('flex');
  $('finishScreen').classList.remove('flex');$('finishScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
}
</script>
</body>
</html>
