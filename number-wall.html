<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>جدار الأرقام</title></head><body class="bg-gradient-to-b from-indigo-900 to-indigo-950 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-indigo-200"><h1 class="text-4xl font-bold mb-4">جدار الأرقام</h1><p class="text-indigo-300 mb-6">املأ الخلايا الفارغة بحيث يساوي كل رقم مجموع الرقمين تحته!</p><p class="text-sm text-indigo-400 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-indigo-500 hover:bg-indigo-600 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-indigo-800/50 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-indigo-200 font-bold mb-4"><span>المستوى: <span id="level">1</span>/5</span><span>التصحيحات: <span id="wrong">0</span></span></div><div id="wall" class="flex flex-col items-center gap-2"></div><button onclick="checkWall()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white text-xl py-2 rounded-full font-bold mt-4">تحقق</button></div></div><div id="finish-screen" class="hidden text-center text-indigo-200"><h2 class="text-3xl font-bold mb-4">أكملت الجدار!</h2><p class="text-2xl text-indigo-300 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-indigo-400 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-indigo-500 hover:bg-indigo-600 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let level=1,playerScore=0,wrongCount=0,wall=null,audioCtx;const N=5;function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('num-wall-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('num-wall-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){level=1;playerScore=0;showScreen('play-screen');genWall()}function genWall(){wall=[];for(let i=0;i<N;i++){wall[i]=[];for(let j=0;j<N-i;j++){wall[i][j]=0}}$('level').textContent=level;$('wrong').textContent='0';wrongCount=0;for(let i=N-1;i>=0;i--){for(let j=0;j<N-i;j++){if(i===N-1){wall[i][j]=1+Math.floor(Math.random()*8)}else{wall[i][j]=wall[i+1][j]+wall[i+1][j+1]}}}let emptyPer=0.25+level*0.08;for(let i=0;i<N;i++){for(let j=0;j<N-i;j++){if(Math.random()<emptyPer&&!(i===0&&j===0)){wall[i][j]=-1}}}drawWall()}function drawWall(){let w=$('wall');w.innerHTML='';for(let i=0;i<N;i++){let row=document.createElement('div');row.className='flex gap-2';for(let j=0;j<N-i;j++){let d=document.createElement('div');d.className='w-14 h-14 rounded-lg flex items-center justify-center text-lg font-bold '+(wall[i][j]===-1?'bg-indigo-600':'bg-indigo-300 text-indigo-900');if(wall[i][j]===-1){let inp=document.createElement('input');inp.type='number';inp.id='w-'+i+'-'+j;inp.className='w-full h-full bg-transparent text-center text-white text-lg font-bold outline-none';d.appendChild(inp)}else{d.textContent=wall[i][j]}row.appendChild(d)}w.appendChild(row)}}function checkWall(){let correct=true;for(let i=N-1;i>=0;i--){for(let j=0;j<N-i;j++){let v=wall[i][j];if(v===-1){let inp=$('w-'+i+'-'+j);let val=Math.floor(parseInt(inp.value));if(isNaN(val)){correct=false;inp.style.borderColor='#f87171';continue}if(i===N-1){if(val<0){correct=false;inp.style.borderColor='#f87171'}else{inp.style.borderColor='#4ade80'}}else{let l=numVal(i+1,j),r=numVal(i+1,j+1);if(l===-1||r===-1){correct=false;inp.style.borderColor='#f87171'}else if(val===l+r){inp.style.borderColor='#4ade80'}else{correct=false;inp.style.borderColor='#f87171'}}}}}if(correct&&allEmptyFilled()){playerScore+=100+level*20-wrongCount*5;playSound(700,0.25,'sine');if(level>=5){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{level++;genWall()}}else if(!correct){wrongCount++;playSound(150,0.3,'sawtooth');$('wrong').textContent=wrongCount}}function allEmptyFilled(){for(let i=0;i<N;i++){for(let j=0;j<N-i;j++){let v=wall[i][j];if(v===-1){let inp=$('w-'+i+'-'+j);if(isNaN(parseInt(inp.value)))return false}}}return true}function numVal(i,j){let v=wall[i][j];if(v===-1){let inp=$('w-'+i+'-'+j);return inp?Math.floor(parseInt(inp.value)):-1}return v}showStart()</script></body></html>
