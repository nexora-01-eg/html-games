<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإيموجي</title><script src="https://cdn.tailwindcss.com"></script><style>body{user-select:none}</style></head>
<body class="bg-pink-950 min-h-screen flex flex-col items-center justify-center font-sans">
<div class="text-3xl text-pink-200 font-bold mb-1">لوحة الإيموجي</div>
<div class="text-pink-400 text-sm mb-1" id="best">الأفضل: 0</div>
<div class="text-pink-300 text-sm mb-3" id="levelInfo">المستوى 1 من 5</div>
<div class="flex gap-8 mb-4">
<div class="text-center"><div class="text-pink-400 text-xs mb-2">الصورة</div>
<div class="grid gap-0.5" id="target"></div></div>
<div class="text-center"><div class="text-pink-400 text-xs mb-2">لوحتك</div>
<div class="grid gap-0.5" id="board"></div></div>
</div>
<div class="text-pink-300 text-sm mb-3">الحركات: <span id="moves">0</span></div>
<div class="flex gap-3">
<button onclick="newLevel()" class="bg-pink-700 hover:bg-pink-600 text-white px-5 py-2 rounded-xl text-sm">مستوى جديد</button>
</div>
<div id="win" class="hidden absolute inset-0 flex items-center justify-center bg-black/80 z-10">
<div class="text-center"><div class="text-5xl mb-2">🎨</div>
<div class="text-3xl text-green-400 font-bold mb-2">أحسنت!</div>
<div class="text-pink-300 mb-4" id="wmsg"></div>
<button onclick="nextLevel()" class="bg-pink-600 hover:bg-pink-500 text-white px-8 py-3 rounded-xl">التالي</button></div></div>
<script>
const K='emoji-art-best';
let best=0;
try{best=parseInt(localStorage.getItem(K)||0);}catch(e){}
let audio;
try{audio=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
function play(f,d,t='sine'){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.12;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);o.stop(audio.currentTime+d);}
const PALETTES=[
['#ef4444','#3b82f6','#22c55e','#f59e0b','#ffffff'],
['#ec4899','#8b5cf6','#06b6d4','#84cc16','#f97316'],
['#dc2626','#2563eb','#16a34a','#eab308','#a855f7'],
['#f43f5e','#6366f1','#14b8a6','#f59e0b','#e11d48'],
['#be123c','#7c3aed','#0d9488','#ca8a04','#c026d3']
];
let level,grid,target,movesCount;
function newLevel(){level=0;startLevel();}
function startLevel(){
const size=Math.min(5,3+Math.floor(level/2));
const palette=PALETTES[level%5];
target=[];grid=[];
for(let r=0;r<size;r++){target[r]=[];grid[r]=[];for(let c=0;c<size;c++){
target[r][c]=palette[Math.floor(Math.random()*palette.length)];
grid[r][c]='#1e1128';
}}
movesCount=0;document.getElementById('win').classList.add('hidden');
document.getElementById('levelInfo').textContent='المستوى '+(level+1)+' من 5';
render();
}
function render(){
document.getElementById('moves').textContent=movesCount;
const size=target.length;
const tt=document.getElementById('target');tt.innerHTML='';
tt.style.gridTemplateColumns='repeat('+size+',1fr)';
for(let r=0;r<size;r++)for(let c=0;c<size;c++){
const d=document.createElement('div');d.className='w-10 h-10 rounded-md';
d.style.background=target[r][c];tt.appendChild(d);
}
const tb=document.getElementById('board');tb.innerHTML='';
tb.style.gridTemplateColumns='repeat('+size+',1fr)';
for(let r=0;r<size;r++)for(let c=0;c<size;c++){
const d=document.createElement('div');d.className='w-10 h-10 rounded-md cursor-pointer hover:opacity-80 transition';
d.style.background=grid[r][c];d.style.border='2px solid #ffffff22';
d.onclick=()=>{cycleColor(r,c);};tb.appendChild(d);
}
}
const ALLCOLORS=['#ef4444','#3b82f6','#22c55e','#f59e0b','#ffffff','#ec4899','#8b5cf6','#06b6d4','#84cc16','#f97316','#a855f7','#14b8a6'];
function cycleColor(r,c){
const palette=Object.values(PALETTES[level%5]);
let idx=palette.indexOf(grid[r][c]);
idx=(idx+1)%palette.length;
grid[r][c]=palette[idx];movesCount++;play(400+idx*60,0.06);
render();checkWin();
}
function checkWin(){
const size=target.length;
for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(grid[r][c]!==target[r][c])return;
play(523,0.1);play(659,0.1);setTimeout(()=>play(784,0.15),100);
const pts=Math.max(10,100-movesCount*5);
if(pts>best){best=pts;try{localStorage.setItem(K,best)}catch(e){};}
document.getElementById('best').textContent='الأفضل: '+best;
document.getElementById('wmsg').textContent='في '+movesCount+' حركة! (+نقط '+pts+')';
document.getElementById('win').classList.remove('hidden');
}
function nextLevel(){
document.getElementById('win').classList.add('hidden');
if(level+1<5){level++;startLevel();}
else{level=0;startLevel();}
}
newLevel();
</script>
</body>
</html>
