<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجر ورقة مقص</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 min-h-screen flex items-center justify-center font-sans"><div class="text-center text-white">
<div class="text-3xl font-bold mb-1">✊ حجر ورقة مقص</div>
<div class="text-gray-500 text-sm mb-4">أفضل 5 من 9</div>
<div id="bestDisp" class="text-gray-500 text-sm mb-4"></div>
<div id="startScreen">
<button onclick="startGame()" class="mt-4 bg-indigo-500 hover:bg-indigo-400 px-8 py-4 rounded-xl text-xl font-bold transition">ابدأ</button>
</div>
<div id="gameScreen" class="hidden">
<div class="flex justify-center gap-16 mb-6">
<div class="text-center"><div class="text-gray-500 text-sm mb-2">أنت</div><div id="playerWins" class="text-2xl font-bold text-indigo-400">0</div></div>
<div class="text-center"><div class="text-gray-500 text-sm mb-2">الكمبيوتر</div><div id="aiWins" class="text-2xl font-bold text-red-400">0</div></div>
</div>
<div class="flex justify-center items-center gap-8 mb-6">
<div id="playerEmoji" class="text-7xl transition-transform duration-300">❓</div>
<div class="text-3xl">⚔️</div>
<div id="aiEmoji" class="text-7xl transition-transform duration-300">❓</div>
</div>
<div id="roundLabel" class="text-gray-400 mb-4">الجولة 1</div>
<div id="result" class="h-8 text-xl font-bold mb-4"></div>
<div id="choices" class="flex justify-center gap-4 mb-4">
<button onclick="play('rock')" class="bg-white/10 hover:bg-white/20 w-20 h-20 rounded-2xl text-4xl transition transform hover:scale-110">🪨</button>
<button onclick="play('paper')" class="bg-white/10 hover:bg-white/20 w-20 h-20 rounded-2xl text-4xl transition transform hover:scale-110">📄</button>
<button onclick="play('scissors')" class="bg-white/10 hover:bg-white/20 w-20 h-20 rounded-2xl text-4xl transition transform hover:scale-110">✂️</button>
</div>
<div id="streakInfo" class="text-gray-500 text-sm h-5"></div>
</div>
<div id="endScreen" class="hidden">
<div class="text-5xl font-bold mb-4" id="endEmoji">🏆</div>
<div class="text-2xl font-bold mb-2" id="endResult"></div>
<div class="text-xl mb-4 text-gray-400" id="endScore"></div>
<div id="newBest" class="text-green-400 font-bold hidden">🏅 رقم قياسي!</div>
<button onclick="startGame()" class="mt-4 bg-indigo-500 hover:bg-indigo-400 px-8 py-3 rounded-xl font-bold transition">العب مرة أخرى</button>
</div>
</div><script>
const CHOICES={rock:'🪨',paper:'📄',scissors:'✂️'};
const BEATS={rock:'scissors',paper:'rock',scissors:'paper'};
let pWins=0,aWins=0,round=0,maxRounds=9,streak=0,best=0,ended=false;try{best=+(localStorage.getItem('rps-5-best'))||0;}catch(e){}
function playSound(f,d,t){let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.3;g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}
function updateBest(){document.getElementById('bestDisp').textContent=best>0?'أفضل نتيجة: '+best+'':'';}
updateBest();
function startGame(){
pWins=0;aWins=0;round=0;streak=0;ended=false;
document.getElementById('startScreen').classList.add('hidden');
document.getElementById('endScreen').classList.add('hidden');
document.getElementById('gameScreen').classList.remove('hidden');
document.getElementById('choices').classList.remove('hidden');
document.getElementById('result').textContent='';
document.getElementById('streakInfo').textContent='';
document.getElementById('playerEmoji').textContent='❓';
document.getElementById('aiEmoji').textContent='❓';
updateScore();
}
function updateScore(){
document.getElementById('playerWins').textContent=pWins;
document.getElementById('aiWins').textContent=aWins;
document.getElementById('roundLabel').textContent='الجولة '+(round+1);
}
function aiChoice(){return['rock','paper','scissors'][Math.floor(Math.random()*3)];}
function play(choice){
if(ended)return;
let ai=aiChoice();
document.getElementById('playerEmoji').textContent=CHOICES[choice];
document.getElementById('aiEmoji').textContent=CHOICES[ai];
document.getElementById('playerEmoji').classList.add('scale-125');
document.getElementById('aiEmoji').classList.add('scale-125');
setTimeout(()=>{document.getElementById('playerEmoji').classList.remove('scale-125');document.getElementById('aiEmoji').classList.remove('scale-125');},300);
if(choice===ai){
document.getElementById('result').innerHTML='<span class="text-yellow-400">تعادل!</span>';
playSound(400,0.2);
}else if(BEATS[choice]===ai){
pWins++;streak++;
let bonus=streak>=3?' 🔥 سلسلة '+streak:'';
document.getElementById('result').innerHTML='<span class="text-green-400">فزت!'+bonus+'</span>';
playSound(700+streak*50,0.2);
}else{
aWins++;streak=0;
document.getElementById('result').innerHTML='<span class="text-red-400">خسرت!</span>';
playSound(200,0.3,'sawtooth');
}
round++;updateScore();
if(pWins>=5||aWins>=5||round>=maxRounds)setTimeout(endGame,800);
}
function endGame(){
ended=true;
document.getElementById('gameScreen').classList.add('hidden');
document.getElementById('endScreen').classList.remove('hidden');
let pts=pWins*20+streak*5;
let won=pWins>aWins;
document.getElementById('endEmoji').textContent=won?'🏆':pWins===aWins?'🤝':'😔';
document.getElementById('endResult').textContent=won?'فزت!':pWins===aWins?'تعادل!':'خسرت!';
document.getElementById('endScore').textContent=pWins+'-'+aWins+' ('+pts+' نقطة)';
document.getElementById('choices').classList.add('hidden');
let isNew=pts>best;
if(isNew){best=pts;try{localStorage.setItem('rps-5-best',best);}catch(e){}document.getElementById('newBest').classList.remove('hidden');}
else document.getElementById('newBest').classList.add('hidden');
}
</script></body></html>
