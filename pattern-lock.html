<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>نمط القفل</title></head><body class="bg-gradient-to-b from-gray-900 to-black min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-cyan-300"><h1 class="text-4xl font-bold mb-4">نمط القفل</h1><p class="text-cyan-400 mb-6">احفظ النمط المعروض ثم أعِد رسمه على الشبكة من الذاكرة!</p><p class="text-sm text-cyan-500 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-gray-800 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-cyan-300 font-bold mb-4"><span>الجولة: <span id="round">1</span>/8</span><span>النقاط: <span id="score">0</span></span></div><div class="text-center text-cyan-400 font-bold mb-2" id="phase"></div><div class="grid grid-cols-3 gap-6 p-6 bg-gray-900 rounded-lg" id="dots"></div><button onclick="checkPattern()" id="checkBtn" class="hidden w-full bg-cyan-600 hover:bg-cyan-700 text-white text-xl py-2 rounded-full font-bold mt-4">تحقق</button></div></div><div id="finish-screen" class="hidden text-center text-cyan-300"><h2 class="text-3xl font-bold mb-4">انتهت الجولات!</h2><p class="text-2xl text-cyan-400 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-cyan-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentRound=1,playerScore=0,pattern=[],drawn=[],showId=null,audioCtx,over=false;function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('pat-lock-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('pat-lock-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentRound=1;playerScore=0;showScreen('play-screen');nextRound()}function nextRound(){if(showId)clearTimeout(showId);$('round').textContent=currentRound;pattern=[];drawn=[];let len=2+Math.floor((currentRound-1)*1.2);for(let i=0;i<len;i++){let n;do{n=Math.floor(Math.random()*9)}while(pattern.indexOf(n)>=0);pattern.push(n)}$('phase').textContent='تذكر النمط...';buildDots(true);showId=setTimeout(function(){let d=buildDots(false);$('phase').textContent='أعد رسم النمط الآن';$('checkBtn').classList.remove('hidden');d.forEach(x=>x.classList.remove('bg-cyan-500'))},1500+currentRound*400)}function buildDots(show){let g=$('dots');g.innerHTML='';let arr=[];for(let i=0;i<9;i++){let d=document.createElement('div');d.id='dot-'+i;d.className='w-14 h-14 rounded-full border-4 border-cyan-500 bg-gray-800 cursor-pointer flex items-center justify-center';d.addEventListener('click',clicker(i));if(show&&pattern.indexOf(i)>=0){d.classList.add('bg-cyan-500')}g.appendChild(d);arr.push(d)}return arr}function clicker(i){return function(){if($('checkBtn').classList.contains('hidden'))return;if(drawn.indexOf(i)>=0)return;drawn.push(i);playSound(400+drawn.length*50,0.12,'sine');let d=$('dot-'+i);if(d)d.classList.add('bg-cyan-500')}}function checkPattern(){if(drawn.length<pattern.length){$('phase').textContent='النمط ناقص! أكمل النقاط';playSound(150,0.3,'sawtooth');return}let ok=true;for(let i=0;i<pattern.length;i++){if(drawn[i]!==pattern[i]){ok=false;break}}if(ok){playerScore+=100+currentRound*20;playSound(700,0.25,'sine');if(currentRound>=8){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{currentRound++;setTimeout(nextRound,700)}}else{playerScore+=Math.max(0,50-currentRound*5);playSound(200,0.4,'sawtooth');currentRound++;setTimeout(nextRound,700)}}showStart()</script></body></html>
