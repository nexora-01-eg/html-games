<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طيّر العصفور</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;overflow:hidden;background:#0a0a0a}</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white font-sans">
<div class="absolute top-2 right-4 text-right z-10">
<p class="text-lg font-bold">النتيجة: <span id="score">0</span></p>
<p class="text-sm text-gray-400">الأفضل: <span id="best">0</span></p>
</div>
<canvas id="game" class="block"></canvas>
<div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 z-20">
<h1 class="text-3xl font-bold mb-2">طيّر العصفور</h1>
<p id="overMsg" class="text-gray-400 mb-4 text-sm hidden">انتهت اللعبة!</p>
<button id="startBtn" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 px-8 py-3 rounded-xl text-lg font-bold">ابدأ</button>
</div>
<script>
let best=0;
try{best=+(localStorage.getItem('flappy-best')||0);}catch(e){}
document.getElementById('best').textContent=best;
const canvas=document.getElementById('game');
const c=canvas.getContext('2d');
const ctx=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.3;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.stop(ctx.currentTime+d);}
let W,H,playing=false,score=0,animId;
let bird={x:80,y:0,vy:0,r:12};
let pipes=[],pipeTimer=0,gravity=0.35,flapPower=-7,pipeGap=150,pipeSpeed=2.5,frame=0;
function resize(){
W=canvas.width=Math.min(window.innerWidth,420);
H=canvas.height=Math.min(window.innerHeight,680);
bird.y=H/2;
}
resize();
window.addEventListener('resize',resize);
function drawBird(){
c.save();
c.translate(bird.x,bird.y);
c.fillStyle='#facc15';
c.beginPath();c.arc(0,0,bird.r,0,Math.PI*2);c.fill();
c.fillStyle='#000';
c.beginPath();c.arc(4,-3,3,0,Math.PI*2);c.fill();
c.fillStyle='#f97316';
c.beginPath();c.moveTo(bird.r,-2);c.lineTo(bird.r+8,0);c.lineTo(bird.r,3);c.fill();
c.restore();
}
function drawPipe(p){
c.fillStyle='#22c55e';
c.fillRect(p.x,0,p.w,p.top);
c.fillRect(p.x,p.top+pipeGap,p.w,H-(p.top+pipeGap));
c.fillStyle='#16a34a';
c.fillRect(p.x-4,p.top-20,p.w+8,20);
c.fillRect(p.x-4,p.top+pipeGap,p.w+8,20);
}
function drawBg(){
c.fillStyle='#1e3a5f';c.fillRect(0,0,W,H);
c.fillStyle='#166534';c.fillRect(0,H-40,W,40);
for(let i=0;i<20;i++){
c.fillStyle='#15803d';
c.beginPath();c.arc(i*25+10,H-40,12,Math.PI,0);c.fill();
}
}
function update(){
frame++;
bird.vy+=gravity;
bird.y+=bird.vy;
if(bird.y<0){bird.y=0;bird.vy=0;}
if(bird.y+bird.r>H-40)endGame();
pipeTimer++;
if(pipeTimer>=Math.floor(90-pipeSpeed*5)){
pipeTimer=0;
const top=Math.floor(Math.random()*(H-pipeGap-120))+40;
pipes.push({x:W,top:top,w:50,scored:false});
}
pipes.forEach(p=>{
p.x-=pipeSpeed;
if(!p.scored&&p.x+p.w<bird.x){p.scored=true;score++;beep(600,0.1);document.getElementById('score').textContent=score;}
if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w){
if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+pipeGap)endGame();
}
});
pipes=pipes.filter(p=>p.x+p.w>-10);
}
function draw(){
c.clearRect(0,0,W,H);
drawBg();
pipes.forEach(drawPipe);
drawBird();
}
function loop(){
if(!playing)return;
update();draw();
animId=requestAnimationFrame(loop);
}
function endGame(){
playing=false;cancelAnimationFrame(animId);
beep(200,0.4,'sawtooth');
document.getElementById('overMsg').textContent=`النتيجة: ${score}`;
document.getElementById('overMsg').classList.remove('hidden');
document.getElementById('overlay').style.display='flex';
document.getElementById('startBtn').textContent='أعد اللعب';
if(score>best){best=score;try{localStorage.setItem('flappy-best',score)}catch(e){};document.getElementById('best').textContent=score;}
}
function flap(){
if(!playing)return;
bird.vy=flapPower;beep(500,0.08);
}
document.addEventListener('keydown',e=>{if(e.code==='Space')flap();});
canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap();});
document.getElementById('startBtn').addEventListener('click',()=>{
pipes=[];pipeTimer=0;score=0;bird.y=H/2;bird.vy=0;frame=0;
document.getElementById('score').textContent=0;
document.getElementById('overlay').style.display='none';
document.getElementById('overMsg').classList.add('hidden');
playing=true;resize();loop();
});
resize();drawBg();drawBird();
</script>
</body>
</html>
