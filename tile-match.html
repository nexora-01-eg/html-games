<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طابق البلاط</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-700 via-yellow-600 to-orange-700 min-h-screen flex items-center justify-center text-white">
<div id="app" class="w-full max-w-lg p-6">
<div id="startScreen" class="text-center">
<h1 class="text-4xl font-black mb-4">🀄 طابق البلاط</h1>
<p class="text-amber-200 mb-6">طابق البلاط المتطابق مع لمس البلاط الحر فقط قبل انتهاء الوقت!</p>
<button id="startBtn" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 rounded-2xl text-xl font-bold shadow-lg">ابدأ اللعب</button>
<div class="mt-6 text-sm text-amber-200">الأفضل: <span id="bestDisplay">٠</span></div>
</div>
<div id="playScreen" class="hidden text-center">
<div class="flex justify-between items-center mb-4 text-sm font-bold">
<span>الوقت: <span id="timer">٩٠</span>ث</span>
<span>المطابقات: <span id="pairs">٠</span>/<span id="totalPairs">٠</span></span>
<span><button id="pauseBtn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-bold">⏸ إيقاف</button></span>
</div>
<div id="board" class="grid grid-cols-6 gap-1.5 mx-auto max-w-sm relative" style="height:280px"></div>
<div id="msg" class="text-sm h-6 mt-3"></div>
</div>
<div id="finishScreen" class="hidden text-center">
<h2 class="text-3xl font-black mb-4">🎉 التحدي!</h2>
<p id="winText" class="text-xl mb-4">أكملت كل المطابقات!</p>
<p id="bestText" class="text-yellow-300 text-sm mb-6">🎖️ رقم قياسي جديد!</p>
<div class="text-amber-200 mb-6">الأفضل (ثوانٍ متبقية): <span id="finalBest">٠</span></div>
<button id="restartBtn" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 rounded-2xl text-xl font-bold">العب مرة أخرى</button>
</div>
</div>
<script>
let ctx,best,timeLeft,pairsMatched,totalPairs,tiles,selectedTile,intervalId,isPlaying,paused;
const SYMBOLS=['🀄','🀄','🌸','🌸','🍁','🍁','🌺','🌺','🎴','🎴','🏮','🏮','🐉','🐉','💰','💰','🏯','🏯','⛩️','⛩️','🥠','🥠','🎎','🎎'];
function sGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function init(){ctx=null;best=parseInt(sGet('tile-match-best')||'0')||0;document.getElementById('bestDisplay').textContent=best;}
function tone(f,x,d){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type=f;o.frequency.value=x;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d);}
function setScreen(s){document.getElementById('startScreen').classList.toggle('hidden',s!=='start');document.getElementById('playScreen').classList.toggle('hidden',s!=='play');document.getElementById('finishScreen').classList.toggle('hidden',s!=='finish');}
function toAr(n){return n.toLocaleString('ar-EG');}
function setupBoard(){tiles=[];selectedTile=null;pairsMatched=0;let pool=SYMBOLS.slice(0,24);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let t=pool[i];pool[i]=pool[j];pool[j]=t;}let idx=0;for(let layer=0;layer<3;layer++){for(let r=0;r<4;r++){for(let c=0;c<6;c++){if(layer>0){if(r===0||r===3||c===0||c===5)continue;}if(idx<pool.length){tiles.push({symbol:pool[idx],row:r,col:c,layer:layer});idx++;}}}}totalPairs=12;document.getElementById('totalPairs').textContent=toAr(totalPairs);render();}
function render(){let b=document.getElementById('board');b.innerHTML='';let cellsByLayer={0:[],1:[],2:[]};for(let i=0;i<tiles.length;i++){let t=tiles[i];let pos=(t.row*6+t.col);let d=document.createElement('button');d.className='absolute w-12 h-12 rounded-lg text-2xl flex items-center justify-center border '+(t.layer===2?'bg-amber-200 text-amber-900 border-amber-400':t.layer===1?'bg-amber-100 text-amber-800 border-amber-300':'bg-white text-amber-900 border-amber-600');d.style.left=(pos%6)*51+'px';d.style.top=(Math.floor(pos/6))*51+t.layer*22+'px';d.style.zIndex=100+t.layer*10;d.textContent=t.symbol;d.dataset.index=i;d.onclick=function(){tapTile(i);};b.appendChild(d);}}
function isFree(i){let t=tiles[i];for(let j=0;j<tiles.length;j++){let o=tiles[j];if(o.row===t.row&&o.col===t.col&&o.layer>t.layer)return false;}return true;}
function highlightFree(){let children=document.getElementById('board').children;for(let c=0;c<children.length;c++){let i=parseInt(children[c].dataset.index,10);let lbl=children[c];lbl.style.filter=isFree(i)?'brightness(1.15)':'brightness(0.55)';if(selectedTile===i)lbl.style.outline='3px solid #059669';}}
function tapTile(i){if(!isPlaying)return;if(!isFree(i)){tone('sawtooth',180,0.15);return;}tone('sine',600,0.08);if(selectedTile===null){selectedTile=i;highlightFree();return;}if(selectedTile===i){selectedTile=null;highlightFree();return;}let a=tiles[selectedTile],b=tiles[i];if(a.symbol===b.symbol){tone('square',800,0.1);setTimeout(()=>tone('square',1000,0.1),100);pairsMatched++;document.getElementById('pairs').textContent=toAr(pairsMatched);tiles[selectedTile].done=true;tiles[i].done=true;removeTiles(selectedTile,i);selectedTile=null;if(pairsMatched>=totalPairs){win();}}else{tone('sawtooth',200,0.15);selectedTile=null;highlightFree();}}
function removeTiles(i,j){let b=document.getElementById('board');let kids=b.children;for(let c=0;c<kids.length;c++){let k=parseInt(kids[c].dataset.index,10);if(k===i||k===j){kids[c].style.display='none';kids[c].onclick=null;}}let nt=[];for(let n=0;n<tiles.length;n++){if(!tiles[n].done)nt.push(tiles[n]);}tiles=nt;highlightFree();}
function win(){isPlaying=false;clearInterval(intervalId);setScreen('finish');document.getElementById('winText').textContent='أكملت المطابقات مع بقاء '+toAr(timeLeft)+' ثانية!';let nb=false;if(timeLeft>best){best=timeLeft;sSet('tile-match-best',String(best));nb=true;}document.getElementById('bestText').classList.toggle('hidden',!nb);document.getElementById('finalBest').textContent=toAr(best);tone('triangle',800,0.2);setTimeout(()=>tone('triangle',1000,0.2),150);}
document.getElementById('startBtn').onclick=function(){if(!ctx)init();isPlaying=true;paused=false;timeLeft=90;document.getElementById('timer').textContent=toAr(timeLeft);setupBoard();tone('sine',500,0.15);setScreen('play');clearInterval(intervalId);intervalId=setInterval(function(){if(paused)return;timeLeft--;document.getElementById('timer').textContent=toAr(timeLeft);document.getElementById('timer').className=timeLeft<=10?'text-red-400 font-black':'text-white';if(timeLeft<=10)tone('square',300,0.1);if(timeLeft<=0){isPlaying=false;clearInterval(intervalId);showTimeout();}},1000);};
document.getElementById('pauseBtn').onclick=function(){if(!isPlaying)return;paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶ متابعة':'⏸ إيقاف';};
document.addEventListener('keydown',function(e){if((e.key==='p'||e.key==='P'||e.key==='Escape')&&isPlaying){document.getElementById('pauseBtn').click();return;}});
function showTimeout(){setScreen('finish');document.getElementById('winText').textContent='انتهى الوقت! حاول أسرع.';
document.getElementById('bestText').classList.add('hidden');document.getElementById('finalBest').textContent=toAr(best);tone('sawtooth',200,0.3);}
document.getElementById('restartBtn').onclick=function(){setScreen('start');init();};
init();
</script>
</body>
</html>
