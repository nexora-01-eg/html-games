<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>املأ اللون</title></head><body class="bg-gradient-to-b from-purple-100 to-white min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center"><h1 class="text-4xl font-bold text-purple-700 mb-4">املأ اللون</h1><p class="text-purple-600 mb-6">اضغط بالترتيب لملء الشبكة كلها باللون في أقل عدد من اللمسات!</p><p class="text-sm text-purple-500 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-purple-600 hover:bg-purple-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-white rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-purple-700 font-bold mb-2"><span>المستوى: <span id="level">1</span>/5</span><span>اللمسات: <span id="taps">0</span></span></div><div class="flex gap-2 mb-2"><button class="flex-1 h-10 rounded-lg color-btn" id="c0" data-c="0"></button><button class="flex-1 h-10 rounded-lg color-btn" id="c1" data-c="1"></button><button class="flex-1 h-10 rounded-lg color-btn" id="c2" data-c="2"></button><button class="flex-1 h-10 rounded-lg color-btn" id="c3" data-c="3"></button><button class="flex-1 h-10 rounded-lg color-btn" id="c4" data-c="4"></button></div><div id="grid" class="grid gap-0.5 bg-black p-0.5 rounded-lg"></div><p class="text-center text-purple-700 mt-3 font-bold">الهدف: أقل من <span id="targetTaps">0</span> لمسة</p></div></div><div id="finish-screen" class="hidden text-center"><h2 class="text-3xl font-bold text-purple-700 mb-4">أحسنت!<span id="winMsg"></span></h2><p class="text-2xl text-purple-600 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-purple-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-purple-600 hover:bg-purple-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentLevel=1,playerScore=0,taps=0,grid=null,size=0,colors=0,target=0,audioCtx;const COLORS=['#ef4444','#3b82f6','#22c55e','#facc15','#a855f7','#ec4899','#14b8a6','#f97316'];function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('color-fill-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('color-fill-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentLevel=1;playerScore=0;showScreen('play-screen');initLevel(1)}function initLevel(lv){if(lv===1){size=5}else if(lv===2){size=6}else if(lv===3){size=7}else{size=8}colors=Math.min(3+lv,6);target=2+lv*2;taps=0;$('level').textContent=lv;$('targetTaps').textContent=target;$('taps').textContent='0';grid=[];for(let i=0;i<size;i++){grid[i]=[];for(let j=0;j<size;j++){grid[i][j]=Math.floor(Math.random()*colors)}}drawButtons();drawGrid()}function drawButtons(){for(let i=0;i<5;i++){let b=$('c'+i);if(i<colors){b.style.display='block';b.style.background=COLORS[i]}else{b.style.display='none'}}}function drawGrid(){let g=$('grid');g.style.gridTemplateColumns='repeat('+size+',1fr)';g.innerHTML='';for(let i=0;i<size;i++){for(let j=0;j<size;j++){let d=document.createElement('div');d.id='cell-'+i+'-'+j;d.style.background=COLORS[grid[i][j]];d.className='aspect-square rounded-sm';g.appendChild(d)}}}function flood(c){let base=grid[0][0];if(base===c)return;function fill(x,y){if(grid[x][y]!==base)return;grid[x][y]=c;if(x>0)fill(x-1,y);if(y>0)fill(x,y-1);if(x<size-1)fill(x+1,y);if(y<size-1)fill(x,y+1)}fill(0,0)}function allSame(){let c=grid[0][0];for(let i=0;i<size;i++)for(let j=0;j<size;j++)if(grid[i][j]!==c)return false;return true}document.querySelectorAll('.color-btn').forEach(b=>{b.addEventListener('click',function(){if($('play-screen').classList.contains('hidden'))return;let c=parseInt(this.dataset.c);let base=grid[0][0];if(base===c)return;flood(c);taps++;$('taps').textContent=taps;playSound(300+taps*20,0.15,'sine');drawGrid();if(allSame()){let pts=Math.max(20,100-(taps-target)*15+target*10);playerScore+=pts;playSound(600,0.3,'sine');if(currentLevel>=5){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('winMsg').textContent=' أكملت الشيفرة';$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{currentLevel++;setTimeout(function(){initLevel(currentLevel)},600)}}else if(taps>target*2){playSound(150,0.4,'sawtooth');let bs=getBest();if(playerScore>bs)setBest(playerScore);$('winMsg').textContent='';$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}})})showStart()</script></body></html>
