<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>تخمين النرد</title></head><body class="bg-gradient-to-b from-emerald-900 to-emerald-950 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-amber-300"><h1 class="text-4xl font-bold mb-4">تخمين النرد</h1><p class="text-amber-200 mb-6">توقّع: هل مجموع النردتين أكبر من 7، أصغر، أو يساوي تماماً!</p><p class="text-sm text-amber-400 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-amber-500 hover:bg-amber-600 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-emerald-800/60 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-amber-200 font-bold mb-4"><span>الجولة: <span id="round">1</span>/12</span><span>النقاط: <span id="score">0</span></span></div><div class="flex justify-center gap-6 mb-4"><div id="die1" class="w-20 h-20 bg-white rounded-xl flex items-center justify-center text-3xl font-bold text-emerald-900"></div><div id="die2" class="w-20 h-20 bg-white rounded-xl flex items-center justify-center text-3xl font-bold text-emerald-900"></div></div><p class="text-center text-amber-200 font-bold mb-3">ماذا تتوقع؟</p><div class="flex gap-2 mb-3"><button onclick="guess('lower')" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-lg py-2 rounded-lg">أقل</button><button onclick="guess('exact')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-lg py-2 rounded-lg">يساوي 7</button><button onclick="guess('higher')" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-lg py-2 rounded-lg">أكبر</button></div><div id="result" class="text-center text-amber-200 font-bold min-h-6"></div></div></div><div id="finish-screen" class="hidden text-center text-amber-300"><h2 class="text-3xl font-bold mb-4">انتهت الجولات!</h2><p class="text-2xl text-amber-200 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-amber-400 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-amber-500 hover:bg-amber-600 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentRound=1,playerScore=0,streak=0,sum=0,rolled=false,audioCtx;const PIPS=['','⚀','⚁','⚂','⚃','⚄','⚅'];function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('dice-odds-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('dice-odds-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentRound=1;playerScore=0;streak=0;showScreen('play-screen');rollDice()}function rollDice(){let d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);sum=d1+d2;$('die1').textContent=PIPS[d1];$('die2').textContent=PIPS[d2];rolled=false;playSound(200,0.4,'sawtooth');$('result').textContent='ماذا تتوقع؟'}function guess(g){if(rolled)return;rolled=true;let outcome=sum>7?'higher':(sum<7?'lower':'exact');let won=false;if(g==='exact'){won=(outcome==='exact')}else{won=(g===outcome)}playSound(500,0.2,'triangle');if(won){streak++;let pts=50+streak*15;if(g==='exact')pts+=30;playerScore+=pts;$('result').textContent='إجابة صحيحة! +'+pts+' نقطة'}else{streak=0;$('result').textContent='خطأ! المجموع '+sum+' ('+(outcome==='higher'?'أكبر':(outcome==='lower'?'أقل':'يساوي 7'))+')'}currentRound++;if(currentRound>12){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{$('score').textContent=playerScore;$('round').textContent=currentRound;setTimeout(rollDice,1200)}}showStart()</script></body></html>
