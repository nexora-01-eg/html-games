<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>علم المتفجرات</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#6B7280}
.cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border-radius:4px;cursor:pointer;user-select:none;transition:background .15s}
.cell-hidden{background:linear-gradient(135deg,#9CA3AF,#6B7280);border:2px solid #4B5563}
.cell-hidden:hover{background:linear-gradient(135deg,#A3B1C2,#7C8DA0)}
.cell-revealed{background:#D1D5DB;border:1px solid #9CA3AF}
.cell-flagged{background:linear-gradient(135deg,#9CA3AF,#6B7280);border:2px solid #F59E0B}
.cell-mine{background:#EF4444}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4" style="font-family:sans-serif">
<h1 class="text-3xl font-bold text-white mb-2">علم المتفجرات</h1>
<p class="text-gray-300 mb-2 text-sm">كليك يسار: كشف | كليك يمين / ضغطة طويلة: علم</p>
<div class="flex gap-6 mb-3 text-white text-lg">
<div>الأعلام: <span id="flags">0</span>/10</div>
<div>الأفضل: <span id="best" class="font-bold">0</span></div>
</div>
<div id="grid" class="grid gap-1 mb-3" style="grid-template-columns:repeat(8,44px)"></div>
<button id="restart" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg text-lg font-bold">جديد</button>
<div id="msg" class="text-2xl font-bold text-white mt-2 hidden"></div>
<script>
const SIZE=8,MINES=10;
let board,revealed,flagged,gameOver,mineCount;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playTone(f,d,t='sine'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function init(){
board=Array(SIZE*SIZE).fill(0);revealed=Array(SIZE*SIZE).fill(false);flagged=Array(SIZE*SIZE).fill(false);gameOver=false;mineCount=MINES;
let placed=0;
while(placed<MINES){const i=Math.floor(Math.random()*SIZE*SIZE);if(board[i]!==-1){board[i]=-1;placed++}}
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
if(board[r*SIZE+c]===-1)continue;
let cnt=0;
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr*SIZE+nc]===-1)cnt++;
}board[r*SIZE+c]=cnt;
}
render();document.getElementById('msg').classList.add('hidden');
}
function render(){
const g=document.getElementById('grid');g.innerHTML='';
for(let i=0;i<SIZE*SIZE;i++){
const d=document.createElement('div');d.className='cell';
if(revealed[i]){
d.classList.add(board[i]===-1?'cell-mine':'cell-revealed');
d.textContent=board[i]===-1?'💣':board[i]===0?'':board[i];
if(board[i]>=1)d.style.color=['#1E40AF','#166534','#DC2626','#7C3AED','#0E7490','#000','#555','#888'][board[i]-1];
}else if(flagged[i]){
d.classList.add('cell-flagged');d.textContent='🚩';
}else{
d.classList.add('cell-hidden');d.textContent='';
}
d.addEventListener('click',()=>reveal(i));
d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});
let pressTimer;
d.addEventListener('touchstart',e=>{pressTimer=setTimeout(()=>{e.preventDefault();toggleFlag(i)},400)});
d.addEventListener('touchend',()=>clearTimeout(pressTimer));
g.appendChild(d);
}
document.getElementById('flags').textContent=flagged.filter(Boolean).length;
let storedBest='0';try{storedBest=localStorage.getItem('flag-swep-best')||'0'}catch(e){}
document.getElementById('best').textContent=storedBest;
}
function reveal(i){
if(gameOver||flagged[i]||revealed[i])return;
revealed[i]=true;
if(board[i]===-1){gameOver=true;playTone(150,.5,'sawtooth');for(let j=0;j<SIZE*SIZE;j++)if(board[j]===-1)revealed[j]=true;render();document.getElementById('msg').textContent='💥 خسرت!';document.getElementById('msg').classList.remove('hidden');return}
playTone(500+board[i]*80,.1);
if(board[i]===0)floodReveal(i);
const safe=revealed.filter((v,idx)=>v&&board[idx]!==-1).length;
if(safe===SIZE*SIZE-MINES){gameOver=true;playTone(523,.15);setTimeout(()=>playTone(659,.15),150);setTimeout(()=>playTone(784,.3),300);
const sc=100+flagged.filter(Boolean).length*20;
let best=0;try{best=parseInt(localStorage.getItem('flag-swep-best'))||0}catch(e){}
if(sc>best){try{localStorage.setItem('flag-swep-best',sc)}catch(e){}}
document.getElementById('best').textContent=Math.max(sc,best);
document.getElementById('msg').textContent='🎉 فزت!';document.getElementById('msg').classList.remove('hidden')}
render();
}
function floodReveal(i){
const q=[i];while(q.length){
const cur=q.shift();const r=Math.floor(cur/SIZE),c=cur%SIZE;
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){const ni=nr*SIZE+nc;if(!revealed[ni]&&!flagged[ni]&&board[ni]!==-1){revealed[ni]=true;if(board[ni]===0)q.push(ni)}}
}
}}
function toggleFlag(i){if(gameOver||revealed[i])return;flagged[i]=!flagged[i];playTone(flagged[i]?700:400,.1);render()}
document.getElementById('restart').addEventListener('click',init);
document.getElementById('flags').textContent=flagged.filter(Boolean).length;
init();
</script>
</body>
</html>
