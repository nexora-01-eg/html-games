<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فأر الشوكولاتة 🐭</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#3b2418,#241209);color:#f3e3cf;min-height:100vh}
.chocchip{background:#4a2f1f;border:1.5px solid #7a4b2b;border-radius:999px;padding:.32rem 1rem;font-weight:800;font-size:.85rem;color:#f3e3cf}
.cardc{background:#45291a;border:2px solid #7a4b2b;border-radius:1.6rem;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#mazeWrap{position:relative;margin-inline:auto;background:#55362a;border-radius:.6rem;overflow:hidden;touch-action:none}
.cellw{position:absolute;box-sizing:border-box}
#player{position:absolute;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:left .11s ease,top .11s ease;z-index:5}
#goalEl{position:absolute;display:flex;align-items:center;justify-content:center;font-size:1.15rem;z-index:4}
.dbtn{background:#6b4226;color:#f3e3cf;border-radius:1rem;font-size:1.25rem;font-weight:900;box-shadow:0 4px 0 #3b2418;width:54px;height:44px}
.dbtn:active{transform:translateY(3px);box-shadow:none}
.btn-choc{background:#e8a75d;color:#3b2418;border-radius:999px;font-weight:900;box-shadow:0 6px 0 #b97a38;transition:all .09s}
.btn-choc:hover{filter:brightness(1.06)}
.btn-choc:active{transform:translateY(4px);box-shadow:0 2px 0 #b97a38}
.shake{animation:sh .25s}
@keyframes sh{50%{transform:translateX(-5px)}}
</style>
</head>
<body class="select-none">

<main class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">

<div id="startScr" class="cardc px-10 py-12 text-center max-w-lg">
<div class="text-6xl mb-2">🐭</div>
<h1 class="text-4xl md:text-5xl font-black mb-3" style="color:#e8a75d">فأر الشوكولاتة</h1>
<p class="leading-relaxed mb-2">قدّ الفأر عبر متاهات الكاكاو…<br><b>٣ مستويات</b> تكبر في كل مرة!</p>
<p class="text-sm opacity-65 mb-8">الأسهم أو WASD للحركة · زر اللمس للموبايل 🧀<br>كلما أسرعت وقلّت خطواتك زادت النقاط</p>
<button onclick="start()" class="btn-choc px-14 py-3.5 text-xl">انطلق يا فأر! 🍫</button>
<p class="mt-6 text-sm opacity-60">أفضل نتيجة: <span id="bestStart" class="font-bold text-[#e8a75d]">—</span></p>
</div>

<div id="playScr" class="hidden w-full max-w-md">
<div class="flex justify-between items-center mb-3 flex-wrap gap-1.5">
<span class="chocchip">المستوى <span id="lvlEl" class="text-[#e8a75d] font-black">١</span>/٣</span>
<span class="chocchip">خطوات <span id="stepsEl" class="font-black">٠</span></span>
<span class="chocchip">⏱ <span id="secsEl" class="text-[#e8a75d] font-black">٠</span>ث</span>
<span class="chocchip">⭐ <span id="scoreEl" class="text-[#e8a75d] font-black">٠</span></span>
<span class="chocchip !cursor-pointer" onclick="togglePause()" id="pauseChip">⏸ وقفة</span>
</div>

<div id="mazeWrap"></div>

<div class="flex justify-center gap-2 mt-4">
<div class="grid grid-cols-3 gap-1.5">
<span></span><button class="dbtn" onclick="tryMove(0,-1)">↑</button><span></span>
<button class="dbtn" onclick="tryMove(-1,0)">←</button>
<button class="dbtn" onclick="tryMove(0,1)">↓</button>
<button class="dbtn" onclick="tryMove(1,0)">→</button>
</div>
</div>
<div id="msg" class="h-8 mt-3 text-center font-bold"></div>
</div>

<div id="endScr" class="hidden cardc px-12 py-12 text-center max-w-md w-full">
<div class="text-6xl mb-2">🧀</div>
<h2 class="text-3xl font-black mb-5" style="color:#e8a75d">وجبت الجبنة!</h2>
<div id="finalScore" class="text-6xl font-black mb-3" style="color:#ffd28f">٠</div>
<p id="endMsg" class="opacity-80 mb-8 leading-relaxed"></p>
<button onclick="start()" class="btn-choc px-12 py-3 text-lg">متاهات جديدة ↻</button>
</div>

</main>

<script>
const $=id=>document.getElementById(id);
const bestKey='choco-maze-best';
const LEVELS=[9,11,13];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let N=0,walls=[],pr=0,pc=0,cellPx=0,level=1,totalScore=0,lvlStart=0,timer=null,over=true,paused=false,pauseAt=0,pauseCum=0,ac=null;
function snd(f,d,type,g){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'triangle';o.frequency.value=f;v.gain.setValueAtTime(g||.05,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12));}catch(e){}}
function loadBest(){let v=0;try{v=+localStorage.getItem(bestKey)||0;}catch(e){};$('bestStart').textContent=v?AR(v):'—';}
loadBest();
function genMaze(n){
const W=Array.from({length:n*n},()=>({t:1,r:1,b:1,l:1,v:false}));
const st=[0];W[0].v=true;
while(st.length){
const cur=st[st.length-1];
const r=Math.floor(cur/n),c=cur%n;
const opts=[];
if(r>0&&!W[cur-n].v)opts.push([cur-n,'t','b']);
if(c<n-1&&!W[cur+1].v)opts.push([cur+1,'r','l']);
if(r<n-1&&!W[cur+n].v)opts.push([cur+n,'b','t']);
if(c>0&&!W[cur-1].v)opts.push([cur-1,'l','r']);
if(!opts.length){st.pop();continue;}
const [nxt,a,bo]=opts[Math.floor(Math.random()*opts.length)];
W[cur][a]=0;W[nxt][bo]=0;W[nxt].v=true;st.push(nxt);
}
return W;
}
function liveSecs(){return Math.round((performance.now()-lvlStart-pauseCum)/1000);}
function buildLevel(){
N=LEVELS[level-1];
walls=genMaze(N);
pr=0;pc=0;
const wrap=$('mazeWrap');
wrap.innerHTML='';
const size=Math.min(34,Math.floor((Math.min(window.innerWidth-60,360))/N));
cellPx=size;
wrap.style.width=N*cellPx+'px';
wrap.style.height=N*cellPx+'px';
for(let i=0;i<N*N;i++){
const c=document.createElement('div');
c.className='cellw';
c.style.left=(i%N)*cellPx+'px';
c.style.top=Math.floor(i/N)*cellPx+'px';
const w=walls[i];
c.style.width=cellPx+'px';c.style.height=cellPx+'px';
['top','right','bottom','left'].forEach(side=>{
c.style['border'+side[0].toUpperCase()+side.slice(1)]=(w[side]?'3px':'0')+' solid #2a170d';
});
wrap.appendChild(c);
}
const goal=document.createElement('div');
goal.id='goalEl';goal.textContent='🧀';
goal.style.width=goal.style.height=cellPx+'px';
goal.style.left=(N-1)*cellPx+'px';goal.style.top=(N-1)*cellPx+'px';
wrap.appendChild(goal);
const pl=document.createElement('div');
pl.id='player';pl.textContent='🐭';
pl.style.width=pl.style.height=cellPx+'px';
wrap.appendChild(pl);
placePlayer();
$('lvlEl').textContent=AR(level);
$('stepsEl').textContent='٠';
$('msg').textContent='';
window.__steps=0;
clearInterval(timer);
lvlStart=performance.now();pauseCum=0;paused=false;
timer=setInterval(()=>{if(!paused)$('secsEl').textContent=AR(liveSecs());},1000);
snd(480,.1,'triangle',.05);
}
function placePlayer(){
const p=$('player');
p.style.left=pc*cellPx+'px';p.style.top=pr*cellPx+'px';
}
function tryMove(dx,dy){
if(over||paused)return;
const w=walls[pr*N+pc];
const blocked=(dx===1&&w.r)||(dx===-1&&w.l)||(dy===1&&w.b)||(dy===-1&&w.t);
if(blocked){
$('mazeWrap').classList.add('shake');
setTimeout(()=>$('mazeWrap').classList.remove('shake'),260);
snd(140,.08,'square',.03);
return;
}
pc+=dx;pr+=dy;
window.__steps++;
$('stepsEl').textContent=AR(window.__steps);
placePlayer();
snd(320,.04,'sine',.03);
if(pr===N-1&&pc===N-1)levelClear();
}
function levelClear(){
clearInterval(timer);
const secs=liveSecs();
const gain=Math.max(40,300-secs*5-window.__steps*2);
totalScore+=gain;
$('scoreEl').textContent=AR(totalScore);
$('msg').textContent=`🧀 وصلت! +${AR(gain)} نقطة`;
snd(700,.12,'triangle',.06);setTimeout(()=>snd(900,.14,'triangle',.06),120);
setTimeout(()=>{
level++;
if(level>LEVELS.length)return finish();
buildLevel();
},1100);
}
function start(){
totalScore=0;level=1;over=false;
$('scoreEl').textContent='٠';
$('endScr').classList.add('hidden');$('startScr').classList.add('hidden');
$('playScr').classList.remove('hidden');
buildLevel();
}
function finish(){
over=true;
$('playScr').classList.add('hidden');
$('endScr').classList.remove('hidden');
$('finalScore').textContent=AR(totalScore);
const v=+localStorage.getItem(bestKey)||0;
let m='ثلاث متاهات… والجبنة في المعدة!';
if(totalScore>v&&totalScore>0){try{localStorage.setItem(bestKey,totalScore);}catch(e){}m+=' رقم قياسي جديد 🏆';loadBest();}
else if(v)m+=' أفضل نتيجة لك: '+AR(v);
$('endMsg').textContent=m;
[600,760,950].forEach((f,i)=>setTimeout(()=>snd(f,.15,'triangle',.05),i*130));
}
function togglePause(){
if(over)return;
paused=!paused;
const c=$('pauseChip');
if(paused){pauseAt=performance.now();c.textContent='▶ كمّل';$('msg').textContent='⏸ وقفة';}
else{pauseCum+=performance.now()-pauseAt;pauseAt=0;c.textContent='⏸ وقفة';$('msg').textContent='';$('secsEl').textContent=AR(liveSecs());}
}
document.addEventListener('keydown',e=>{
if(e.key==='Escape'){togglePause();return;}
if($('playScr').classList.contains('hidden'))return;
const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
const m=map[e.key];
if(m){e.preventDefault();tryMove(m[0],m[1]);}
});
</script>
</body>
</html>
