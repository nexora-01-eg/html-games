<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>طيّر الطيّارة</title></head><body class="bg-gradient-to-b from-blue-300 to-blue-100 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center"><h1 class="text-4xl font-bold text-blue-800 mb-4">طيّر الطيّارة</h1><p class="text-blue-600 mb-6">اختر الزاوية والقوة وأطلق الطيّارة وصلها للهدف!</p><p class="text-sm text-blue-500 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-blue-600 hover:bg-blue-700 text-white text-xl px-8 py-3 rounded-full">ابدأ اللعب</button></div><div id="play-screen" class="hidden"><div class="bg-white rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-blue-800 font-bold mb-2"><span>المستوى: <span id="level">1</span>/8</span><span>النقاط: <span id="score">0</span></span></div><canvas id="gameCanvas" width="440" height="300" class="w-full rounded-lg bg-sky-200 border border-blue-300"></canvas></div><div class="flex gap-4 mb-4"><div class="flex-1"><label class="text-blue-700 font-bold text-sm">الزاوية: <span id="angleVal">45</span>°</label><input type="range" id="angleSlider" min="10" max="80" value="45" class="w-full accent-blue-600"></div><div class="flex-1"><label class="text-blue-700 font-bold text-sm">القوة: <span id="powerVal">50</span></label><input type="range" id="powerSlider" min="20" max="100" value="50" class="w-full accent-blue-600"></div></div><button onclick="launch()" class="w-full bg-green-600 hover:bg-green-700 text-white text-xl py-2 rounded-full font-bold">أطلق!</button></div><div id="finish-screen" class="hidden text-center"><h2 class="text-3xl font-bold text-blue-800 mb-4">أحسنت!</h2><p class="text-2xl text-blue-600 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-blue-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-blue-600 hover:bg-blue-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let currentLevel=1,score=0,planeX,planeY,planeVX,planeVY,flying=false,animId=null,audioCtx;function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('paper-air-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('paper-air-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){currentLevel=1;score=0;showScreen('play-screen');initLevel()}function initLevel(){flying=false;if(animId)cancelAnimationFrame(animId);drawScene()}let platforms=[[350,250,60,10],[300,200,70,10],[380,160,50,10],[320,130,60,10],[360,100,50,10],[280,220,65,10],[400,180,45,10],[340,80,55,10]];function drawScene(){let c=$('gameCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let bg=ctx.createLinearGradient(0,0,0,c.height);bg.addColorStop(0,'#87CEEB');bg.addColorStop(1,'#E0F0FF');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#8B4513';ctx.fillRect(0,c.height-10,c.width,10);let p=platforms[(currentLevel-1)%8];ctx.fillStyle='#228B22';ctx.fillRect(p[0],p[1],p[2],p[3]);ctx.fillStyle='#FF0000';ctx.beginPath();ctx.arc(p[0]+p[2]/2,p[1]-6,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFFFFF';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('الهدف',p[0]+p[2]/2,p[1]-14);if(!flying){ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(30,c.height-25,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,c.height-25);let a=($('angleSlider').value)*Math.PI/180,ln=30+($('powerSlider').value)*0.3;ctx.lineTo(30+Math.cos(a)*ln,c.height-25-Math.sin(a)*ln);ctx.stroke();$('angleVal').textContent=$('angleSlider').value;$('powerVal').textContent=$('powerSlider').value}}function launch(){if(flying)return;initAudio();playSound(400,0.3,'sine');flying=true;planeX=30;planeY=280;let a=$('angleSlider').value*Math.PI/180,pw=$('powerSlider').value*0.4;planeVX=Math.cos(a)*pw;planeVY=-Math.sin(a)*pw;animId=requestAnimationFrame(fly)}function fly(){planeVY+=0.15;planeX+=planeVX;planeY+=planeVY;let c=$('gameCanvas'),ctx=c.getContext('2d');drawScene();ctx.fillStyle='#FFD700';ctx.beginPath();ctx.moveTo(planeX,planeY);ctx.lineTo(planeX-12,planeY+4);ctx.lineTo(planeX-4,planeY-2);ctx.lineTo(planeX,planeY);ctx.fill();if(planeY>=270||planeX>c.width||planeX<0||planeY<0){flying=false;let p=platforms[(currentLevel-1)%8];if(planeX>=p[0]-5&&planeX<=p[0]+p[2]+5&&planeY>=p[1]-15&&planeY<=p[1]+20){playSound(600,0.2,'sine');let pts=Math.max(10,50-Math.abs(planeX-(p[0]+p[2]/2)));score+=pts;currentLevel++;if(currentLevel>8){let b=getBest();if(score>b)setBest(score);$('finalScore').textContent=score;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{$('level').textContent=currentLevel;$('score').textContent=score;initLevel()}}else{playSound(200,0.5,'sawtooth');let b=getBest();if(score>b)setBest(score);$('finalScore').textContent=score;$('finalBest').textContent=getBest();showScreen('finish-screen')}}else{animId=requestAnimationFrame(fly)}}showStart()</script></body></html>
