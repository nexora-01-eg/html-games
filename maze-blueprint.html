<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>المتاهة الهندسية FIG.1 📐</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background-color:#edf3fa;background-image:linear-gradient(#ccdcee 1px,transparent 1px),linear-gradient(90deg,#ccdcee 1px,transparent 1px);background-size:22px 22px}
.dbtn{border:2px solid #1e3a5f;background:white;font-weight:bold;border-radius:.5rem;padding:.5rem 0;box-shadow:3px 3px 0 #1e3a5f;transition:all .08s;user-select:none}
.dbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 #1e3a5f}
#player{transition:transform .13s ease}
</style>
</head>
<body class="min-h-screen text-[#1e3a5f] flex flex-col items-center py-6 px-3">
<header class="text-center mb-5">
  <p class="text-[11px] tracking-[.35em] font-bold opacity-60 mb-1">ورشة الرسومات الهندسية — قسم الملاحة</p>
  <h1 class="text-3xl md:text-4xl font-black border-double border-b-4 border-[#1e3a5f] pb-1">📐 المتاهة الهندسية</h1>
</header>

<div class="w-full max-w-md bg-white/75 border-2 border-[#1e3a5f] rounded-lg p-4 relative shadow-[5px_5px_0_rgba(30,58,95,.2)]">
  <div class="flex justify-between items-center text-xs font-bold mb-3">
    <span id="fig" class="bg-[#1e3a5f] text-white px-2 py-0.5 rounded-sm">FIG.1</span>
    <span>⏱ <span id="clock">00:00</span></span>
    <span>👣 <span id="steps">0</span></span>
    <button id="pauseBtn" onclick="togglePause()" class="bg-[#1e3a5f] text-white px-2 py-0.5 rounded-sm select-none">⏸</button>
  </div>

  <div class="relative border-2 border-[#1e3a5f] bg-white/60">
    <div id="grid" dir="ltr" class="grid"></div>
    <div id="player" class="absolute top-0 left-0 z-10 flex items-center justify-center pointer-events-none">
      <div class="w-[72%] h-[72%] rounded-full bg-[#1e3a5f] ring-2 ring-[#e2574c]"></div>
    </div>
  </div>

  <div class="mt-4 grid grid-cols-3 gap-2 max-w-[190px] mx-auto select-none">
    <div></div>
    <button class="dbtn" onclick="move(-1,0)">▲</button>
    <div></div>
    <button class="dbtn" onclick="move(0,-1)">◀</button>
    <button class="dbtn" onclick="move(1,0)">▼</button>
    <button class="dbtn" onclick="move(0,1)">▶</button>
  </div>
  <p class="text-[11px] text-center opacity-60 mt-3">أسهم الكيبورد أو WASD تعمل أيضاً • اوصل إلى 🏁</p>

  <div id="doneOv" class="hidden absolute inset-0 bg-white/90 rounded-lg flex flex-col items-center justify-center text-center p-6 z-20">
    <div class="text-5xl mb-2">🏁</div>
    <h2 class="text-2xl font-black mb-1">اكتملت جميع الأشكال!</h2>
    <p id="doneStats" class="text-sm font-semibold mb-5"></p>
    <button onclick="startAll()" class="dbtn px-8 py-2">إعادة المساحطة 🔄</button>
  </div>
</div>
<p class="text-[11px] opacity-60 mt-3">أفضل زمن كامل: <span id="bestFoot">—</span></p>

<script>
const LEVELS=[[6,5],[8,6],[10,8],[12,9],[14,10]];
let Li=0,W,H,walls=[],pr=0,pc=0,totalSteps=0,timerInt=null,startTs=null,fin=false,paused=false,pauseTs=0;

const $=function(id){return document.getElementById(id);};
function idx(r,c){return r*W+c;}

function fmt(s){var m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(Math.floor(s%60)).padStart(2,'0');return m+':'+ss;}

function tick(){if(startTs)$('clock').textContent=fmt((Date.now()-startTs)/1000);}

function genMaze(w,h){
 const vis=new Array(w*h).fill(false);
 const wl=new Array(w*h).fill(15);
 const stack=[0];vis[0]=true;
 while(stack.length){
   const cur=stack[stack.length-1];
   const r=Math.floor(cur/w),c=cur%w;
   const nbs=[];
   if(r>0&&!vis[cur-w])nbs.push([cur-w,1,4]);
   if(c<w-1&&!vis[cur+1])nbs.push([cur+1,2,8]);
   if(r<h-1&&!vis[cur+w])nbs.push([cur+w,4,1]);
   if(c>0&&!vis[cur-1])nbs.push([cur-1,8,2]);
   if(!nbs.length){stack.pop();continue;}
   const pick=nbs[Math.floor(Math.random()*nbs.length)];
   const nb=pick[0],a=pick[1],b=pick[2];
   wl[cur]&=~a;wl[nb]&=~b;
   vis[nb]=true;stack.push(nb);
 }
 return wl;
}

function render(){
 const g=$('grid');
 g.style.gridTemplateColumns='repeat('+W+',1fr)';
 g.innerHTML='';
 for(let i=0;i<W*H;i++){
   const d=document.createElement('div');
   d.className='relative aspect-square';
   const wl=walls[i];
   d.style.borderTop=(wl&1)?'2px solid #1e3a5f':'2px dashed transparent';
   d.style.borderRight=(wl&2)?'2px solid #1e3a5f':'2px dashed transparent';
   d.style.borderBottom=(wl&4)?'2px solid #1e3a5f':'2px dashed transparent';
   d.style.borderLeft=(wl&8)?'2px solid #1e3a5f':'2px dashed transparent';
   if(i===W*H-1){
     d.style.background='rgba(226,87,76,.15)';
     d.innerHTML='<span class="absolute inset-0 flex items-center justify-center text-sm md:text-base">🏁</span>';
   }
   g.appendChild(d);
 }
}

function updatePlayer(){
 const pv=$('player');
 pv.style.width=(100/W)+'%';
 pv.style.height=(100/H)+'%';
 pv.style.transform='translate('+pc*100+'%,'+pr*100+'%)';
}

function loadLevel(){
 W=LEVELS[Li][0];H=LEVELS[Li][1];
 walls=genMaze(W,H);
 pr=0;pc=0;paused=false;
 var pb=$('pauseBtn');if(pb)pb.textContent='⏸';
 $('fig').textContent='FIG.'+(Li+1)+' • '+H+'×'+W;
 $('steps').textContent=totalSteps;
 render();updatePlayer();
}

function startAll(){
 Li=0;totalSteps=0;startTs=null;fin=false;paused=false;
 var pb=$('pauseBtn');if(pb)pb.textContent='⏸';
 clearInterval(timerInt);
 $('clock').textContent='00:00';
 $('doneOv').classList.add('hidden');
 loadLevel();
}

function move(dr,dc){
  if(fin||paused)return;
 const i=idx(pr,pc);
 const nr=pr+dr,nc=pc+dc;
 if(nr<0||nr>=H||nc<0||nc>=W)return;
 if(dr===-1&&(walls[i]&1))return;
 if(dr===1&&(walls[i]&4))return;
 if(dc===1&&(walls[i]&2))return;
 if(dc===-1&&(walls[i]&8))return;
 pr=nr;pc=nc;totalSteps++;
 $('steps').textContent=totalSteps;
 if(!startTs){startTs=Date.now();timerInt=setInterval(tick,500);}
 updatePlayer();
 if(pr===H-1&&pc===W-1)levelDone();
}

function levelDone(){
 fin=true;
 if(Li>=LEVELS.length-1){finishGame();return;}
 $('fig').textContent='✔ تم الوصول!';
 setTimeout(function(){
   fin=false;Li++;
   loadLevel();
 },750);
}

function finishGame(){
 clearInterval(timerInt);
 const secs=(Date.now()-startTs)/1000;
 let best=0;try{best=Number(localStorage.getItem('maze-blueprint-best')||0)}catch(e){}
 let rec='';
 if(!best||secs<best){try{localStorage.setItem('maze-blueprint-best',secs)}catch(e){}rec=' — رقم قياسي! 🏅';}
 let newBest=0;try{newBest=Number(localStorage.getItem('maze-blueprint-best'))}catch(e){}
 $('doneStats').textContent='الزمن الكلي: '+fmt(secs)+' • الخطوات: '+totalSteps+rec+' • الأفضل: '+fmt(newBest);
 $('bestFoot').textContent=fmt(newBest)+' دقيقة';
 $('doneOv').classList.remove('hidden');
}

function togglePause(){
  if(fin||!startTs)return;
  paused=!paused;
  if(paused){
    pauseTs=Date.now();
    clearInterval(timerInt);
    $('pauseBtn').textContent='▶';
  }else{
    var shift=Date.now()-pauseTs;
    startTs+=shift;
    $('pauseBtn').textContent='⏸';
    timerInt=setInterval(tick,500);
  }
}

window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!fin){e.preventDefault();togglePause();return;}
  const map={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]};
  const m=map[e.key];
  if(m&&!paused){e.preventDefault();move(m[0],m[1]);}
});

(function(){
 let b=null;try{b=localStorage.getItem('maze-blueprint-best')}catch(e){}
 if(b)$('bestFoot').textContent=fmt(Number(b))+' دقيقة';
})();
startAll();
</script>
</body>
</html>
