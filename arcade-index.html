let curCat='all',q='';
function renderFilters(){
const counts={all:G.length};
G.forEach(g=>counts[g[1]]=(counts[g[1]]||0)+1);
const f=$('filtersEl');
f.innerHTML='';
[['all','الكل'],...Object.entries(CATS)].forEach(([k,label])=>{
const b=document.createElement('button');
b.className='chip'+(curCat===k?' on':'');
if(k!=='all')b.style.setProperty('--ac',ACC[k]);
b.textContent=k==='all'?`${label} (${AR(counts.all)})`:k+' '+label+` (${AR(counts[k]||0)})`;
b.onclick=()=>{curCat=k;render();renderFilters();};
f.appendChild(b);
});
}
function renderStats(){
const c={e:0,m:0,h:0};
G.forEach(g=>c[g[5]]++);
$('statsRow').innerHTML=
`<span class="chip !cursor-default">🎮 ${AR(G.length)} لعبة</span>
<span class="chip !cursor-default d-easy">🟢 سهلة ${AR(c.e)}</span>
<span class="chip !cursor-default d-med">🟡 متوسطة ${AR(c.m)}</span>
<span class="chip !cursor-default d-hard">🔴 صعبة ${AR(c.h)}</span>`;
}
function render(){
const g=$('gridEl');
g.innerHTML='';
const ql=q.trim();
const list=G.filter(([file,cat,name,cap,mind,d])=>
(curCat==='all'||cat===curCat)&&(!ql||name.includes(ql)||cap.includes(ql)||mind.includes(ql)));
list.forEach(([file,cat,name,cap,mind,d])=>{
const card=document.createElement('div');
card.className='hub';
card.style.setProperty('--ac',ACC[cat]);
card.innerHTML=`
<div class="p-5 flex flex-col grow">
<div class="flex items-start justify-between mb-2">
<span class="text-4xl">${name.match(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/u)?.[0]||'🎮'}</span>
<span class="badge ${DIFF[d][0]}">${DIFF[d][1]}</span>
</div>
