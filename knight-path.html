<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>مسار الحصان</title></head><body class="bg-gradient-to-b from-stone-700 to-stone-900 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-amber-200"><h1 class="text-4xl font-bold mb-4">مسار الحصان</h1><p class="text-amber-300 mb-6">حرّك الحصان ليزور كل النجوم في أقل عدد من الحركات!</p><p class="text-sm text-amber-400 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-amber-600 hover:bg-amber-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-stone-800 rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-amber-200 font-bold mb-4"><span>خطوة: <span id="move">0</span></span><span>النجوم: <span id="starsLeft">12</span>/12</span></div><div id="board" class="grid gap-1"></div><p class="text-center text-amber-200 mt-3 text-sm">انقر على خلية صالحة لتحريك الحصان</p></div></div><div id="finish-screen" class="hidden text-center text-amber-200"><h2 class="text-3xl font-bold mb-4">أكملت المسار!</h2><p class="text-2xl text-amber-300 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-amber-400 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-amber-600 hover:bg-amber-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let board=[],knightR=0,knightC=0,moveCount=0,starsTotal=12,starsVisited=0,playerScore=0,audioCtx;const N=6;const MOVES=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('knight-path-best')||'0')}catch(e){return 0}}function setBest(v){try{localStorage.setItem('knight-path-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){playerScore=0;showScreen('play-screen');newBoard()}function newBoard(){board=[];moveCount=0;starsVisited=0;knightR=Math.floor(Math.random()*N);knightC=Math.floor(Math.random()*N);for(let i=0;i<N;i++){board[i]=[];for(let j=0;j<N;j++){board[i][j]=0}}board[knightR][knightC]=1;let placed=0,tries=0;while(placed<starsTotal&&tries<200){let r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);tries++;if(board[r][c]===0){board[r][c]=2;placed++}}$('move').textContent='0';$('starsLeft').textContent=starsTotal;drawBoard()}function drawBoard(){let b=$('board');b.style.gridTemplateColumns='repeat('+N+',1fr)';b.innerHTML='';for(let i=0;i<N;i++){for(let j=0;j<N;j++){let d=document.createElement('div');d.id='cell-'+i+'-'+j;let dark=(i+j)%2===0;d.className='aspect-square rounded flex items-center justify-center text-lg '+(dark?'bg-stone-600':'bg-stone-500');if(board[i][j]===1){d.textContent='♞';d.style.fontSize='2rem'}else if(board[i][j]===2){d.textContent='★';d.style.color='#fbbf24'}else if(board[i][j]===3){d.textContent='♞';d.style.opacity='0.5'}if(isLegal(i,j)){d.className+=(dark?' hover:bg-stone-400':' hover:bg-stone-300');d.addEventListener('click',clicker(i,j))}b.appendChild(d)}}}function clicker(r,c){return function(){moveKnight(r,c)}}function isLegal(r,c){if(board[r][c]===3)return false;for(let m of MOVES){let nr=knightR+m[0],nc=knightC+m[1];if(nr===r&&nc===c)return true}return false}function moveKnight(r,c){board[knightR][knightC]=3;knightR=r;knightC=c;moveCount++;$('move').textContent=moveCount;if(board[r][c]===2){board[r][c]=1;starsVisited++;$('starsLeft').textContent=starsTotal-starsVisited;playSound(600,0.2,'sine')}else{board[r][c]=1;playSound(300,0.1,'sine')}drawBoard();if(starsVisited>=starsTotal){let bonus=Math.max(0,60-moveCount);playerScore+=50+bonus;let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}}showStart()</script></body></html>
