<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMON-83 🕹</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Courier New',monospace;background:#071a2c;background-image:radial-gradient(circle at 50% 30%,rgba(17,138,178,.15),transparent 55%)}
.crt::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0px,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px)}
.pad{transition:filter .12s,transform .12s;cursor:pointer}
.pad.lit,.pad:active{filter:brightness(2.4) saturate(1.4);transform:scale(.95)}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}}
h1{animation:flicker 4s infinite}
</style>
</head>
<body class="crt min-h-screen text-[#ffb703] flex flex-col items-center justify-center select-none">

<h1 class="text-5xl font-black tracking-[.3em] mb-2 drop-shadow-[0_0_18px_rgba(255,183,3,.7)]">SIMON·83</h1>
<p class="text-[#06d6a0] mb-6 text-lg font-bold">احفظ التسلسل… وكرره! كل جولة تزيد خطوة 🕹</p>

<div class="flex items-end gap-10 mb-5 px-8 py-3 border-2 border-dashed border-[#ffb703]/40 rounded">
<div class="text-center text-sm">المستوى<br><span id="level" class="text-3xl font-black text-[#ef476f]">0</span></div>
<div class="text-center text-sm">أفضل مستوى<br><span id="best" class="text-3xl font-black text-[#06d6a0]">0</span></div>
<div id="msg" class="text-center text-base font-bold text-white pb-1 min-w-32">اضغط ابدأ</div>
</div>

<div class="grid grid-cols-2 gap-3 p-4 rounded-full border-4 border-[#ffb703]/40 bg-black/50 shadow-[0_0_60px_rgba(255,183,3,.3)]">
<div data-i="0" class="pad w-28 h-28 md:w-36 md:h-36 rounded-tl-full bg-[#06d6a0]/50 border-4 border-[#06d6a0]"></div>
<div data-i="1" class="pad w-28 h-28 md:w-36 md:h-36 rounded-tr-full bg-[#ef476f]/50 border-4 border-[#ef476f]"></div>
<div data-i="2" class="pad w-28 h-28 md:w-36 md:h-36 rounded-bl-full bg-[#118ab2]/50 border-4 border-[#118ab2]"></div>
<div data-i="3" class="pad w-28 h-28 md:w-36 md:h-36 rounded-br-full bg-[#ffd166]/50 border-4 border-[#ffd166]"></div>
</div>

<button onclick="start()" class="mt-8 px-10 py-2 bg-[#ffb703] text-[#071a2c] font-black tracking-widest rounded-md hover:brightness-110 active:scale-95 transition">ابدأ ▶</button>

<script>
const pads=[...document.querySelectorAll('.pad')],levelEl=document.getElementById('level'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
const freqs=[330,277,220,165];
let seq=[],pos=0,busy=true,ac=null;
function beep(f,d,type,g){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'square';o.frequency.value=f;v.gain.setValueAtTime(g||.055,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
try{bestEl.textContent=+localStorage.getItem('retro-simon-best')||0;}catch(e){}
function lit(i,d){pads[i].classList.add('lit');beep(freqs[i],d/1000+.06);setTimeout(()=>pads[i].classList.remove('lit'),d);}
async function showSeq(){busy=true;msg.textContent='شوف… 👀';
const speed=Math.max(170,430-seq.length*20);
for(const s of seq){lit(s,speed);await new Promise(r=>setTimeout(r,speed+90));}
msg.textContent='دورك! 🔁';busy=false;pos=0;}
function start(){if(busy&&seq.length)return;seq=[];levelEl.textContent='0';next();}
function next(){seq.push(Math.floor(Math.random()*4));levelEl.textContent=seq.length;showSeq();}
function gameOver(){busy=true;beep(98,.8,'sawtooth',.09);
const lv=seq.length-1,b=+localStorage.getItem('retro-simon-best')||0;
let m='غلط! 💀 المستوى '+lv;
if(lv>b&&lv>0){try{localStorage.setItem('retro-simon-best',lv);}catch(e){}bestEl.textContent=lv;m+=' · رقم قياسي 🏆';}
msg.textContent=m;seq=[];}
pads.forEach(p=>p.addEventListener('pointerdown',()=>{
if(busy||!seq.length)return;
const i=+p.dataset.i;lit(i,180);
if(i===seq[pos]){pos++;
if(pos===seq.length){msg.textContent='تمام! ✅';beep(988,.16,'triangle',.07);setTimeout(next,850);}
}else gameOver();
}));
document.addEventListener('keydown',e=>{if(e.code==='Enter')start();});
busy=false;
</script>
</body>
</html>
