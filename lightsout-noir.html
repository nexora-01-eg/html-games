<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ملف المصابيح — قضية نوار 🔍</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Georgia,'Times New Roman',serif;background-color:#120d09;background-image:radial-gradient(circle at 50% 15%,rgba(255,184,77,.08),transparent 55%);color:#e8dcc0}
.cell{width:100%;aspect-ratio:1;border-radius:.6rem;border:2px solid #3f3226;background:#241b11;transition:all .22s ease;display:flex;align-items:center;justify-content:center}
.cell:hover:not(.on){background:#2f2317}
.dot{width:26%;height:26%;border-radius:9999px;background:#4a3a28;transition:all .22s}
.cell.on{background:radial-gradient(circle at 35% 30%,#ffe9ad,#ffb84d 62%,#b97a1e);box-shadow:0 0 20px rgba(255,184,77,.8),inset 0 0 10px rgba(255,255,255,.55);border-color:#ffd98a}
.cell.on .dot{background:#fff7e0;box-shadow:0 0 8px #fff}
.hintglow{outline:3px dashed #ff5d5d;outline-offset:3px;border-radius:.6rem}
.btnN{border:1px solid #caa64b;color:#caa64b;padding:.45rem 1.1rem;border-radius:.5rem;font-weight:bold;transition:all .15s;font-size:.85rem}
.btnN:hover{background:rgba(202,166,75,.12)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-sm relative">

  <div class="text-center mb-5">
    <span class="inline-block -rotate-2 bg-[#c0392b] text-[#f5ead6] text-[11px] tracking-[.25em] px-3 py-1 mb-3">ملف رقم ٢٢ — قسم الإضاءة</span>
    <h1 class="text-3xl md:text-4xl font-bold">🔍 ملف المصابيح</h1>
    <p class="text-sm opacity-75 mt-2 leading-6">كل ضغطة تشعل أو تطفئ المصباح وجيرانه.<br>أطفئ الجميع… وأغلق القضية.</p>
  </div>

  <section class="bg-black/30 border border-[#3f3226] rounded-xl p-4">
    <div class="flex justify-between text-xs font-bold text-[#caa64b] mb-3 px-1">
      <span>🕵️ نقلات: <b id="moves">0</b></span>
      <span>⏱ <b id="clock">00:00</b></span>
      <span>🏅 <b id="best">—</b></span>
    </div>
    <div id="grid" class="grid grid-cols-5 gap-2"></div>

    <div id="fb" class="h-6 mt-3 text-center text-xs text-[#ff9d9d]"></div>

    <div class="flex justify-center gap-3 mt-3">
      <button onclick="newCase()" class="btnN">قضية جديدة 🔄</button>
      <button onclick="hint()" class="btnN">تلميح (+٥ نقلات) 💡</button>
    </div>
  </section>

  <div id="winOv" class="hidden absolute inset-0 z-30 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/80 rounded-xl"></div>
    <div class="relative text-center p-8 border-2 border-[#caa64b] bg-[#1a130c] max-w-[260px] w-full">
      <div class="text-5xl mb-2">🕵️‍♂️</div>
      <h2 class="text-2xl font-bold text-[#ffd98a] mb-2">القضية أُغلقت</h2>
      <p id="winStats" class="text-sm opacity-90 leading-6 mb-5"></p>
      <button onclick="newCase()" class="btnN">ملف جديد 📁</button>
    </div>
  </div>

  <p class="text-center text-[11px] opacity-50 mt-4">المصباح الذي تضغطه يتبدل هو ومن حوله فقط… المنطق وحده يحل القضية.</p>
</main>

<script>
const $=function(id){return document.getElementById(id);};
const N=5,SZ=N*N;
let grid=new Array(SZ).fill(false);
let moves=0,startTs=null,timerInt=null,solved=true,busyHint=false,ac=null;
function snd(f,d){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.1));o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1));}catch(e){}}
function loadBest(){try{const b=JSON.parse(localStorage.getItem('noir-lights-best')||'null');if(b)$('best').textContent=b.moves+' نقلة';}catch(e){}}
function saveBest(m,t){try{const b={moves:m,time:t};localStorage.setItem('noir-lights-best',JSON.stringify(b));}catch(e){}}

function fmt(s){var m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(Math.floor(s%60)).padStart(2,'0');return m+':'+ss;}

function neigh(i){
 const r=Math.floor(i/N),c=i%N,res=[i];
 if(r>0)res.push(i-N);
 if(r<N-1)res.push(i+N);
 if(c>0)res.push(i-1);
 if(c<N-1)res.push(i+1);
 return res;
}

function buildGrid(){
 const g=$('grid');g.innerHTML='';
 for(let i=0;i<SZ;i++){
   const d=document.createElement('button');
   d.className='cell';
   d.innerHTML='<span class="dot"></span>';
   d.onclick=function(){clickCell(i,d);};
   g.appendChild(d);
 }
}

function paint(){
 Array.prototype.forEach.call($('grid').children,function(el,i){
   el.classList.toggle('on',grid[i]);
   el.classList.remove('hintglow');
 });
 $('moves').textContent=moves;
}

function tick(){
 if(startTs&&!solved)$('clock').textContent=fmt((Date.now()-startTs)/1000);
}

function pressAt(i){
 neigh(i).forEach(function(n){grid[n]=!grid[n];});
}

function litCount(){return grid.filter(Boolean).length;}

function newCase(){
 solved=false;moves=0;startTs=null;
 clearInterval(timerInt);
 $('clock').textContent='00:00';
 $('fb').textContent='';
 $('winOv').classList.add('hidden');
 do{
   grid=new Array(SZ).fill(false);
   const k=12+Math.floor(Math.random()*6);
   for(let j=0;j<k;j++)pressAt(Math.floor(Math.random()*SZ));
 }while(litCount()===0||litCount()>17);
 moves=0;
 buildGrid();paint();
 loadBest();
 snd(440,.12);
}

function clickCell(i){
 if(solved)return;
 if(!startTs){
   startTs=Date.now();
   timerInt=setInterval(tick,500);
 }
 pressAt(i);
 moves++;
 snd(grid[i]?520:800,.08);
 paint();
 if(litCount()===0)win();
}

function hint(){
 if(solved)return;
 let bi=-1,bc=litCount();
 for(let i=0;i<SZ;i++){
   neigh(i).forEach(function(n){grid[n]=!grid[n];});
   const c=litCount();
   neigh(i).forEach(function(n){grid[n]=!grid[n];});
   if(c<bc){bc=c;bi=i;}
 }
 if(bi===-1)bi=Math.floor(Math.random()*SZ);
 moves+=5;paint();
 const cell=$('grid').children[bi];
 cell.classList.add('hintglow');
 setTimeout(function(){cell.classList.remove('hintglow');},1600);
}

function win(){
 solved=true;
 clearInterval(timerInt);
 const secs=startTs?(Date.now()-startTs)/1000:0;
 const b=JSON.parse(localStorage.getItem('noir-lights-best')||'null');
 let rec='';
 if(!b||moves<b.moves){saveBest(moves,secs);rec=' — رقم قياسي! 🥇';}
 const bb=JSON.parse(localStorage.getItem('noir-lights-best'));
 $('best').textContent=bb.moves+' نقلة';
 $('winStats').innerHTML='حللتها في '+moves+' نقلة • '+fmt(secs)+rec+'<br>الأفضل المسجل: '+bb.moves+' نقلة في '+fmt(bb.time);
 $('winOv').classList.remove('hidden');
 [520,660,780].forEach((f,i)=>setTimeout(()=>snd(f,.18),i*140));
}

loadBest();
newCase();
</script>
</body>
</html>
