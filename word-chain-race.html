<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سباق سلسلة الكلمات</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 min-h-screen flex items-center justify-center">
<div id="app" class="w-full max-w-md p-6 bg-white/90 rounded-3xl shadow-2xl text-center">
<div id="startScreen">
<h1 class="text-4xl font-black mb-4">⚡ سباق سلسلة الكلمات</h1>
<p class="text-slate-600 mb-6">اكتب كلمة تبدأ بآخر حرف من الكلمة السابقة خلال ٦٠ ثانية!</p>
<button id="startBtn" class="px-8 py-4 bg-orange-500 hover:bg-orange-400 text-white rounded-2xl text-xl font-bold shadow-lg">ابدأ اللعب</button>
<div class="mt-6 text-sm text-slate-500">الأفضل: <span id="bestDisplay">٠</span></div>
</div>
<div id="playScreen" class="hidden">
<div class="flex justify-between items-center mb-3 text-sm font-bold">
<span>الوقت: <span id="timer">٦٠</span>ث</span>
<span>النقاط: <span id="score">٠</span></span>
</div>
<div class="bg-yellow-100 rounded-xl p-4 mb-4">
<div class="text-slate-500 text-xs mb-1">الكلمة الحالية (انتهت بـ):</div>
<div id="currentWord" class="text-3xl font-black text-orange-600"></div>
</div>
<input id="wordInput" type="text" class="w-full text-center py-3 rounded-xl bg-slate-100 text-xl font-bold outline-none focus:ring-2 ring-orange-400 mb-3" placeholder="اكتب كلمة تبدأ بالحرف..." autocomplete="off">
<button id="submitBtn" class="px-8 py-3 bg-orange-500 hover:bg-orange-400 text-white rounded-xl text-lg font-bold">إرسال</button>
<div id="msg" class="text-sm h-6 mt-3"></div>
</div>
<div id="finishScreen" class="hidden">
<h2 class="text-3xl font-black mb-4">انتهى الوقت! ⏰</h2>
<p class="text-xl mb-4">كلمات صحيحة: <span id="finalScore">٠</span></p>
<p id="isNewBest" class="text-yellow-500 text-sm mb-6">🎖️ رقم قياسي جديد!</p>
<div class="text-slate-500 mb-6">الأفضل: <span id="finalBest">٠</span></div>
<button id="restartBtn" class="px-8 py-4 bg-orange-500 hover:bg-orange-400 text-white rounded-2xl text-xl font-bold">العب مرة أخرى</button>
</div>
</div>
<script>
let best,timeLeft,score,lastLetter,wordsUsed,inputTimer,intervalId,paused=false;
const WORDS=['بيت','باب','سيارة','هاتف','غرفة','منزل','كتاب','شمس','قمر','نجم','بحر','جبل','شجر','ورد','مطر','ثلج','سمك','دجاج','حليب','خبز','عنب','موز','تفاح','جزر','بصل','ملح','عسل','زيت','كنز','بطل','حارس','ملوك','كروم','نور','راقص','سباح','غارس','سوط','فرس','صقر','رعد','حديد','ذهب','لبن','نافذ','زجاج','جمل','مفتاح','حكيم'];
const STARTS=['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];
function init(){best=parseInt(sGet('word-chain-race-best')||'0')||0;document.getElementById('bestDisplay').textContent=best;}
function sGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let chainAudio;
function getChainAudio(){if(!chainAudio)chainAudio=new(window.AudioContext||window.webkitAudioContext)();return chainAudio;}
function tone(f,x,d){let o=getChainAudio().createOscillator(),g=getChainAudio().createGain();o.type=f;o.frequency.value=x;o.connect(g);g.connect(getChainAudio().destination);g.gain.setValueAtTime(0.13,getChainAudio().currentTime);g.gain.exponentialRampToValueAtTime(0.001,getChainAudio().currentTime+d);o.start();o.stop(getChainAudio().currentTime+d);}
function setScreen(s){document.getElementById('startScreen').classList.toggle('hidden',s!=='start');document.getElementById('playScreen').classList.toggle('hidden',s!=='play');document.getElementById('finishScreen').classList.toggle('hidden',s!=='finish');}
function toAr(n){return n.toLocaleString('ar-EG');}
function lastLetterOf(w){return w[w.length-1];}
document.addEventListener('keydown',function(e){
if(e.key==='p'||e.key==='P'){if(document.getElementById('playScreen').classList.contains('hidden'))return;paused=!paused;document.getElementById('msg').textContent=paused?'⏸ موقوف — اضغط P للمتابعة':'';return;}
});
function newRound(){document.getElementById('score').textContent=toAr(score);document.getElementById('wordInput').value='';document.getElementById('msg').textContent='';let newWord=startWord(lastLetter);document.getElementById('currentWord').textContent=newWord+' (َ'+lastLetter+' )';lastLetter=lastLetterOf(newWord);document.getElementById('wordInput').focus();}
function startWord(l){let opts=WORDS.filter(function(w){return w[w.length-1]===l&&wordsUsed.indexOf(w)===-1;});if(opts.length===0)opts=WORDS.filter(function(w){return w[w.length-1]===l;});let w=opts[Math.floor(Math.random()*opts.length)];wordsUsed.push(w);return w;}
function startGame(){wordsUsed=[];score=0;timeLeft=60;lastLetter='ا';paused=false;tone('sine',500,0.15);setScreen('play');newRound();document.getElementById('timer').textContent=toAr(timeLeft);clearInterval(intervalId);intervalId=setInterval(function(){if(paused)return;timeLeft--;document.getElementById('timer').textContent=toAr(timeLeft);if(timeLeft<=10)tone('square',300,0.1);if(timeLeft<=0){clearInterval(intervalId);finish();}},1000);}
document.getElementById('startBtn').onclick=function(){init();startGame();};
document.getElementById('submitBtn').onclick=submit;
document.getElementById('wordInput').onkeydown=function(e){if(e.key==='Enter')submit();};
function submit(){if(paused)return;let val=document.getElementById('wordInput').value.trim();if(val===''){document.getElementById('msg').textContent='⚠️ اكتب كلمة';return;}if(val[0]!==lastLetter){tone('sawtooth',200,0.2);document.getElementById('msg').textContent='❌ يجب أن تبدأ بـ '+lastLetter;return;}if(wordsUsed.indexOf(val)!==-1){tone('sawtooth',180,0.2);document.getElementById('msg').textContent='⚠️ هذه الكلمة استُخدمت';return;}score++;wordsUsed.push(val);tone('square',700,0.1);document.getElementById('msg').textContent='✅ ممتاز!';lastLetter=lastLetterOf(val);clearTimeout(inputTimer);inputTimer=setTimeout(function(){newRound();},600);}
function finish(){setScreen('finish');document.getElementById('finalScore').textContent=toAr(score);let nb=false;if(score>best){best=score;sSet('word-chain-race-best',String(best));nb=true;}document.getElementById('isNewBest').classList.toggle('hidden',!nb);document.getElementById('finalBest').textContent=toAr(best);tone('triangle',800,0.2);setTimeout(()=>tone('triangle',1000,0.2),150);}
document.getElementById('restartBtn').onclick=function(){setScreen('start');init();};
init();
</script>
</body>
</html>
