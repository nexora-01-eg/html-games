<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متاهة الغروب 🌅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;
background:linear-gradient(180deg,#fce4c0 0%,#f88d6b 55%,#9b5fa0 100%);
color:#3d1f14;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
h1{font-size:2rem;font-weight:900;text-shadow:0 2px 8px rgba(155,95,160,.3)}
.sub{font-size:.78rem;opacity:.7;margin-bottom:1.2rem}
.hud{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-bottom:1rem}
.hud span{font-size:.8rem;font-weight:700;padding:.2rem .65rem;background:rgba(255,255,255,.35);
border-radius:999px;backdrop-filter:blur(4px)}
.btn{font-family:inherit;background:#3d1f14;color:#fce4c0;border:none;padding:.55rem 1.6rem;
font-weight:900;font-size:.85rem;border-radius:999px;cursor:pointer;transition:all .08s;
box-shadow:0 4px 12px rgba(61,31,20,.3)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px)}
#maze{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:1rem auto}
.cell{width:54px;height:54px;border-radius:14px;border:2px solid rgba(61,31,20,.25);
background:rgba(255,255,255,.25);backdrop-filter:blur(4px);cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:1.4rem;
transition:all .18s;user-select:none}
.cell:hover{background:rgba(255,255,255,.5)}
.cell.path{background:rgba(61,31,20,.18);border-color:#3d1f14;transform:scale(1.08)}
.cell.current{background:rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.6)}
.cell.correct{background:rgba(74,222,128,.45);border-color:#16a34a}
.cell.wrong{background:rgba(239,68,68,.45);border-color:#dc2626;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.arrow{font-size:1.5rem;color:#3d1f14}
.msg{height:1.5rem;font-size:.85rem;font-weight:700;text-align:center;margin-top:.5rem}
</style>
</head>
<body>

<h1>🌅 متاهة الغروب</h1>
<p class="sub">شوف المسار وعيده بالضغط على الخلايا بالترتيب</p>

<div id="startScr" class="text-center">
<p style="font-size:.85rem;opacity:.8;margin-bottom:1.2rem">٧ جولات — المسار بيزيد والوقت بيقصر<br>.speed = points</p>
<button onclick="start()" class="btn">ابدأ الرحلة 🌅</button>
<p style="font-size:.7rem;opacity:.5;margin-top:.7rem">أفضل نتيجة: <b id="bestStart">—</b></p>
</div>

<div id="playScr" class="hidden text-center">
<div class="hud">
<span>جولة <b id="rzEl">١</b>/٧</span>
<span>⭐ <b id="scoreEl">٠</b></span>
<span>🔥 <b id="streakEl">٠</b></span>
<span>المسار: <b id="lenEl">٤</b></span>
</div>
<div id="maze"></div>
<div class="msg" id="rzMsg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const bestKey='sunset-maze-best';
let rz=0,score=0,streak=0,best=0,ac=null,over=true;try{best=+localStorage.getItem(bestKey)||0;}catch(e){}
$('bestStart').textContent=best?AR(best):'—';
function snd(f,d,type,g){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'triangle';o.frequency.value=f;v.gain.setValueAtTime(g||.04,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.1));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1));}catch(e){}}
function genPath(len){
const cells=[[2,2]];
const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
for(let step=0;step<len;step++){
let placed=false;
for(let a=0;a<20;a++){
const d=dirs[Math.floor(Math.random()*4)];
const lr=cells[cells.length-1];
const nr=lr[0]+d[0],nc=lr[1]+d[1];
if(nr>=0&&nr<5&&nc>=0&&nc<5&&!cells.some(c=>c[0]===nr&&c[1]===nc)){
cells.push([nr,nc]);placed=true;break;
}
}
if(!placed)return genPath(len);
}
return cells;
}
const ARROWS={'-1,0':'↑','1,0':'↓','0,-1':'←','0,1':'→'};
const DIR_LABEL={'-1,0':'فوق','1,0':'تحت','0,-1':'شمال','0,1':'جنوب'};
function start(){
rz=0;score=0;streak=0;
$('scoreEl').textContent='٠';$('streakEl').textContent='٠';
$('startScr').classList.add('hidden');
$('playScr').classList.remove('hidden');
nextRound();
}
function nextRound(){
const len=4+rz;
$('lenEl').textContent=AR(len);
$('rzEl').textContent=AR(rz+1);
$('rzMsg').textContent='';
const path=genPath(len);
const grid=Array.from({length:5},()=>Array(5).fill(null));
const dirMap={};
path.forEach(([r,c],i)=>{
if(i>0){
const dr=path[i][0]-path[i-1][0],dc=path[i][1]-path[i-1][1];
dirMap[r+','+c]=ARROWS[dr+','+dc];
}
});
renderGrid(grid,dirMap,path);
showFlash(path,dirMap,()=>{
let step=0;over=false;
document.querySelectorAll('#maze .cell').forEach(d=>{
d.onclick=()=>{
if(over)return;
const r=+d.dataset.r,c=+d.dataset.c;
const expected=path[step];
if(r===expected[0]&&c===expected[1]){
d.classList.add('correct');
d.textContent=step===0?'🏁':dirMap[r+','+c]||'·';
snd(500+step*60,.06,'sine',.03);
step++;
if(step>=path.length){
over=true;
const gain=path.length*40+Math.floor(Math.random()*50);
score+=gain;streak++;
$('scoreEl').textContent=AR(score);
$('streakEl').textContent=AR(streak);
$('rzMsg').textContent='✅ أحسنت! +'+AR(gain);
snd(660,.12,'triangle',.05);
setTimeout(()=>{rz++;rz>=7?finish():nextRound();},900);
}
}else{
d.classList.add('wrong');over=true;streak=0;
$('streakEl').textContent='٠';
$('rzMsg').textContent='❌ المسار خاطئ!';
snd(200,.18,'sawtooth',.04);
path.forEach(([pr,pc],i)=>{
const cd=document.querySelector(`#maze .cell[data-r="${pr}"][data-c="${pc}"]`);
if(cd){cd.classList.add('path');cd.textContent=i===0?'🏁':dirMap[pr+','+pc]||'·';}
});
setTimeout(()=>{rz++;rz>=7?finish():nextRound();},1400);
}
};
});
});
}
function renderGrid(grid,dirMap){
const m=$('maze');m.innerHTML='';
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
const d=document.createElement('div');
d.className='cell';d.dataset.r=r;d.dataset.c=c;
d.textContent='';
m.appendChild(d);
}
}
function showFlash(path,dirMap,cb){
const cells=document.querySelectorAll('#maze .cell');
let i=0;
function showNext(){
if(i>=path.length){
cells.forEach(d=>{d.classList.remove('path','current');d.textContent='';});
$('rzMsg').textContent='الآن عيّده!';
setTimeout(cb,300);
return;
}
cells.forEach(d=>{d.classList.remove('current');});
const[r,c]=path[i];
const cd=document.querySelector(`#maze .cell[data-r="${r}"][data-c="${c}"]`);
cd.classList.add('path','current');
cd.textContent=i===0?'🏁':dirMap[r+','+c]||'·';
snd(440+i*30,.06,'sine',.025);
i++;
setTimeout(showNext,Math.max(280,600-rz*30));
}
showNext();
}
function finish(){
over=true;
$('playScr').innerHTML=`
<div style="text-align:center;background:rgba(255,255,255,.4);backdrop-filter:blur(6px);
border-radius:20px;padding:2rem;max-width:320px">
<p style="font-size:2.5rem;margin-bottom:.3rem">🌅</p>
<h2 style="font-size:1.3rem;font-weight:900;margin-bottom:.3rem">الغروب خلص!</h2>
<p style="font-size:2rem;font-weight:900">${AR(score)}</p>
<p style="font-size:.8rem;opacity:.7;margin:.5rem 0" id="finMsg"></p>
<button onclick="location.reload()" class="btn">رحلة جديدة ↻</button>
</div>`;
const v=+localStorage.getItem(bestKey)||0;
$('finMsg').textContent=score>v&&score>0?'🏆 رقم قياسي جديد!':`أفضل نتيجة: ${AR(Math.max(v,score))}`;
if(score>v&&score>0){try{localStorage.setItem(bestKey,score);}catch(e){}}
[520,660,880].forEach((f,i)=>setTimeout(()=>snd(f,.13,'triangle'),i*110));
}
</script>
</body>
</html>
