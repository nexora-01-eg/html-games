<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>ترتيب الكرات المتقدم</title></head><body class="bg-gradient-to-b from-pink-100 to-purple-100 min-h-screen flex items-center justify-center font-sans"><div id="app" class="w-full max-w-lg p-4"><div id="start-screen" class="text-center text-pink-800"><h1 class="text-4xl font-bold mb-4">ترتيب الكرات المتقدم</h1><p class="text-pink-700 mb-6">رتّب كل الألوان بحيث تصبح كل أنبوبة بلون واحد!</p><p class="text-sm text-pink-600 mb-4">أفضل نتيجة: <span id="best-display">0</span></p><button onclick="startGame()" class="bg-pink-600 hover:bg-pink-700 text-white text-xl px-8 py-3 rounded-full">ابدأ</button></div><div id="play-screen" class="hidden"><div class="bg-white rounded-xl shadow-lg p-4 mb-4"><div class="flex justify-between text-pink-800 font-bold mb-3"><span>المستوى: <span id="level">1</span>/10</span><span>الحركات: <span id="moves">0</span></span></div><div id="tubes" class="flex flex-wrap justify-center gap-3 mb-2"></div><button onclick="undo()" class="w-full bg-pink-500 hover:bg-pink-600 text-white text-lg py-2 rounded-full font-bold">تراجع</button><button onclick="resetLevel()" class="w-full bg-pink-300 hover:bg-pink-400 text-pink-900 text-lg py-2 rounded-full font-bold mt-2">إعادة المستوى</button></div></div><div id="finish-screen" class="hidden text-center text-pink-800"><h2 class="text-3xl font-bold mb-4">أكملت الفرز!</h2><p class="text-2xl text-pink-600 mb-2">النقاط: <span id="finalScore">0</span></p><p class="text-pink-500 mb-2">أفضل نتيجة: <span id="finalBest">0</span></p><button onclick="showStart()" class="bg-pink-600 hover:bg-pink-700 text-white text-xl px-8 py-3 rounded-full mt-4">العودة</button></div></div><script>let level=1,playerScore=0,tubes=[],selected=-1,moveCount=0,history=[],audioCtx;const BCOL=['#ef4444','#3b82f6','#22c55e','#facc15','#a855f7','#ec4899'];const BSIZE=4;function $(id){return document.getElementById(id)}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(f,d,t){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function getBest(){try{return parseInt(localStorage.getItem('ball-sort-adv-best')||'0')||0}catch(e){return 0}}function setBest(v){try{localStorage.setItem('ball-sort-adv-best',v)}catch(e){}}function showScreen(s){['start-screen','play-screen','finish-screen'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden')}function showStart(){$('best-display').textContent=getBest();showScreen('start-screen')}function startGame(){level=1;playerScore=0;showScreen('play-screen');genLevel()}function genLevel(){let cols=Math.min(5,3+Math.floor((level-1)/3));let extra=level>=4?1:(level>=7?2:0);let nT=cols+extra+1;tubes=[];let balls=[];for(let c=0;c<cols;c++){for(let k=0;k<BSIZE;k++){balls.push(c)}}let i=balls.length;while(i>0){let j=Math.floor(Math.random()*i);i--;let t=balls[i];balls[i]=balls[j];balls[j]=t}let idx=0;for(let t=0;t<nT;t++){let tub=[];for(let k=0;k<BSIZE;k++){if(idx<balls.length){tub.push(balls[idx]);idx++}}tubes.push(tub)}moveCount=0;playerScore=0;selected=-1;history=[];$('level').textContent=level;$('moves').textContent='0';drawTubes()}function drawTubes(){let g=$('tubes');g.innerHTML='';for(let t=0;t<tubes.length;t++){let col=t%3===0?'bg-pink-100':(t%3===1?'bg-purple-100':'bg-rose-100');let d=document.createElement('div');d.id='tube-'+t;d.className='w-16 h-28 rounded-b-xl border-2 border-pink-300 flex flex-col-reverse items-center gap-0.5 p-1 '+col+(selected===t?' ring-4 ring-amber-400':'');for(let s=0;s<tubes[t].length;s++){let c=document.createElement('div');c.className='w-11 h-7 rounded-full';c.style.background=BCOL[tubes[t][s]];d.appendChild(c)}if(selected!==t)d.addEventListener('click',clicker(t));g.appendChild(d)}}function clicker(t){return function(){if(selected<0){if(tubes[t].length>0){selected=t;playSound(400,0.1,'triangle');drawTubes()}}else if(selected!==t){tryMove(selected,t)}else{selected=-1;drawTubes()}}}function topColor(t){return tubes[t].length?tubes[t][tubes[t].length-1]:-1}function tryMove(from,to){let c=topColor(from);if(c<0){selected=-1;drawTubes();return}if(tubes[to].length>=BSIZE){playSound(150,0.2,'sawtooth');selected=-1;drawTubes();return}if(tubes[to].length>0&&topColor(to)!==c){playSound(150,0.2,'sawtooth');selected=-1;drawTubes();return}history.push({tubes:JSON.parse(JSON.stringify(tubes)),from:from,to:to});tubes[from].pop();tubes[to].push(c);moveCount++;$('moves').textContent=moveCount;selected=-1;playSound(500,0.15,'triangle');drawTubes();checkWin()}function checkWin(){let done=true;for(let t=0;t<tubes.length;t++){if(tubes[t].length===0)continue;let c=tubes[t][0],same=true;for(let k=1;k<tubes[t].length;k++){if(tubes[t][k]!==c)same=false}if(tubes[t].length!==BSIZE||!same){done=false;break}}if(done){playerScore+=200+Math.max(0,100-moveCount+level*10);playSound(700,0.3,'sine');if(level>=10){let bs=getBest();if(playerScore>bs)setBest(playerScore);$('finalScore').textContent=playerScore;$('finalBest').textContent=getBest();showScreen('finish-screen')}else{level++;genLevel()}}}function undo(){if(history.length===0){playSound(220,0.12,'sawtooth');return}let h=history.pop();tubes=JSON.parse(JSON.stringify(h.tubes));moveCount=Math.max(0,moveCount-1);$('moves').textContent=moveCount;selected=-1;playSound(300,0.1,'sine');drawTubes()}function resetLevel(){genLevel()}showStart()</script></body></html>
