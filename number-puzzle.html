<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحجية الأرقام</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-900 min-h-screen flex items-center justify-center text-white">
<div id="app" class="w-full max-w-md p-6">
<div id="startScreen" class="text-center">
<h1 class="text-4xl font-black mb-4">🔢 أحجية الأرقام</h1>
<p class="text-indigo-200 mb-6">استنتج الأرقام الناقصة من مجموع الصفوف والأعمدة في ٥ ألغاز!</p>
<button id="startBtn" class="px-8 py-4 bg-purple-500 hover:bg-purple-400 rounded-2xl text-xl font-bold shadow-lg">ابدأ اللعب</button>
<div class="mt-6 text-sm text-indigo-300">الأفضل: <span id="bestDisplay">٠</span></div>
</div>
<div id="playScreen" class="hidden text-center">
<div class="flex justify-between items-center mb-4 text-sm">
<span>اللغز: <span id="puzzle">١</span>/٥</span>
<span>النقاط: <span id="score">٠</span></span>
</div>
<div id="puzzleGrid" class="grid grid-cols-3 gap-2 mx-auto max-w-xs mb-4"></div>
<div class="text-indigo-200 mb-2 text-sm">أدخل القيمة الناقصة في الخلية الصفراء:</div>
<input id="numInput" type="number" class="w-40 text-center py-3 rounded-xl bg-indigo-900 text-xl font-bold outline-none focus:ring-2 ring-purple-400 mb-3" placeholder="الرقم...">
<button id="checkBtn" class="px-8 py-3 bg-purple-500 hover:bg-purple-400 rounded-xl text-lg font-bold">تحقق</button>
<div id="msg" class="text-sm h-6 mt-3"></div>
</div>
<div id="finishScreen" class="hidden text-center">
<h2 class="text-3xl font-black mb-4">حللت الألغاز! 🎉</h2>
<p class="text-xl mb-4">نتيجتك: <span id="finalScore">٠</span></p>
<p id="isNewBest" class="text-yellow-400 text-sm mb-6">🎖️ رقم قياسي جديد!</p>
<div class="text-indigo-300 mb-6">الأفضل: <span id="finalBest">٠</span></div>
<button id="restartBtn" class="px-8 py-4 bg-purple-500 hover:bg-purple-400 rounded-2xl text-xl font-bold">العب مرة أخرى</button>
</div>
</div>
<script>
let ctx,best,puzzle,score,gridData,blankIdx,answer,timerId;
function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();try{best=parseInt(localStorage.getItem('num-puzzle-best')||'0')||0;}catch(e){best=0;}document.getElementById('bestDisplay').textContent=best;}
function tone(f,x,d){let o=ctx.createOscillator(),g=ctx.createGain();o.type=f;o.frequency.value=x;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d);}
function setScreen(s){document.getElementById('startScreen').classList.toggle('hidden',s!=='start');document.getElementById('playScreen').classList.toggle('hidden',s!=='play');document.getElementById('finishScreen').classList.toggle('hidden',s!=='finish');}
function toAr(n){return n.toLocaleString('ar-EG');}
function genPuzzle(){let maxVal=5+puzzle*2;let cells=[];for(let i=0;i<9;i++)cells.push(1+Math.floor(Math.random()*maxVal));let r1=cells[0]+cells[1]+cells[2];let r2=cells[3]+cells[4]+cells[5];let r3=cells[6]+cells[7]+cells[8];let sums=[r1,r2,r3];blankIdx=Math.floor(Math.random()*9);answer=cells[blankIdx];cells[blankIdx]=null;gridData={cells:cells,sums:sums};}
function renderPuzzle(){let g=document.getElementById('puzzleGrid');g.innerHTML='';for(let i=0;i<9;i++){let d=document.createElement('div');let val=gridData.cells[i];let isBlank=(i===blankIdx);d.className='aspect-square rounded-xl flex items-center justify-center text-xl font-bold '+(isBlank?'bg-yellow-400 text-black':'bg-indigo-800');d.textContent=isBlank?'؟':toAr(val);g.appendChild(d);}document.getElementById('msg').textContent='';document.getElementById('numInput').value='';}
function newPuzzle(){if(puzzle>5){finish();return;}document.getElementById('puzzle').textContent=toAr(puzzle);genPuzzle();renderPuzzle();tone('sine',600,0.1);}
document.getElementById('startBtn').onclick=function(){if(!ctx)init();puzzle=1;score=0;tone('sine',500,0.15);setScreen('play');newPuzzle();};
document.getElementById('checkBtn').onclick=check;
document.getElementById('numInput').onkeydown=function(e){if(e.key==='Enter')check();};
function check(){let val=parseInt(document.getElementById('numInput').value,10);if(isNaN(val)){document.getElementById('msg').textContent='⚠️ أدخل رقماً';return;}if(val===answer){score+=100+puzzle*20;tone('square',700,0.1);setTimeout(()=>tone('square',900,0.1),100);document.getElementById('msg').textContent='✅ صحيح!';}else{tone('sawtooth',200,0.2);document.getElementById('msg').textContent='❌ الصحيح: '+toAr(answer);}document.getElementById('score').textContent=toAr(score);clearTimeout(timerId);timerId=setTimeout(function(){puzzle++;newPuzzle();},1200);}
function finish(){setScreen('finish');document.getElementById('finalScore').textContent=toAr(score);let nb=false;if(score>best){best=score;try{localStorage.setItem('num-puzzle-best',String(best));}catch(e){}nb=true;}document.getElementById('isNewBest').classList.toggle('hidden',!nb);document.getElementById('finalBest').textContent=toAr(best);tone('triangle',800,0.2);setTimeout(()=>tone('triangle',1000,0.2),150);}
document.getElementById('restartBtn').onclick=function(){setScreen('start');init();};
init();
</script>
</body>
</html>
